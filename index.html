   "미쓰코시에는 일본인뿐 아니라 조선인 고객도 찾았습니다. 종로에서는 조선인이 경영하는 화신백화점이 경쟁했고, 남촌에는 일본계 백화점들이 자리했습니다. 그러나 미쓰코시의 규모와 자본은 매우 컸어요. 서울역사박물관에는 미쓰코시 경성점의 특제 보관함과 나전으로 만든 원형 합 세트가 소장되어 있습니다. 상품과 포장에도 백화점 이름이 붙었고, 쇼핑을 마친 뒤 집으로 가져간 물건에도 그 이름이 남았습니다.",
   "해방 뒤 일본인 소유 재산이 정리되면서 이 건물은 동화백화점으로 불리게 되었습니다. 한국전쟁 때에는 미군이 이용하는 물품 판매시설인 피엑스로 쓰였어요. 옛 사진 속 건물에 군인과 군용 차량이 등장하는 것은 이 시기의 모습입니다. 1963년 삼성에 인수된 뒤 신세계백화점이라는 이름을 얻었습니다. 상품을 진열하던 건물의 외형은 이어졌지만, 경영 주체와 주요 이용자는 이렇게 달라졌습니다.",
   "오늘의 매장은 여러 차례 보수하고 확장한 결과입니다. 본관의 창문 배열과 모서리를 1930년대 사진과 비교해 보면, 오래 이어진 외관의 특징을 찾을 수 있어요. 당시의 옥상정원과 식당은 손님을 오래 머물게 하려던 시설이었습니다. 지금도 백화점 안에서 쇼핑하고 식사하며 시간을 보내는 방식은 익숙하죠. 이 본관에서는 그 생활 방식이 서울에 자리 잡아 가던 초기의 건물을 직접 볼 수 있습니다."
  ]},
  {no:44, region:"center", type:"전시관", name:"안중근의사기념관", addr:"소월로 91", audio:"audio/44_안중근의사기념관.mp3", script:[
   "안중근의사기념관은 반투명한 유리 기둥 열두 개가 모인 듯한 건물입니다. 밖에서 기둥 형태를 살펴보세요. 안중근을 비롯한 열두 사람이 독립운동에 헌신하기로 맹세한 동의단지회를 표현했습니다. 안중근을 포함한 열두 사람이 왼손 넷째 손가락의 첫마디를 끊고 뜻을 다진 일이 건축의 모양으로 이어진 겁니다. 오늘 관람에서는 이 건물과 전시 속 손도장을 연결해 볼 수 있어요.",
   "기념관은 1970년에 처음 문을 열었고, 순국 100주년인 2010년에 지금의 건물을 새로 지었습니다. 남산의 이 일대는 일제강점기에 조선신궁이 차지했던 영역입니다. 맞은편 한양도성유적전시관에는 신궁 배전의 기초가 남아 있어요. 일본 황실에 참배하도록 했던 신궁이 사라진 자락에, 일본의 침략에 맞섰던 안중근의 생애를 전하는 기념관이 들어섰습니다.",
   "안중근의 활동은 학교를 운영하는 일에서 시작해 의병전쟁과 하얼빈 의거로 이어집니다. 1905년 을사늑약 뒤에는 재산을 기울여 진남포의 삼흥학교와 돈의학교를 통한 교육에 힘썼어요. 나라를 되찾으려면 사람을 길러야 한다고 본 것입니다. 이후 연해주로 건너가 의병으로 싸웠고, 1909년 동지들과 단지동맹을 맺었습니다. 전시의 생애 연표에서 학교 이름과 의병 활동 시기를 찾아보면 하얼빈에 가기 전의 안중근이 보입니다.",
   "1909년 10월 26일 안중근은 하얼빈역에서 이토 히로부미를 사살했습니다. 이토는 대한제국의 외교권을 빼앗는 데 앞장섰고 초대 한국통감을 지낸 인물이었습니다. 안중근은 현장에서 체포되어 뤼순감옥에 수감되었습니다. 재판에서는 자신의 행동을 대한의군의 군인으로서 벌인 전쟁 행위라고 주장했고, 이토가 한국의 주권을 침해하고 동양의 평화를 해쳤다고 설명했습니다.",
   "옥중에서 남긴 친필 글씨를 ‘유묵’이라고 합니다. 유묵 자료에서는 큰 글자뿐 아니라 옆에 적힌 이름과 날짜, 손도장까지 살펴보세요. 손도장에는 왼손 넷째 손가락 끝이 짧은 모양이 뚜렷합니다. 건물 밖에서 본 열두 기둥이 가리키는 단지동맹의 흔적이죠. 직접 쓴 글씨와 손을 찍은 자국이 나란히 있어, 글을 쓴 사람이 누구인지 강하게 드러납니다.",
   "감옥에서 안중근은 자신의 생애를 적은 ‘안응칠역사’를 썼습니다. 어린 시절과 가족 이야기부터 천주교 신앙, 교육 활동, 의병전쟁, 하얼빈 의거와 재판까지 기록했어요. 전시에 나오는 사진과 연표를 이 자서전의 내용과 연결하면, 사건 사이의 시간이 채워집니다. 안중근은 자신이 어떤 과정을 거쳐 의거에 이르렀는지를 글로 남겼습니다.",
   "또 하나의 옥중 저술은 끝맺지 못한 ‘동양평화론’입니다. 이 글은 새 기술과 무기가 사람을 대량으로 죽이고 젊은이들이 전쟁에서 희생되는 현실을 비판합니다. 일본의 한국 침략이 계속되는 한 동아시아의 평화도 이루기 어렵다고 보았어요. 한국과 중국, 일본이 서로 협력할 길을 구상했지만, 1910년 3월 26일 사형이 집행되면서 집필은 중단되었습니다. 안중근이 말한 평화에는 한국의 독립이 전제되어 있었습니다.",
   "유묵을 볼 때 글의 뜻 하나를 골라 천천히 읽어보세요. 화면에 크게 제시된 글씨나 설명 자료를 이용하면 손도장과 작은 글자도 찾기 쉽습니다. 의거 뒤 감옥에서 남긴 기록에는 앞으로 지키고 싶은 가치가 적혀 있어요. 건물의 열두 기둥은 1909년 동지들의 맹세를, 유묵의 손도장은 그 맹세에 참여한 안중근 자신의 몸을 가리킵니다."
  ]},
  {no:45, region:"center", type:"터/표지석", name:"조선신궁 터(한양도성유적전시관)", addr:"소월로 99", audio:"audio/45_조선신궁터.mp3", script:[
   "한양도성유적전시관의 관람길 아래에는 발굴된 성벽이 길게 이어집니다. 위로 높이 다시 쌓은 성곽과 달리, 이곳에서는 땅속에 묻혔던 성벽의 아랫부분을 내려다보게 됩니다. 돌로 쌓은 성벽 사이에는 콘크리트 건물 기초와 분수대도 있어요. 각각 한양도성, 조선신궁, 남산식물원 시절의 시설입니다. 안내판의 배치도와 발밑의 형태를 맞추어 보면 이 장소가 어떻게 바뀌었는지 따라갈 수 있습니다.",
   "한양도성은 1396년 처음 축조되었습니다. 이후에도 무너진 곳을 고치고 다시 쌓으며 수도의 경계를 유지했어요. 이곳에서 발굴한 성벽 길이는 약 189미터입니다. 태조 때 쌓은 부분, 세종 때 고친 부분, 숙종 이후의 부분이 이어져 있습니다. 돌의 크기와 다듬은 모양, 줄을 맞추어 쌓은 방식이 조금씩 달라요. 한 구간을 보수하면서 앞 시대의 성벽을 어떻게 이용했는지도 확인할 수 있습니다.",
   "글자가 새겨진 성돌, ‘각자성석’도 살펴보세요. 공사를 맡은 지역이나 담당자, 구간을 돌에 기록했습니다. 이곳에서 발견된 ‘내자육백척’이라는 글은 천자문의 ‘내’ 자로 표시한 구간과 공사 길이를 가리킵니다. 성을 쌓는 큰 공사를 여러 구간으로 나누어 맡겼던 거예요. 임시 나무기둥을 박았던 구멍도 발굴되어, 작업이 끝난 성벽뿐 아니라 공사를 하던 과정의 흔적까지 남았습니다.",
   "1925년 조선신궁이 완공되면서 이 일대의 성벽은 크게 훼손되었습니다. 조선신궁은 일본 황실의 조상신으로 여긴 아마테라스와 메이지 천황을 모신 시설이었어요. 일본은 조선인에게도 신궁 참배를 요구했습니다. 학교 학생들이 단체로 남산에 올라 참배하는 모습이 당시 사진에 남아 있습니다. 참배를 강요하는 정책은 종교적 이유 등으로 이를 거부한 사람들과 학교에 직접적인 압박이 되었습니다.",
   "전시장에 남은 콘크리트 기초는 조선신궁의 ‘배전’ 자리입니다. 신을 모신 본전 앞에서 사람들이 절하며 참배하던 건물이었어요. 기초가 만드는 네모난 윤곽을 보면 건물이 차지한 면적을 짐작할 수 있습니다. 옛 신궁 사진이나 배치도에서 배전의 위치를 찾고, 그 아래로 지나던 도성의 선을 따라가 보세요. 성벽을 철거하고 신궁 시설을 세운 관계가 발굴 현장에 남아 있습니다.",
   "방공호 입구도 일제강점기에 만들어진 시설입니다. 공중 공격을 피하려고 땅속에 방과 긴 통로를 마련했어요. 일본은 태평양전쟁을 앞두고 경성에 대규모로 방공호를 만들 계획을 세웠고, 이곳의 시설도 그 시기의 것입니다. 내부는 안전상 공개하지 않아 입구와 안내도로 살펴보게 됩니다. 참배 시설인 신궁 가까이에 전쟁에 대비한 방공호가 놓여 있었습니다.",
   "해방 후 신궁은 철거되었습니다. 이어 이승만 동상이 세워졌다가 4·19혁명 뒤 철거되었고, 1960년대 말에는 식물원과 분수대가 들어섰습니다. 남아 있는 분수대의 둥근 테두리를 보세요. 사람들은 이곳을 가족 나들이 장소로 찾았고, 식물원과 동물원을 구경했습니다. 그들이 걷던 광장 아래에는 훼손된 도성의 아랫부분이 묻혀 있었습니다.",
   "2006년 식물원이 철거된 뒤 발굴조사가 진행되었고, 2013년과 2014년 조사에서 이 구간의 성벽과 신궁 기초가 드러났습니다. 서울시는 유적을 보존하고 관람길과 보호시설을 설치해 2020년 공개했어요. 돌 성벽을 따라 걷다가 콘크리트 기초와 둥근 분수대가 나타나는 순서를 눈여겨보세요. 공원에서 보던 시설의 밑까지 살펴볼 수 있게 된 것은 이 발굴 덕분입니다."
  ]},
  {no:46, region:"center", type:"터/표지석", name:"김익상 의거 터(남산 조선총독부 터)", addr:"소파로 126 서울창조산업센터 입구", audio:"audio/46_김익상의거터.mp3", script:[
   "남산 소파로의 이 일대에는 초기 조선총독부 청사가 있었습니다. 원래 1907년부터 통감부 청사로 사용하던 건물이에요. 1910년 강제병합 뒤에는 간판을 조선총독부로 바꾸어 사용했습니다. 1926년 경복궁의 새 청사로 옮겨가기 전까지 식민 통치를 담당한 중심 관청이 이 남산 자락에 있었습니다. 오늘은 건물이 사라진 터에서, 청사 안으로 들어간 의열단원 김익상의 이야기를 들어보겠습니다.",
   "김익상은 기계를 다루던 기술자였습니다. 서울의 담배회사에서는 기계감독으로 일했고, 상하이에서는 전차회사에서 일했어요. 한때는 비행사가 되려고 중국 광둥으로 갔지만, 내전으로 비행학교가 문을 닫아 뜻을 이루지 못했습니다. 이후 베이징에서 김원봉이 이끄는 의열단에 들어갔습니다. 공장과 전차회사에서 쌓은 경험은 총독부에 들어갈 때 전기수리공으로 위장하는 데 이어졌습니다.",
   "1921년 9월, 김익상은 총독부를 공격하기 위해 국내로 들어왔습니다. 서울에 도착해 이태원의 동생 집에서 하룻밤을 보냈어요. 독립운동사 연구에 따르면 그날 밤 가족에게 다음 날 거사할 계획을 알렸다고 합니다. 먼 중국에서 돌아온 가족을 만난 자리가 의거를 앞둔 마지막 준비의 시간이 된 겁니다. 이튿날인 9월 12일, 그는 일본인 전기수리공 차림으로 남산의 총독부 청사에 들어갔습니다.",
   "김익상은 2층으로 올라가 비서과에 폭탄을 던졌고, 이어 회계과장실에도 폭탄을 던졌습니다. 비서과 쪽 폭탄은 터지지 않았지만 회계과장실에서는 폭발이 일어났어요. 당시 신문에는 폭발로 훼손된 실내의 사진이 실렸습니다. 오늘 터에서 건물 모습을 찾기 어렵다면 이 사진을 보면 됩니다. 총독부라는 큰 관청 안의 사무실이 공격받았다는 사실을 보여주는 자료입니다.",
   "폭발 뒤 김익상은 현장을 빠져나왔습니다. 송상도가 남긴 ‘기려수필’에는 헌병이 무슨 소리냐고 물었을 때 김익상이 모르는 척하고 달아났다는 이야기가 실려 있어요. 이후 작업자 차림으로 옷을 바꾸고 열차를 타 평양으로 갔다가 중국으로 돌아갔습니다. 일본 경찰은 곧바로 그를 잡지 못했습니다. 이 사건을 일으킨 사람이 김익상이라는 사실은 이듬해 상하이의 의거 뒤에 드러났습니다.",
   "1922년 3월 28일, 김익상은 상하이 황푸탄 부두에서 오성륜, 이종암과 일본 육군대장 다나카 기이치를 공격했습니다. 다나카는 살아남았고, 총격 과정에서 영국인 여성이 숨졌습니다. 김익상은 체포되어 일본으로 압송되었습니다. 남산에서는 청사를 빠져나와 국경까지 넘었지만, 이번에는 긴 수감생활이 시작되었어요. 사형이 선고되었다가 여러 차례 감형을 받았고, 오랜 옥고 뒤에야 귀국했습니다.",
   "출옥 후에는 이태원의 조카 집에 머물렀다고 전해집니다. 그런데 일본 형사에게 다시 연행된 뒤 행방이 알려지지 않았습니다. 마지막 모습에 대해서는 자료마다 차이가 남아 있어요. 남산 의거 당시의 보도 사진과 일본 경찰이 작성한 감시대상 인물카드에는 그의 활동과 모습이 기록되어 있습니다. 사진 속 얼굴과 공장에서 일했던 경력까지 살펴보면, 총독부에 들어간 전기수리공이 어떤 사람이었는지 조금 더 구체적으로 알 수 있습니다.",
   "이곳에는 통감부 청사 터와 김익상 의거를 알리는 표석이 설치되었지만, 주변 공사로 보이는 범위가 달라질 수 있습니다. 허용된 보도에서 옛 청사 사진을 현재 지형과 비교해 보세요. 경사진 남산 자락에 관청이 들어서 있던 모습이 보입니다. 김익상의 투탄 의거가 벌어진 때는 1921년, 총독부가 경복궁으로 옮겨가기 다섯 해 전이었습니다."
  ]},
  {no:47, region:"center", type:"터/표지석", name:"통감관저 터(위안부 기억의 터)", addr:"퇴계로26가길 6", audio:"audio/47_통감관저터위안부기억의터.mp3", script:[
   "남산 예장자락의 기억의 터에는 보라색과 은색의 가느다란 조형물들이 서 있습니다. 일본군 ‘위안부’ 피해자를 기리는 작품 ‘빛줄기’예요. 보라색 기둥에는 피해자들의 이름이 새겨져 있습니다. 그 사이에서 이름이 없는 은색 기둥도 찾아보세요. 피해 사실을 신고하거나 이름을 남기지 못한 사람들을 위해 마련한 자리입니다.",
   "이곳에는 일본 통감이 거처하던 통감관저가 있었습니다. 1890년대 일본공사관으로 지은 건물을 통감부 설치 뒤 관저로 사용했어요. 1910년 8월 22일, 대한제국 내각총리대신 이완용과 일본 통감 데라우치 마사타케가 이 건물에서 강제병합조약에 서명했습니다. 일주일 뒤인 8월 29일 조약이 공포되었습니다. 우리가 경술국치일로 기억하는 날이죠. 병합 뒤에는 총독관저로 쓰였고, 지금은 ‘통감관저 터’라고 적힌 표석이 건물이 있던 곳을 알립니다.",
   "이 터에는 오래된 동상의 받침돌도 남아 있습니다. 그런데 글자가 거꾸로 되어 있어요. ‘거꾸로 세운 동상’이라는 이름의 기념물입니다. 원래는 일본 외교관 하야시 곤스케의 동상을 받치던 돌이었어요. 하야시는 대한제국의 외교권을 빼앗은 1905년 을사늑약 체결에 앞장섰습니다. 일제강점기에는 그런 공적을 기린다며 그의 동상을 세웠습니다.",
   "해방 뒤 동상은 파괴되었지만 받침돌 일부는 남았습니다. 2006년에 발견된 돌 세 점에는 ‘남작 하야시 곤스케 군상’이라는 글자가 새겨져 있었어요. 이 돌을 모아 2015년 8월 22일 거꾸로 설치했습니다. 돌 아래 반사면에 비친 글씨는 다시 읽을 수 있는 방향으로 나타납니다. 한때 침략에 앞장선 인물을 높이 올려놓았던 받침을 뒤집어, 그 인물과 그가 한 일을 알리고 있습니다.",
   "이듬해인 2016년 8월 29일, 시민 모금으로 이 자리에 일본군 ‘위안부’ 기억의 터가 문을 열었습니다. 일본군은 전쟁 중 여성들을 군 위안소에 동원해 성폭력을 가했습니다. 살아 돌아온 피해자들은 오랫동안 자신의 경험을 이야기하기 어려웠고, 뒤늦게 증언에 나서 일본 정부의 책임 인정과 사죄를 요구했습니다. 피해자들의 뜻에 따라 시민들이 기금을 모은 것은 그 증언을 듣고 기리는 장소를 마련하기 위해서였어요.",
   "지금 보이는 조형물은 2025년에 새롭게 조성한 것입니다. 보라색 ‘빛줄기’들은 전체적으로 나비가 날아가는 모양으로 배치했습니다. 가까이에서는 한 사람씩의 이름을 읽고, 조금 떨어져서는 기둥들이 이루는 형태를 볼 수 있어요. 피해자들의 증언을 담은 ‘빛의 증언’에는 어떤 일을 겪었는지 본인이 들려준 이야기가 실려 있습니다. 이름 옆에서 그 사람의 경험을 읽을 수 있도록 한 구성입니다.",
   "이곳에 새겨진 ‘기억하지 않는 역사는 되풀이된다’라는 문장도 찾아보세요. 주변에는 조약에 서명한 관저의 표석, 거꾸로 세운 동상 받침, 피해자 이름을 새긴 기둥이 놓여 있습니다. 관저 표석에는 나라의 주권을 빼앗긴 날짜가, 동상 받침에는 그 일에 가담한 인물의 이름이 남았습니다. 새로 세운 보라색 기둥에는 오랫동안 자신의 피해를 말하기 어려웠던 여성들의 이름을 한 명씩 새겼습니다."
  ]},
  {no:48, region:"center", type:"터/공원/표지석", name:"장충단공원(박문사 터)", addr:"동호로 257-10", audio:"audio/48_장충단공원.mp3", script:[
   "장충단공원에서는 먼저 수표교 곁의 장충단비를 찾아보세요. 앞면에는 ‘장충단’이라는 큰 글자 세 자가 세로로 새겨져 있습니다. 1900년 고종이 나라를 위해 숨진 이들을 기리는 제단을 세우면서 만든 비석이에요. 앞의 글씨는 당시 황태자였던 훗날의 순종이 썼습니다. 뒷면에는 민영환이 짓고 쓴 143자의 비문이 남아 있어요. 한 비석의 앞뒤에 황태자와 신하의 글씨가 각각 새겨진 겁니다.",
   "장충단 건립의 계기는 1895년 을미사변이었습니다. 일본 세력이 경복궁에 침입해 명성황후를 살해할 때, 시위대장 홍계훈과 궁내부대신 이경직 등도 목숨을 잃었어요. 고종은 이들을 기리는 국가 제사를 마련했습니다. 처음에는 군인들을 중심으로 제사를 지내다가, 1901년부터 이경직 같은 문신과 임오군란·갑신정변 때 숨진 신하들까지 제사 대상에 포함했습니다. 장충단이 있던 곳은 원래 군영인 남소영의 자리였습니다.",
   "일제의 압박으로 1908년 제사가 중단되었고, 1910년 강제병합 뒤에는 장충단이 폐지되었습니다. 비석도 뽑혀 나갔어요. 이후 이 일대에 벚나무를 심고 산책하는 공원을 만들었습니다. 1932년에는 공원 동쪽 언덕에 이토 히로부미를 추모하는 사찰, 박문사가 들어섰습니다. 지금의 신라호텔 부지에 해당하는 곳이에요. 일본의 침입에 희생된 이들을 기리던 장충단 가까이에, 한국 침략을 이끈 인물을 위한 사찰을 세운 것입니다.",
   "‘박문’은 이토 히로부미의 이름을 한자로 읽은 말입니다. 언덕도 이토의 호를 따 ‘춘무산’이라고 불렀어요. 박문사에는 조선 왕실의 건물과 부재를 옮겨 썼습니다. 경복궁에서 왕의 초상화를 모시던 선원전, 남별궁에 있던 석고각 등이 박문사 건축에 이용되었습니다. 왕실이 쓰던 건축물을 해체해 이토를 추모하는 시설에 사용한 것이죠.",
   "그 가운데 경희궁의 정문 흥화문은 행방을 직접 따라가 볼 수 있습니다. 1932년 박문사로 옮겨 사찰 정문으로 썼고, ‘경춘문’이라는 새 현판을 달았습니다. 궁궐 정문이 절의 문으로 바뀐 거예요. 해방 뒤에도 이 일대 영빈관의 문으로 사용되다가 1988년 경희궁으로 돌아갔습니다. 원래의 박문사는 사라졌지만, 박문사의 옛 사진에는 흥화문이 박문사 입구에 서 있던 모습이 남아 있습니다.",
   "장충단비도 여러 번 자리를 옮겼습니다. 해방 뒤 지금의 호텔 부지 쪽에 다시 세웠고, 1969년에 수표교 서쪽의 현재 자리로 옮겼어요. 가까운 돌다리 수표교는 본래 청계천에 있던 다리입니다. 청계천을 덮어 도로를 만드는 과정에서 옮겨져 이 공원에 자리 잡았습니다. 비석은 옛 제단의 흔적이고, 다리는 청계천에서 건너온 유산입니다. 다리의 돌 난간과 교각도 천천히 살펴보세요.",
   "공원에는 ‘한국유림독립운동파리장서비’도 있습니다. 긴 이름을 풀어보면, 1919년 유림이 파리강화회의에 한국의 독립을 요구하는 서한을 보낸 일을 기리는 비석입니다. 유학자 137명이 이름을 올렸어요. 공원을 걷다 보면 을미사변 희생자를 기린 비석에서 출발해, 외국에 독립을 호소했던 사람들의 기념비까지 이어집니다.",
   "‘장충단, 기억의 공간’ 전시실이 열려 있다면 당시 사진도 살펴보세요. 제사를 지내던 장충단과 나무가 우거진 공원, 언덕 위 박문사가 사진마다 다른 모습으로 나타납니다. 특히 박문사 입구의 문과 경희궁 흥화문의 모습을 비교해 보면 좋겠습니다. 지금은 서로 떨어진 두 장소를, 한때 옮겨 다닌 궁궐 문 하나가 연결해 줍니다."
  ]},
  {no:49, region:"center", type:"묘역", name:"효창공원(독립운동가 묘역)", addr:"임정로 26", audio:"audio/49_효창공원.mp3", script:[
   "효창공원의 삼의사 묘역에는 봉분 네 기가 나란히 놓여 있습니다. 이봉창, 윤봉길, 백정기, 그리고 안중근의 이름을 찾아보세요. 세 의사의 유해를 모신 무덤 옆에 안중근의 가묘를 마련한 것입니다. 가묘는 유해를 모시지 못한 채 만들어 둔 무덤을 말해요. 안중근의 유해가 돌아오면 이곳에 안장하려고 비워 둔 자리입니다.",
   "이 언덕은 본래 조선 왕실의 묘역이었습니다. 정조의 맏아들 문효세자와 그의 어머니 의빈 성씨 등이 묻힌 효창원이었어요. 일제강점기에는 일부 땅에 골프장이 들어서고 공원으로 바뀌기 시작했습니다. 1944년 왕실의 무덤들은 고양 서삼릉으로 옮겨졌습니다. 이후 해방을 맞은 뒤, 왕실 묘소가 떠난 자리에 독립운동가들을 모시게 됩니다.",
   "일본에 남아 있던 세 의사의 유해를 고국으로 모셔오는 일을 추진한 사람은 김구였습니다. 이봉창은 1932년 도쿄에서 일본 천황이 탄 마차를 향해 폭탄을 던졌고, 윤봉길은 같은 해 상하이 훙커우공원의 일본군 행사장에서 의거를 일으켰습니다. 두 사람 모두 김구가 조직한 한인애국단의 단원이었고, 체포된 뒤 일본에서 처형되었습니다. 김구에게 유해 봉환은 자신이 의거를 준비하며 만났던 동지들을 고국에 모시는 일이기도 했습니다.",
   "백정기는 다른 독립운동 조직에서 활동했습니다. 이회영과 신채호 등의 영향을 받아 아나키즘, 곧 국가 권력의 강제를 없애고 개인의 자유를 중시하는 사상을 받아들였어요. 중국과 일본의 동지들과도 협력했습니다. 1933년 상하이의 음식점 육삼정에서 일본 외교관을 공격하려다가 실행 전에 체포되었습니다. 일본에서 무기형을 받고 복역하던 중 병으로 숨졌어요. 이렇게 서로 다른 길을 걸었던 세 사람의 유해가 1946년, 국민장을 거쳐 효창공원에 안장되었습니다.",
   "안중근의 가묘도 이때 조성했습니다. 안중근은 1910년 뤼순감옥에서 순국했지만 유해의 위치를 찾지 못했습니다. 김구는 세 의사를 모시는 묘역에 안중근의 자리도 마련해 두었어요. 네 봉분은 비슷한 모습으로 놓여 있지만, 안중근의 묘비 앞에는 아직 유해를 모시지 못했다는 사정이 남아 있습니다. 묘역 안내판에서 ‘가묘’라는 두 글자를 눈여겨보세요.",
   "공원 안의 임정요인 묘역에는 이동녕, 차리석, 조성환이 잠들어 있습니다. 이동녕은 대한민국임시정부의 지도자로 활동했고, 차리석은 비서장으로 정부의 실무를 맡았습니다. 중국에서 숨진 두 사람의 유해를 1948년 이곳으로 모셔 왔어요. 임시정부 군무부장을 지낸 조성환은 해방 뒤 귀국했다가 세상을 떠나 같은 묘역에 안장되었습니다. 세 묘비의 이름은 망명 중에도 임시정부를 유지했던 사람들의 이름입니다.",
   "동지들의 유해를 모으던 김구도 이곳에 묻혔습니다. 1949년 6월 26일 경교장에서 암살된 뒤, 7월 5일 국민장을 치르고 효창공원에 안장되었어요. 해방 뒤 남북에 각각 정부가 세워지는 것을 막으려 했지만 뜻을 이루지 못한 채 세상을 떠났습니다. 김구 묘역 가까이에는 그의 생애와 임시정부 활동을 전시하는 백범김구기념관이 자리합니다.",
   "공원의 사당인 의열사에는 이곳에 유해를 모신 일곱 사람의 영정이 봉안되어 있습니다. 1990년에 사당을 세우고 이듬해 영정을 모셨어요. 내부가 열려 있을 때는 묘비에서 읽은 이름을 얼굴과 연결해 볼 수 있습니다. 세 의사, 임시정부 요인 세 사람, 그리고 김구입니다. 묘역마다 따로 서 있던 이름들을, 의열사에서는 한자리의 일곱 초상으로 만납니다."
  ]},
  {no:50, region:"center", type:"전시관", name:"백범김구기념관", addr:"임정로 26", audio:"audio/50_백범김구기념관.mp3", script:[
   "백범김구기념관 중앙홀에는 큰 태극기를 배경으로 앉아 있는 김구의 동상이 있습니다. 먼저 얼굴과 두 손의 모습을 살펴보세요. 2002년 문을 연 이 기념관은 효창공원 묘역 곁에 자리합니다. 1층에서는 김구의 어린 시절과 교육·구국운동을, 2층에서는 대한민국임시정부 활동과 해방 이후의 삶을 따라가게 됩니다.",
   "김구는 1876년 황해도에서 태어났습니다. 청년 시절에는 동학에 참여했고, 이후 학교를 세우고 학생들을 가르치는 교육운동에 힘썼어요. 1907년에는 비밀결사 신민회에 가입했습니다. 감옥에서 지내던 때에는 ‘백범’이라는 호를 정했습니다. 당시 낮은 신분으로 취급받던 백정의 ‘백’과 평범한 사람인 범부의 ‘범’을 가져왔어요. 누구나 나라를 생각하고 독립운동에 참여하기를 바라는 뜻이었습니다.",
   "3·1운동 뒤인 1919년, 김구는 상하이로 망명해 임시정부의 경무국장을 맡았습니다. 정부를 지키고 교민의 안전을 돌보는 일을 담당했어요. 이후 임시정부의 지도자로 활동하면서 1931년 한인애국단을 조직했습니다. 이봉창과 윤봉길의 의거를 준비하고 지원한 조직이죠. 전시의 사진과 연표에는 김구의 얼굴 곁에 그와 일했던 동료들의 이름도 이어집니다.",
   "2층에서 눈여겨볼 기록은 ‘백범일지’입니다. 상권의 첫 독자는 아들 인과 신, 두 아이였어요. 김구는 독립운동 중 언제 목숨을 잃을지 알 수 없었기에, 아이들에게 아버지가 어떻게 살아왔는지 남기려고 글을 썼습니다. 1929년 상하이에서 상권을 완성했고, 뒤에 충칭에서 하권을 썼어요. 해방 뒤인 1947년 책으로 펴내면서 많은 사람이 읽게 되었습니다. 두 아들에게 남기려던 기록이 김구의 생애를 알려 주는 중요한 자료가 된 겁니다.",
   "기념관의 ‘마음으로 읽는 백범일지’ 디지털북에서는 책의 내용을 찾아볼 수 있습니다. 어린 시절 대목이나 가족에게 쓴 글부터 읽어보아도 좋아요. 책에는 독립운동의 큰 사건만큼이나 어머니, 아내, 두 아들에 관한 이야기가 자주 나옵니다. 김구와 두 아들이 나란히 찍은 가족사진도 남아 있어요. 사진 속 두 아들이 바로 이 책의 첫 독자입니다.",
   "윤봉길과 주고받은 시계에도 사연이 있습니다. 1932년 4월 29일, 상하이 의거를 앞둔 아침에 윤봉길은 자신의 새 시계를 김구의 오래된 시계와 바꾸자고 했습니다. 자신은 앞으로 몇 시간밖에 시계를 쓸 일이 없다는 뜻을 전했어요. 김구는 시계를 바꾸고 윤봉길을 떠나보냈습니다. 시계 관련 전시 자료를 볼 때에는 그날 두 사람이 각각 어느 시계를 차고 헤어졌는지 생각해 보세요. 이 일화는 김구가 직접 백범일지에 남겼습니다.",
   "전시 후반에는 1940년 한국광복군 창설과 해방을 앞둔 국내 진입 준비가 나옵니다. 임시정부는 직접 일본과 싸워 독립을 이루려 했고, 광복군은 미국 전략정보국과 협력해 훈련했습니다. 그러나 진입 작전을 실행하기 전에 일본이 항복했습니다. 김구는 귀국한 뒤 남북에 별도의 정부가 들어서는 것을 막으려 했고, 1948년 남북협상에 참여했습니다. 이듬해 6월 26일 경교장에서 암살되었으며, 국민장을 거쳐 기념관 곁 효창공원에 묻혔습니다.",
   "마지막에는 백범일지 뒤에 실린 ‘나의 소원’도 읽어보세요. 김구는 독립한 나라가 갖추기를 바라는 힘으로 ‘높은 문화의 힘’을 들었습니다. 문화가 우리를 행복하게 하고 다른 사람들에게도 행복을 줄 수 있다고 썼어요. 독립을 위해 활동한 생애를 돌아본 뒤 읽으면, 그가 독립 후에 어떤 나라를 만들고 싶어 했는지도 들을 수 있습니다. 전시를 마친 뒤에는 추모공간을 지나 가까운 묘역으로 관람을 이어갈 수 있습니다."
  ]},
  {no:51, region:"center", type:"전시관", name:"이봉창의사 역사울림관", addr:"백범로 281-9", audio:"audio/51_이봉창의사역사울림관.mp3", script:[
   "기와지붕을 얹은 이 작은 건물은 이봉창역사울림관입니다. 이봉창이 살았던 효창동 집터 가까이에 2020년 문을 열었어요. 지금 건물은 당시의 집을 보존한 것이 아니라 새로 지은 전시관입니다. 집터를 알리는 표식도 따로 있죠. 우선 전시관 안의 흉상을 살펴보세요. 사진을 바탕으로 만든 얼굴 뒤편에는 한인애국단 선서문이 새겨져 있습니다.",
   "이봉창의 삶을 도쿄 의거에서부터 시작하면, 그가 왜 그런 선택을 했는지 놓치기 쉽습니다. 그는 용산의 문창보통학교를 다녔고, 상점 점원을 거쳐 용산역에서 일했어요. 선로의 방향을 바꾸는 전철수, 객차를 잇는 연결수도 맡았습니다. 철도 노동자로 살아가면서 조선인과 일본인에게 다르게 매겨지는 임금을 경험했죠. 전시의 효창동 옛 자료는 이 독립운동가가 원래 어떤 동네에서 일하고 살았는지 알려줍니다.",
   "일본으로 건너간 뒤에도 생활은 안정되지 않았습니다. 철공소와 가스회사 등에서 일하며 여러 도시를 옮겨 다녔어요. 이후 상하이로 가서 독립운동에 참여하겠다는 뜻을 밝혔지만, 처음부터 환영받지는 못했습니다. 일본 생활이 오래된 그의 행동을 수상하게 여기는 사람들도 있었거든요. 김구는 그와 이야기를 나누며 뜻을 확인했고, 한인애국단의 일원으로 의거를 준비하게 했습니다.",
   "준비에는 돈과 시간이 필요했습니다. 이봉창은 상하이에서도 일을 하며 기다렸고, 김구는 해외 동포들의 지원을 받아 자금을 마련했어요. 일본으로 떠나기 전 김구와 기념사진을 찍을 때의 일화가 전합니다. 김구가 처연한 표정을 짓자 이봉창은 기쁜 얼굴로 사진을 찍자며 오히려 그를 위로했다고 해요. 자신을 보내는 사람의 마음까지 살피던 작별 장면입니다.",
   "태극기를 배경으로 수류탄을 들고 선 선서 사진에서는 목에 건 문서도 눈여겨보세요. 한인애국단에 들어가 독립과 자유를 위해 행동하겠다는 결심을 남긴 기록입니다. 일본에 도착한 뒤 이봉창은 일왕의 일정을 알아냈고, 김구에게 물품을 1월 8일에 판다는 뜻의 전보를 보냈습니다. 거사 날짜를 물건을 판매하는 날처럼 바꾸어 알린 것이죠. 멀리 떨어진 두 사람이 약속을 이어가는 데 이런 연락 방법이 쓰였습니다.",
   "1932년 1월 8일, 이봉창은 도쿄 사쿠라다문 부근에서 관병식을 마치고 돌아오는 일왕 히로히토의 행렬에 수류탄을 던졌습니다. 그러나 목표를 맞히지 못했고 현장에서 체포됐어요. 그해 9월 30일 사형을 선고받았고, 10월 10일 이치가야형무소에서 순국했습니다. 도쿄에서 일왕을 겨냥한 사건은 중국 신문에도 보도되며 한국의 독립운동을 널리 알렸습니다.",
   "이봉창의 유해가 고국으로 돌아온 것은 광복 이듬해인 1946년입니다. 가까운 효창공원 삼의사묘역에 윤봉길, 백정기와 나란히 안장됐어요. 이 동네에는 생전에 살던 집터 표식과 울림관, 돌아온 유해를 모신 묘소가 각각 있습니다. 울림관의 효창동 옛 자료와 도쿄 의거 자료를 차례로 보면, 용산역에서 객차를 연결하던 노동자가 일본과 상하이를 거쳐 한인애국단원이 되기까지의 생활을 따라갈 수 있습니다."
  ]},
  {no:52, region:"center", type:"건축물/표지석", name:"용산역사박물관", addr:"한강대로14길 35-29", audio:"audio/52_용산역사박물관.mp3", script:[
   "용산역사박물관에 들어가기 전에 붉은 벽돌 외벽부터 살펴보세요. 이 건물은 1928년에 지은 용산철도병원 본관입니다. 벽돌과 철근콘크리트를 섞어 지었고, 병원을 정비해 2022년 박물관으로 열었어요. 전시실 안에는 유리로 보호한 옛 벽돌 부분도 보입니다. 새로 꾸민 전시 벽과 병원 시절부터 남은 부분을 구분해 보면, 건물을 어떻게 고쳐 쓰고 있는지 알 수 있습니다.",
   "철도병원은 철도 직원과 가족, 그리고 여객을 치료하던 병원이었습니다. 용산에는 역만 있었던 게 아니에요. 차량을 만들고 고치는 시설, 철도학교, 직원 관사와 도서관까지 들어섰습니다. 직원들이 이곳에서 일하고 가족과 살았으니 병원도 필요했죠. 역을 중심으로 큰 마을이 생겼고, 철도병원은 그 마을의 주요 의료시설이었습니다.",
   "병원 자체의 역사는 현재 건물보다 깁니다. 1907년 용산동인병원으로 시작해 1913년 용산철도병원이라는 이름을 얻었어요. 본관에는 진료실과 대합실, 약국, 수술실이 있었습니다. 철도에서 일하다 다친 외상 환자가 많아서 수술실은 응급처치에 쓰였다고 합니다. 건물 도면을 보게 된다면 방 이름을 읽어보세요. 지금 전시를 보는 자리에 환자가 기다리거나 의사가 치료하던 방이 있었음을 알 수 있습니다.",
   "용산이 철도도시가 된 과정은 일본의 군사 활동과 밀접합니다. 러일전쟁이 일어나자 일본은 군인과 물자를 옮기기 위해 경부선과 경의선 공사를 서둘렀습니다. 용산에는 일본군 기지를 만들었어요. 철도 관련 기관과 일본인 거주지도 그 주변으로 늘어났죠. 전시 지도에서는 선로와 기지의 크기, 주거지가 들어선 위치를 비교해 보세요. 철도와 군사시설이 차지한 넓은 땅이 이후 용산의 도로와 동네 모양에도 영향을 주었습니다.",
   "전시는 철도가 들어오기 전의 용산도 다룹니다. 한강을 통해 물자가 들어오던 길목이었고, 경강상인들이 활동하던 곳이었어요. 이후 철도 운송이 발달하자 제과공장과 양곡·청과물 시장이 생겼습니다. 강으로 나르던 물건을 기차로 실어 나르게 된 변화가 일자리와 상권을 바꾼 것이죠. 지도와 사진을 볼 때 나루, 역, 시장을 차례로 찾아보면 용산에 사람들이 모였던 이유를 이해하기 좋습니다.",
   "한국전쟁 중에는 병원도 폭격을 받아 큰 피해를 입었습니다. 본관과 병동 일부가 남아 수리와 증축을 거쳤고, 1984년부터는 중앙대학교 부속 용산병원으로 운영됐어요. 2011년 진료를 마칠 때까지 이곳에서 환자를 돌봤습니다. 전시에는 병원에서 근무했던 의사와 직원들의 인터뷰도 소개됩니다. 건물의 이름이 바뀌는 동안 실제로 어떤 일을 했는지, 당시 일했던 사람들의 설명으로 들을 수 있습니다.",
   "관람을 이어가면 미군기지 주변의 음악, 삼각지의 미술 문화, 용산에 정착한 주민들의 생활 자료를 만나게 됩니다. 군대와 철도에 관한 큰 지도 옆에서 주민의 물건을 살펴보세요. 같은 동네라도 그곳에서 맡은 일과 살아온 경험이 달랐다는 것을 확인할 수 있어요. 관람 뒤 옥상정원에 올라갈 수 있다면 용산역 일대를 바라보면 좋겠습니다. 전시에서 찾았던 역과 병원의 거리를 실제 풍경에서 가늠해 볼 수 있습니다."
  ]},
  {no:53, region:"center", type:"전시관", name:"식민지역사박물관", addr:"청파로47다길 27", audio:"audio/53_식민지역사박물관.mp3", script:[
   "청파동 골목 안의 식민지역사박물관은 시민들이 성금과 자료를 모아 2018년 문을 연 박물관입니다. 국내 시민과 해외 동포가 참여했고, 일본에서도 자료와 후원금을 보내왔어요. 전시를 보다 보면 지도와 교과서, 사진, 엽서처럼 종이로 된 물건이 많습니다. 일제가 어떤 정책을 폈는지, 그 정책 때문에 사람들의 생활이 어떻게 달라졌는지 이런 자료를 통해 살펴보는 곳입니다.",
   "상설전시는 일본의 한반도 침략에서 출발합니다. 전쟁을 그린 지도나 선전물을 볼 때에는 그림 옆의 제목도 읽어보세요. 군대가 어디로 이동했는지뿐 아니라, 침략을 어떤 말로 포장했는지가 드러납니다. 지배하는 쪽이 만든 자료에는 자신에게 유리한 표현이 쓰이기 마련이죠. 전시 설명과 나란히 읽으면 당시의 선전과 실제로 벌어진 일을 비교할 수 있습니다.",
   "이어서 전쟁이 조선인의 생활을 어떻게 바꾸었는지 살펴봅니다. 황국신민화라는 말은 조선인을 일본 천황에게 충성하는 신민으로 만들겠다는 뜻이에요. 학교와 일상에서 충성을 요구했고, 전쟁이 확대되면서 곡식과 물자를 거두고 사람들을 군대와 노동 현장으로 동원했습니다. 전시는 징병과 징용, 일본군 위안부 문제를 다룹니다. 정책의 이름과 함께, 그것 때문에 어디로 보내졌고 무엇을 빼앗겼는지 살펴보면 좋겠습니다.",
   "이곳에 자료를 맡긴 사람들 중에는 강제동원 피해자와 유족도 있습니다. 가족에게 남은 사진이나 엽서를 기증한 사례가 있죠. 박물관이 2019년 열었던 전시에서는 돌아오지 못한 사람의 유해와 기록을 찾는 유족들의 노력을 소개했습니다. 전쟁은 끝났어도 가족은 사망 경위나 매장 장소조차 알지 못한 채 기다려야 했던 겁니다. 자료 옆에 기증자와 소장 경위가 적혀 있다면 그 부분도 읽어보세요.",
   "세 번째 주제는 같은 시대를 살았던 사람들의 협력과 저항입니다. 친일 행적을 다룬 기록과 독립운동 자료를 따라가며 누가 어떤 일을 했는지 살펴봅니다. 전시장에는 학교와 감옥을 주제로 한 작은 체험 공간, 친일인명사전과 관련된 공간도 있어요. 사람의 이름만 기억하기보다 그 이름 아래 적힌 활동과 근거 자료를 읽는 것이 중요합니다. 직책이나 한 번의 발언보다 구체적인 행적을 확인하는 전시이기 때문입니다.",
   "해방 뒤의 친일 청산과 피해자 권리 회복도 주요 전시 내용입니다. 박물관이 받은 기증품 가운데에는 반민족행위특별조사위원회 위원장 김상덕의 인장이 있어요. 아들 김정륙이 아버지에게서 남은 유일한 유품이라며 내놓은 물건입니다. 식민 지배에 협력한 사람들을 조사하려 했던 반민특위의 일과, 그 일을 맡았던 한 가족의 사정이 작은 도장 하나에 연결되어 있습니다.",
   "일본 시민들이 건네준 자료에도 눈길을 줄 만합니다. 1929년 용산의 군사기지와 철도시설을 그린 지도, 강제동원 피해자의 재판을 지원하며 사용한 현수막 등이 기증됐습니다. 지도는 식민지 시기의 용산을 설명하고, 현수막은 전쟁 뒤에도 계속된 권리 회복 활동을 설명하죠. 현재 전시에 어떤 기증품이 나와 있는지 살피면서 관람해 보세요. 이 박물관은 오래된 물건뿐 아니라, 그 물건을 찾아 공개해 온 사람들의 활동도 다루고 있습니다."
  ]},

  {no:54, region:"nw", type:"건축물/전시관", name:"진관사 칠성각", addr:"진관길 73 진관사 내", audio:"audio/54_진관사칠성각.mp3", script:[
   "진관사 칠성각은 북두칠성과 관련된 불교 신앙을 모시는 작은 전각입니다. 사람들은 이곳에서 수명과 복, 자손을 기원했어요. 사찰 안내에 따르면 안에는 석조여래좌상과 칠성도가 봉안돼 있습니다. 지금도 참배하는 곳이니 우선 바깥에서 칠성각의 현판과 건물 모습을 살펴보세요. 이 전각을 수리하다가 독립운동 자료가 발견된 해가 2009년입니다.",
   "그때 보수공사에서는 두 가지 중요한 사실이 드러났습니다. 대들보에서 나온 상량문으로 칠성각이 1911년에 세워졌음을 알게 됐고, 5월 26일에는 불단과 기둥 사이의 벽에서 한지 봉지가 발견됐어요. 봉지를 떼어내자 태극기에 싼 신문 뭉치가 나왔습니다. 한국전쟁 때 진관사의 많은 건물이 소실됐지만 칠성각은 남았고, 그 안에 있던 자료도 뒤늦게 발견될 수 있었습니다.",
   "사진으로 진관사 태극기를 살펴보면 익숙한 태극기와 다른 점이 눈에 들어옵니다. 흰 천 가운데 일장기의 붉은 원이 있었고, 그 위에 먹을 칠해 태극 모양을 만들었어요. 네 귀에는 괘를 그려 넣었습니다. 푸른색 대신 먹을 쓴 태극 부분, 지금의 국기와 다른 일부 괘의 위치, 가장자리의 손상 흔적을 차례로 보면 좋겠습니다. 이미 있던 일본 국기의 천을 손으로 고쳐 태극기로 만든 것입니다.",
   "깃발에 싸여 있던 신문들은 1919년 여름부터 그해 말까지 발행된 자료입니다. 신채호가 상하이에서 펴낸 신대한, 대한민국임시정부의 독립신문, 국내에서 비밀리에 발행한 조선독립신문과 자유신종보 등이 나왔어요. 국내 자료와 상하이의 신문이 한 꾸러미 안에서 발견됐다는 점이 중요합니다. 만세운동 이후에도 바깥의 소식을 받아 읽고 전하는 활동이 계속되고 있었던 것이죠.",
   "신문의 날짜도 자세히 볼 만합니다. 한 독립신문에는 대한민국 원년 12월 25일이라는 날짜가 적혀 있어요. 1919년을 새 나라가 시작된 첫해로 부른 것입니다. 또 다른 호에는 태극기를 주제로 한 시와, 태극기의 뜻과 만드는 법을 설명한 글이 실렸습니다. 오늘날처럼 같은 규격의 깃발을 쉽게 구하기 어려웠던 때, 신문은 독립운동의 소식과 함께 깃발을 그리는 방법까지 전하고 있었습니다.",
   "자료를 모으고 숨긴 사람은 백초월 스님과 관련됐을 것으로 추정합니다. 그는 진관사와 인연을 맺고 독립운동 자금을 모으는 등 국내외 항일 활동에 참여했어요. 다만 꾸러미를 벽에 넣은 사람과 날짜는 아직 분명하지 않습니다. 신문에 찍힌 발행일과 발견된 장소가 남아 있어, 연구자들은 이를 바탕으로 사찰을 오가던 독립운동의 소식을 추적하고 있습니다.",
   "이곳에서는 유물이 발견된 건물을 먼저 보고, 태극기와 신문은 공개 안내에 따라 살펴보면 됩니다. 원본 전시 여부와 관계없이 태극기 사진의 먹칠과 괘, 신문의 제목과 날짜를 찾아보세요. 칠성각 벽 안에서 나온 꾸러미에는 서로 다른 지역에서 찍어낸 종이들이 모여 있었습니다. 서울의 산사에 상하이 임시정부와 국내 지하신문의 소식이 도착했다는 사실을, 바로 그 종이들이 알려줍니다."
  ]},
  {no:55, region:"nw", type:"공원/장소", name:"서대문독립공원(독립문·독립관)", addr:"현저동 941", audio:"audio/55_서대문독립공원.mp3", script:[
   "독립문 앞에 서 있는 두 개의 길쭉한 돌은 영은문의 주춧돌입니다. 지금은 돌만 남았지만 그 위에는 중국 사신을 맞이하던 문의 기둥과 지붕이 있었어요. 가까이 보이는 석조 독립문은 1897년에 완공됐습니다. 영은문과 독립문이 각각 어떤 일을 위해 세워졌는지 알아두면, 두 유적이 나란히 놓인 풍경이 훨씬 구체적으로 보입니다.",
   "영은문은 명나라와 청나라 사신을 맞는 의례에 쓰였습니다. 조선이 중국 왕조와 맺었던 외교 관계를 드러내는 시설이었죠. 1896년 서재필 등이 독립협회를 만들고 독립문 건립을 추진했을 때에는, 강대국의 간섭을 받지 않는 자주적인 나라를 세우겠다는 목표가 있었습니다. 고종도 건립에 동의했고 여러 계층의 사람들이 성금을 보탰어요. 당시의 독립은 청의 간섭에서 벗어난 뒤 다른 열강의 압박 속에서도 주권을 지켜야 한다는 과제였습니다.",
   "문은 화강석을 쌓아 파리 개선문을 본뜬 형태로 만들었습니다. 가운데 통로 위로 돌을 둥글게 맞물려 쌓은 아치가 보이죠. 아치 꼭대기의 돌에는 오얏꽃 문양이 새겨져 있습니다. 그 위 현판석은 앞뒤가 달라서 한쪽에는 한글, 다른 쪽에는 한자로 독립문이라고 적었어요. 글씨 양옆의 태극기도 찾아보세요. 서양식 문에 국기와 왕실의 문양을 새겨 당시 조선이 지향하던 국가의 모습을 표현했습니다.",
   "독립문 가까이의 한옥은 독립관입니다. 본래 중국 사신을 접대하던 모화관을 독립협회가 고쳐 쓰면서 이름도 바꾸었어요. 사람들은 이곳에 모여 국권과 개혁을 토론했습니다. 러시아의 땅 대여 요구와 이권 침탈 같은 사안도 논의했죠. 사신을 대접하던 건물이 외국의 요구를 비판하고 대응 방법을 찾는 토론 장소로 바뀌었다는 점이 흥미롭습니다.",
   "지금의 독립관은 1997년에 다시 지은 건물이며, 순국선열의 위패를 모시는 시설로 사용합니다. 독립문도 처음 자리에 그대로 서 있지는 않아요. 도로 공사 때문에 1979년부터 약 70미터 옮기는 공사를 했고 이듬해 마쳤습니다. 옛 사진을 보게 된다면 문 주변의 도로와 건물을 비교해 보세요. 현재의 공원 길은 대한제국 때 사람들이 다니던 길과 상당히 달라졌습니다.",
   "서대문독립공원은 옛 서울구치소가 의왕으로 이전한 뒤 1992년에 문을 열었습니다. 공원의 순국선열추념탑도 그해 세워졌어요. 가운데 솟은 태극기 조각과 양옆에 새긴 인물·장면을 보면 의병과 만세운동, 의열투쟁 등 여러 독립운동을 한눈에 살펴볼 수 있습니다. 각각의 부조에서 알고 있는 인물이나 사건을 찾아보면, 기념탑이 어떤 활동을 추모하는지 읽기 좋습니다.",
   "삼일독립선언기념탑은 또 다른 경로로 이곳에 왔습니다. 1963년 탑골공원에 세워졌다가 그곳 정비 뒤 철거됐고, 1992년 이 공원에 다시 세웠어요. 탑 뒤에는 독립선언문과 민족대표 33인의 이름이 새겨져 있습니다. 독립문, 복원된 독립관, 이전해 온 기념탑을 차례로 보면 지금 공원의 구성이 이해됩니다. 마지막으로 붉은 담장 안 형무소까지 관람한다면, 독립을 주장한 사람들이 체포된 뒤 어떤 일을 겪었는지 이어서 살펴볼 수 있습니다."
  ]},
  {no:56, region:"nw", type:"건축물", name:"서대문형무소역사관", addr:"통일로 251", audio:"audio/56_서대문형무소역사관.mp3", script:[
   "붉은 담장 안의 건물들은 1987년까지 실제 감옥으로 쓰였습니다. 1908년 경성감옥으로 문을 열었고, 일제강점기에는 서대문형무소, 해방 뒤에는 서울형무소와 서울구치소 등으로 이름을 바꾸었어요. 대한제국 말 의병부터 삼일운동 참가자, 해방 뒤 민주화운동에 나선 사람들까지 이곳에 수감됐습니다. 서울구치소가 의왕으로 옮겨간 뒤 건물 일부를 남겨, 1998년 역사관으로 열었습니다.",
   "먼저 전시관으로 쓰는 옛 보안과 청사를 보겠습니다. 1923년에 지은 건물로, 위층에는 사무실과 소장실이 있었고 지하에서는 수감자를 조사했습니다. 외벽에 남은 회색 시멘트 자국도 살펴보세요. 1959년 외벽에 붙였던 흰 타일을 2010년 보수하면서 떼어낸 흔적입니다. 붉은 벽돌 건물도 사용하던 동안 여러 번 고쳤다는 것을 벽면에서 확인할 수 있죠.",
   "전시실 벽을 채운 수형기록카드에는 수감자의 사진과 이름, 나이, 사건 내용이 적혀 있습니다. 약 4천8백 장의 카드는 일제가 항일운동에 나선 사람들을 관리하려고 만든 기록이에요. 얼굴과 이름을 하나씩 보세요. 널리 알려진 인물 외에도 낯선 이름이 많습니다. 지하 조사실 전시에서는 취조와 고문을 겪고 살아남은 독립운동가들의 증언을 들을 수 있습니다. 건물의 용도와 당사자의 설명을 이어서 살펴보는 순서입니다.",
   "옥사에서는 복도가 만나는 지점에 잠시 서 보세요. 여러 방향의 복도를 중앙에서 살피도록 배치했고, 복도 양옆으로 감방 문이 이어집니다. 간수는 수감자가 방을 드나드는 모습을 감시할 수 있었죠. 이런 감시 아래에서도 수감자들은 벽을 두드려 서로 소식을 전했습니다. 11·12옥사 전시에서 소개하는 타벽통보가 그 방법입니다. 말을 나누기 어려운 상황에서 두드리는 소리를 신호로 사용한 것입니다.",
   "9옥사는 중앙 간수소에 붙어 있지 않은 별도의 건물입니다. 이곳에는 항일운동을 하다가 붙잡혀 사상범으로 분류된 사람들을 주로 가뒀어요. 바깥 벽에는 한국전쟁 때 생긴 총탄 자국이 남아 있습니다. 공작사도 지나치지 마세요. 수감자들은 감방에만 머문 것이 아니라 공장에서 강제로 일했습니다. 형무소와 관공서에 필요한 물품을 만들었고, 1930년대 후반부터는 전쟁에 필요한 군수물품 생산에도 동원됐습니다.",
   "야외의 부채꼴 운동장은 격벽장입니다. 햇볕을 쬐고 몸을 움직이는 동안에도 대화를 막으려고 벽으로 칸을 나눴어요. 가운데에는 감시대가 있었습니다. 현재 격벽장은 2011년 복원한 시설입니다. 한 칸 안에서 옆 칸이 얼마나 가려지는지 살펴보세요. 사형장은 높은 담장으로 둘러싸여 형무소 안에서도 내부가 보이지 않게 했습니다. 그 곁의 시구문은 시신을 바깥으로 내보내던 통로로, 지금은 발굴 뒤 복원한 일부 구간이 남아 있습니다.",
   "여옥사에서는 여성 독립운동가들의 이야기를 만납니다. 유관순과 여성 수감자들은 1920년 3월 1일, 삼일운동 한 돌을 맞아 감옥 안에서 만세를 불렀습니다. 현재의 여옥사는 철거된 뒤 도면을 바탕으로 다시 지은 건물이에요. 전시에는 수원에서 만세운동에 참여한 기생 김향화, 간호사 노순경 등 서로 다른 일을 하던 여성들의 활동이 소개됩니다. 각 인물의 직업과 시위에 나선 장소를 읽으면 독립운동에 참여한 사람들의 폭이 넓었다는 것을 알 수 있습니다.",
   "길게 늘어선 창고는 형무소의 규모가 커진 과정도 알려줍니다. 처음 23미터였던 건물을 수감자가 늘면서 세 차례 늘려 53미터로 만들었어요. 지금 건물은 2019년 복원했고, 당시 발굴한 배수관과 집수정의 흔적을 보존했습니다. 옥사와 창고, 밥을 짓던 취사장을 보고 나면 많은 사람을 가두기 위해 필요한 시설의 규모를 짐작할 수 있죠. 이곳에서 보았던 기록카드의 얼굴들은 바로 그런 시설 안에서 하루하루를 보내야 했던 사람들입니다."
  ]},
  {no:57, region:"nw", type:"전시관", name:"국립대한민국임시정부기념관", addr:"통일로 279-24", audio:"audio/57_국립대한민국임시정부기념관.mp3", script:[
   "국립대한민국임시정부기념관은 2022년 서대문에 문을 열었습니다. 중국에서 활동했던 임시정부의 역사와 그곳 사람들의 생활을 전하는 곳이에요. 바깥 광장에는 역사의 파도라는 작품이 있고, 상설전시는 2층에서 시작해 4층까지 이어집니다. 전시를 볼 때에는 큰 선언문뿐 아니라 공채와 졸업증서, 편지처럼 실제 생활에 쓰였던 문서도 찾아보세요. 해외에서 정부를 유지하는 데 무엇이 필요했는지 알려주는 자료들입니다.",
   "첫 번째 전시의 주제는 군주의 나라에서 국민의 나라로입니다. 1919년 삼일운동 이후 상하이에서 임시정부를 세우며 대한민국이라는 국호와 민주공화제를 채택했어요. 임시의정원 첫 회의는 4월 10일 밤 10시에 시작해 이튿날 오전 10시에 끝났습니다. 밤새 회의하며 국호와 정부 조직을 정하고 임시헌장을 의결한 것이죠. 회의 내용을 적은 기사록은 나라를 어떤 원칙으로 운영할지 토론하고 결정했던 과정을 전합니다.",
   "정부를 운영하고 독립운동을 벌이려면 자금이 필요했습니다. 전시에서 소개하는 독립공채 중에는 하와이의 전영택이 구입한 50달러짜리 제369호가 있어요. 공채는 돈을 빌리고 나중에 갚겠다는 약속을 담은 증서입니다. 이 종이에는 임시정부를 후원한 해외 동포와, 앞으로 독립국가를 세우겠다는 정부의 약속이 담겨 있습니다. 액수와 발행 명의를 보면 모금이 어떤 방식으로 이루어졌는지 알 수 있습니다.",
   "상하이에 살던 한인 자녀들이 다닌 인성학교의 졸업증서도 소개됩니다. 임시정부 수립 뒤 공립학교가 된 곳이에요. 1925년에는 학생 사진이 담긴 성탄절 엽서를 만들어 학교 건축 기금을 모았습니다. 독립운동을 하러 떠난 사람들에게도 가르쳐야 할 아이들과 마련해야 할 교실이 있었습니다. 졸업증서 옆에 학생들의 단체사진을 보게 된다면, 어른들 곁에서 망명 생활을 이어간 아이들의 얼굴도 살펴보세요.",
   "3층에서는 임시의정원과 내각, 여러 독립운동 세력을 통합하려던 노력을 살펴봅니다. 김구와 김원봉이 공동으로 발표한 공개서한은 분열과 대립을 멈추고 하나의 조직을 만들자고 호소합니다. 1944년에는 여러 정치 세력이 참여하는 통합 내각이 구성됐어요. 같은 독립을 목표로 하면서도 방법과 생각이 달랐던 사람들이 어떻게 정부를 꾸릴지 협의한 기록입니다.",
   "김구의 글씨가 적힌 태극기도 눈여겨볼 자료입니다. 미국으로 가는 신부에게 건넨 이 태극기에는 미주 동포들에게 한국광복군을 도와달라는 내용이 담겨 있어요. 깃발은 미국에 있던 안창호의 부인 이혜련에게 전해졌고, 훗날 유족을 통해 국내로 돌아왔습니다. 군대를 조직하고 유지하는 데에도 국경을 오가는 사람과 편지, 후원금이 필요했던 것입니다.",
   "4층은 임시정부의 환국과 대한민국으로 이어지는 역사를 다룹니다. 오늘의 헌법 전문에도 삼일운동으로 건립된 대한민국임시정부의 법통을 계승한다는 내용이 명시돼 있습니다. 전시에서 국호와 국기, 헌법 관련 자료를 찾아 앞선 층에서 본 것과 비교해 보세요. 회의록에는 나라의 운영 원칙을 정한 토론이, 공채에는 해외 동포의 후원이, 졸업증서에는 망명지에서도 이어간 아이들의 배움이 남아 있습니다."
  ]},
  {no:58, region:"nw", type:"건축물/전시관", name:"윤동주기념관(연세대 핀슨관)", addr:"연세로 50", audio:"audio/58_윤동주기념관.mp3", script:[
   "윤동주기념관으로 쓰는 핀슨관은 1922년에 완공한 연희전문학교의 기숙사입니다. 바깥에서 보면 어두운 빛의 돌을 쌓은 벽과 가파른 지붕이 눈에 들어오죠. 윤동주도 이 건물에서 학생들과 생활했습니다. 1938년 연희전문 문과에 입학해 1941년 졸업할 때까지, 학교에서 배우고 책을 읽으며 여러 작품을 썼습니다. 지금은 당시의 학생 사진과 원고, 읽던 책을 통해 그 시절을 살펴볼 수 있습니다.",
   "전시실에 있는 서랍형 가구를 눈여겨보세요. 서랍을 열어 자료를 살피게 만든 데에는 종이가 햇빛에 손상되지 않도록 하려는 이유가 있습니다. 윤동주가 읽었던 책도 표지뿐 아니라 내용까지 볼 수 있도록 사본의 낱장을 서랍에 배치했어요. 책의 제목을 보고 안쪽 글도 읽어보면, 시인이 무엇을 읽으며 문장을 익혔는지 살펴보기 좋습니다. 친필 원고에서는 완성된 시만큼 고쳐 쓴 글자와 지운 자리도 눈에 띕니다.",
   "연희전문 시절 윤동주는 학교 문예지 문우에 자화상과 새로운 길을 발표했습니다. 국어와 문학을 가르치던 스승들, 글을 읽고 나누던 친구들이 주변에 있었죠. 재현한 기숙사 방을 보고 복도로 나오면 작은 방들이 이어졌던 건물의 짜임을 알 수 있습니다. 지금은 방 사이의 벽을 열어 전시 동선을 만들었지만, 가운데 복도는 비워두었습니다. 여러 학생이 방을 나와 마주쳤을 기숙사의 통로를 남겨둔 것입니다.",
   "졸업을 앞둔 1941년, 윤동주는 자신의 시를 묶어 하늘과 바람과 별과 시라는 제목으로 출판하려 했습니다. 그러나 당시에는 책을 내지 못했어요. 대신 시를 손으로 정리한 원고 세 부를 만들었습니다. 한 부는 스승 이양하에게, 한 부는 후배 정병욱에게 주고 한 부는 자신이 보관했습니다. 우리가 익숙하게 읽는 시집의 출발은 서점에 나온 책이 아니라, 가까운 사람에게 건넨 필사 원고였습니다.",
   "정병욱에게 맡긴 원고는 전남 광양의 집에서 보존됐습니다. 일제 말 정병욱이 징집되면서 가족에게 맡겼고, 어머니가 이를 지켜냈어요. 해방 뒤 윤동주의 유고를 모아 출판할 때 이 원고가 중요한 바탕이 됐습니다. 원고의 글씨를 살펴보면서 시를 쓴 사람과 보관한 사람의 이름을 같이 기억해 두면 좋겠습니다. 윤동주가 살아서 이루지 못한 출판을 가족과 친구들이 이어갔기 때문입니다.",
   "윤동주는 졸업 뒤 일본으로 유학했고, 1943년 항일운동 혐의로 체포됐습니다. 1945년 2월 후쿠오카형무소에서 세상을 떠났어요. 첫 유고시집은 그가 숨진 지 3년 뒤인 1948년에 나왔습니다. 학생 시절 사진과 출판된 시집 사이에는 일본 유학과 투옥, 사망, 원고를 모아 책을 만드는 과정이 있었습니다. 전시의 연보에서 그 순서를 따라보면 짧은 생애 안에 쓰인 작품들이 언제 독자를 만났는지 알 수 있습니다.",
   "핀슨관에는 2000년 윤동주기념실이 먼저 마련됐고, 유족의 기증과 동문들의 후원으로 건물 전체를 정비해 2020년 기념관을 열었습니다. 2층에는 윤동주 관련 책을 모은 라이브러리가 있습니다. 밖으로 나오면 문학동산의 서시비도 살펴보세요. 1968년에 세운 시비입니다. 원고에서 보던 글이 책으로 출판되고 교정의 돌에도 새겨진 모습을 차례로 볼 수 있습니다."
  ]},
  {no:59, region:"nw", type:"묘역/전시관", name:"양화진 외국인 선교사 묘역", addr:"양화진길 46", audio:"audio/59_양화진외국인선교사묘원.mp3", script:[
   "양화진외국인선교사묘원에서는 묘비에 적힌 이름부터 천천히 읽어보세요. 메리 스크랜턴과 언더우드처럼 학교와 교회 역사에서 만난 이름도 있고, 언론인 베델처럼 일본의 침략을 비판했던 사람도 있습니다. 가족들의 묘도 있어요. 출생지와 사망지, 날짜를 읽으면 서로 다른 나라에서 온 사람들이 언제 한국과 인연을 맺었는지 알 수 있습니다. 한국에서 짧은 생을 마친 어린아이의 이름도 보입니다.",
   "묘원의 시작은 1890년 의료선교사 존 헤론의 죽음입니다. 환자를 돌보던 헤론이 이질에 걸려 숨지자 유족과 동료들이 장지를 구해야 했어요. 당시 외국인 묘지는 제물포에 있었는데, 한여름에 시신을 그 먼 곳까지 옮기기가 어려웠습니다. 서울 가까이에 묻을 수 있게 해 달라고 조선 정부와 교섭한 끝에 양화진에 장지가 마련됐습니다. 한 사람의 장례를 치르기 위해 정한 곳에 이후 외국인과 가족들의 묘가 늘어났습니다.",
   "메리 스크랜턴은 1886년 정동의 자택에서 한 명의 학생을 가르치며 이화학당을 시작했습니다. 지금의 이화여자대학교로 이어지는 학교입니다. 여성들이 학교에서 배우기 어려웠던 시절, 학생을 모아 읽고 쓰는 것과 새로운 학문을 가르쳤어요. 이듬해에는 여성 환자를 위한 보구녀관 설립에도 힘썼습니다. 여성들이 교육과 치료를 받을 수 있는 장소를 만드는 일이 그의 주요 활동이었습니다.",
   "언더우드는 1915년 연희전문학교의 전신인 조선 크리스찬 컬리지를 세웠습니다. 뒤에 윤동주가 다니게 되는 학교의 출발이었죠. 그러나 학교가 자리 잡는 모습을 오래 보지는 못했어요. 이듬해 병을 치료하러 미국으로 돌아갔다가 그곳에서 숨졌고, 처음에는 미국의 교회 묘지에 묻혔습니다. 그의 유해가 양화진으로 옮겨진 것은 1999년입니다. 그래서 묘비의 사망 연도와 이곳에 안장된 해 사이에는 긴 간격이 있습니다.",
   "베델의 묘에는 글씨를 지우려 했던 일까지 남아 있습니다. 영국인 기자였던 그는 러일전쟁을 취재하러 한국에 왔고, 대한매일신보와 영문 신문을 통해 일본의 침략을 비판했습니다. 영국이 일본과 동맹을 맺고 있던 때에도 그랬어요. 일본의 압박으로 재판을 받아 상하이에서 금고형을 치렀고, 서울로 돌아온 뒤 1909년 숨졌습니다. 그의 신문에서는 양기탁과 신채호, 박은식 등 한국인 언론인들도 활동했습니다.",
   "장지연이 지은 베델의 추모 비문은 일제에 의해 훼손됐습니다. 해방 뒤인 1964년, 언론인들이 성금을 모아 원래 글을 새긴 작은 비를 다시 세웠어요. 베델의 묘를 찾았다면 묘비와 별도로 놓인 비문도 살펴보세요. 신문에 무엇을 썼는지 때문에 탄압을 받은 사람의 묘에서, 죽은 뒤 그를 기린 글마저 지워졌던 사정을 알 수 있습니다.",
   "헐버트는 고종의 외교를 돕고 미국에서도 한국의 독립을 알렸던 인물입니다. 처음에는 육영공원 교사로 와서 학생들을 가르쳤고, 한글로 세계지리를 설명한 사민필지를 펴냈어요. 오랫동안 미국에 머물다가 광복 뒤 한국을 다시 찾았지만, 1949년 서울에서 숨졌습니다. 한국에 묻히고 싶다는 뜻에 따라 어린 아들이 잠든 양화진에 안장됐죠. 묘비의 짧은 설명 뒤에 교실과 신문사, 외교 현장에서 이어진 활동이 있다는 것을 떠올리며 각자의 이름을 읽어보면 좋겠습니다."
  ]},
  {no:60, region:"nw", type:"전시관", name:"전쟁과여성인권박물관", addr:"월드컵북로11길 20", audio:"audio/60_전쟁과여성인권박물관.mp3", script:[
   "전쟁과여성인권박물관은 성산동 주택가의 집을 고쳐 만든 곳입니다. 건물 옆 좁은 돌길을 따라 지하로 들어가고, 다시 계단을 올라 전시를 이어 보도록 구성했어요. 일본군 위안부 피해생존자들의 경험과 전쟁 뒤의 삶, 문제 해결을 위한 활동을 순서대로 만납니다. 입장권에 한 생존자의 이야기가 담겨 있다면 그 이름을 먼저 읽어보세요. 관람 중 그 사람의 증언을 찾아 듣는 출발점이 됩니다.",
   "지하 전시에서는 생존자가 자신의 삶을 설명하는 영상을 만납니다. 어디에서 살았고, 어떤 일을 겪었으며, 전쟁이 끝난 뒤에는 어떻게 지냈는지 당사자가 말합니다. 전쟁이 끝났다고 곧바로 고향과 일상으로 돌아갈 수 있었던 것은 아니었어요. 피해를 드러냈을 때 받을 편견과 비난 때문에 오랫동안 말하기 어려웠던 사정도 있습니다. 증언을 들을 때에는 피해를 겪기 전의 생활과 이후의 삶까지 따라가 보면 좋겠습니다.",
   "1991년 8월 14일, 김학순이 기자회견에서 자신의 피해 사실을 공개적으로 증언했습니다. 이 발언을 계기로 다른 생존자들의 증언과 진상 규명 활동이 널리 확산됐어요. 당사자가 자신의 이름과 얼굴을 드러내며 일본군의 범죄를 고발한 것입니다. 전시의 사진과 영상은 그 말을 들은 사람들이 조사와 지원, 소송에 참여하게 된 과정도 전합니다. 오래전 사건에 대한 설명이 피해생존자가 요구하는 사과와 책임의 문제로 이어집니다.",
   "계단 벽에는 생존자들의 얼굴과 호소가 전시돼 있습니다. 위층으로 올라가면 수요시위와 국제 연대, 법적 대응의 기록을 보게 돼요. 1992년 1월 8일 시작된 수요시위에는 피해생존자와 시민들이 참여해 진상 규명과 공식 사죄, 책임 있는 배상을 요구했습니다. 시위 사진에서는 단상에 선 인물뿐 아니라 곁에 선 사람들과 피켓의 문구도 살펴보세요. 어떤 요구를 누구에게 전하려 했는지가 구체적으로 적혀 있습니다.",
   "박물관이 모은 자료에는 증언 녹취록과 판결문 외에도 일상 사진, 유품, 그림과 압화 작품이 있습니다. 생존자들이 사용한 물건은 일하며 살고, 사람을 만나고, 취미를 즐겼던 생활을 전해요. 그림도 고통을 설명하는 자료로만 볼 필요는 없습니다. 무엇을 그리고 어떤 색을 골랐는지 살피면 자기 경험을 표현해 온 한 사람의 선택을 만날 수 있습니다. 전시 중인 자료의 주인이 누구인지 이름을 읽으며 관람하면 좋겠습니다.",
   "추모관에는 세상을 떠난 피해생존자들의 이름과 얼굴이 남아 있습니다. 이름이나 사진이 알려지지 않은 피해자를 기리는 검은 벽돌도 놓여 있어요. 우리가 들을 수 있는 증언은 전체 피해의 일부라는 점을 떠올리게 합니다. 박물관은 다른 나라에서 벌어진 전시 성폭력도 다루며 피해자들 사이의 연대 활동을 소개합니다. 여러 곳에서 보이는 나비는 폭력과 차별에서 벗어나 자유롭게 살기를 바라는 뜻을 담고 있습니다.",
   "이 박물관은 1990년대부터 준비를 시작했고 2004년 건립위원회를 꾸렸습니다. 시민과 피해생존자들의 기부, 공적 지원이 모였지만 부지를 바꾸는 등 어려움을 겪은 뒤 2012년 5월 5일 문을 열었어요. 어린이날을 개관일로 정한 데에는 다음 세대가 전쟁과 폭력 없는 세상에서 살기를 바라는 뜻이 있었습니다. 생존자들은 자신의 경험을 증언하는 데서 더 나아가, 다른 피해자의 권리와 아이들의 평화를 위한 활동에도 참여했습니다. 전시 후반부의 활동 사진들은 바로 그 모습을 전합니다."
  ]},
  {no:61, region:"nw", type:"터/표지석", name:"경성감옥 터", addr:"공덕동 105-10", audio:"audio/61_경성감옥터.mp3", script:[
   "서울서부지방법원 앞의 표석에는 경성감옥 터라고 적혀 있습니다. 지금 감옥 건물은 남아 있지 않지만, 이 일대에는 1963년까지 수감시설이 있었어요. 표석 옆 안내판과 옛 사진을 보면 법원이 들어서기 전의 부지를 살펴볼 수 있습니다. 당시 서울에서는 서대문과 이곳 마포에 두 개의 큰 감옥이 운영됐습니다.",
   "경성감옥이라는 이름은 처음에는 서대문 현저동의 감옥을 가리켰습니다. 1912년 마포 공덕리에 새 감옥을 설치하면서 이름을 이곳에 붙였고, 먼저 있던 감옥은 서대문감옥으로 바뀌었어요. 마포의 건물은 공사 막바지에 화재를 겪어 이듬해에 완성됐습니다. 1923년에는 두 곳 모두 감옥 대신 형무소라는 명칭을 쓰게 됐죠. 경성형무소와 서대문형무소는 같은 시기에 각기 다른 장소에서 운영된 시설입니다.",
   "삼일운동으로 투옥된 인사들 가운데에도 이곳에서 형기를 마친 사람들이 있었습니다. 1921년 11월 4일 아침, 출옥하는 이들을 맞으려고 가족과 지인들이 감옥 앞에 모였어요. 당시 신문은 전차길 옆부터 감옥 문 앞까지 사람들이 가득했다고 전합니다. 가족들은 갈아입을 옷을 가지고 들어갔고, 출옥자들은 차례로 옷을 바꿔 입고 문을 나섰습니다. 체포와 재판 기록 뒤에 어떤 만남이 기다리고 있었는지 알려주는 장면입니다.",
   "기록에 남은 출옥자 중에는 민족대표 박동완, 신석구 등이 있습니다. 같은 해 말에는 한용운과 오세창 등도 이 감옥에서 풀려났어요. 삼일운동의 독립선언을 준비한 사람들이 서대문에서 수감 생활을 시작해 마포에서 출옥한 경우도 있었던 것입니다. 감옥 사이로 사람을 옮겨 가두었기 때문에 한 인물의 수감 기록에서도 두 장소가 등장합니다. 법원 앞 표석은 그중 마포에서 보낸 시간을 알려줍니다.",
   "감옥의 작업장은 담장 안에만 있지 않았습니다. 가까운 도화동에는 벽돌을 만들던 연와공장이 있었고, 1913년 경성감옥이 운영을 맡은 뒤 수감자들의 노역장이 됐어요. 1924년 신문은 죄수복을 입은 사람들이 무장한 감시자 아래서 일하는 모습을 기록했습니다. 근대 서울에 벽돌 건물이 늘던 시기, 건축 재료를 만드는 일에 수감자들의 노동도 동원되고 있었던 겁니다.",
   "해방 뒤 이곳은 마포형무소, 마포교도소로 불렸습니다. 주변에 주택과 도로가 늘어나는 동안에도 감옥은 남아 있다가 1963년 안양으로 이전했어요. 이후 부지의 용도가 바뀌며 옥사와 담장은 사라졌고 지금의 법원이 들어섰습니다. 표석에서 다시 옛 이름을 읽어보세요. 경성감옥, 경성형무소, 마포교도소는 이곳 시설의 이름이 바뀐 순서입니다. 남아 있는 작은 안내판을 통해, 사람들이 갇혔고 일했으며 가족을 만나 나왔던 장소를 찾아볼 수 있습니다."
  ]},
  {no:62, region:"nw", type:"터/표지석", name:"마포 전차종점 3·1운동 만세시위지", addr:"마포대로 20", audio:"audio/62_마포전차종점삼일운동만세시위지.mp3", script:[
   "마포대로의 다보빌딩 앞 보도에는 옛 마포전차종점과 만세시위를 알리는 표석이 있습니다. 지금은 전차 선로나 종점 시설이 남아 있지 않아요. 이곳에서 기억할 날짜는 1919년 3월 1일, 시간은 밤 8시경입니다. 낮에 시작된 서울의 만세시위가 해가 진 뒤에도 한강 가까운 마포까지 이어졌습니다.",
   "마포에 전차가 들어온 것은 1907년입니다. 서대문에서 마포로 이어지는 노선이 생기면서 도심과 나루 사이를 전차로 오갈 수 있게 됐어요. 마포는 한강으로 들어오는 물자를 내려 도성으로 운반하던 곳이었습니다. 강을 따라 온 사람과 육지에서 온 사람이 오가던 길목에 전차 종점이 들어선 것이죠. 현재 도로와 강의 위치를 보며, 마포가 물길과 육지의 길을 잇던 동네였다는 점을 떠올려보세요.",
   "삼일운동 첫날 서울에서는 탑골공원에 모인 군중이 독립선언서를 접한 뒤 거리로 나섰습니다. 시위는 종로 한 곳에 머물지 않고 여러 방향으로 퍼졌어요. 일제가 집회를 막고 참가자를 체포하는 상황에서도 사람들은 다른 장소에 모여 만세를 불렀습니다. 마포전차종점 부근에서는 밤 8시경 약 천 명의 군중이 만세시위를 벌였다고 기록되어 있습니다.",
   "이 기록에서 눈여겨볼 것은 시각과 장소입니다. 만세운동은 3월 1일 오후의 선언식으로 끝난 행사가 아니었어요. 사람들이 집으로 돌아가던 저녁에도 시위가 계속됐고, 도성 밖의 생활공간으로 번졌습니다. 교통의 종점은 낮 동안 이동하던 사람들이 저녁에도 모일 수 있는 동네의 길목이었습니다. 독립을 요구하는 시위가 당시 서울의 여러 동네에서 벌어졌다는 구체적인 사례입니다.",
   "전차는 그 뒤에도 오랫동안 이 지역의 교통수단이었습니다. 마포종점이라는 이름은 1968년 발표된 노래에도 남았죠. 같은 해 서울의 전차 운행이 끝나면서 도로 위에서 전차가 사라졌습니다. 근처 마포어린이공원의 마포종점 노래비는 그 시절의 생활과 노래를 기리는 별도의 기념물이에요. 이곳 표석에서는 1919년 만세운동을, 노래비에서는 뒤에 이어진 전차 시대의 생활을 살펴볼 수 있습니다.",
   "표석을 보고 나서는 현재의 큰길과 마포대교 방향을 한번 바라보세요. 전차가 다니던 길은 지금도 사람들이 한강 쪽으로 오가는 통로입니다. 다만 만세시위 당시에는 지금의 마포대교가 없었고, 강을 건너거나 물자를 옮기는 방식도 달랐습니다. 당시 지도나 사진을 곁들여 보면 종점과 나루의 위치를 이해하기 좋아요. 표석에 남은 밤 8시라는 기록 덕분에 우리는 삼일운동 첫날의 서울을 한낮부터 저녁까지 조금 더 길게 따라가 볼 수 있습니다."
  ]},

  {no:63, region:"ne", type:"건축물/전시관", name:"만해 한용운 심우장", addr:"성북로29길 24", audio:"audio/63_만해한용운심우장.mp3", script:[
   "심우장은 한용운이 1933년부터 1944년까지 살았던 집입니다. 승려이자 시인, 독립운동가였던 그가 말년에 가족과 지낸 곳이에요. 집을 마련하는 데에는 여러 사람의 도움이 필요했습니다. 승려 김벽산이 자신이 사 두었던 땅을 내놓고, 지인들이 건축비를 보탰습니다. 성북동 비탈의 이 작은 한옥에서 한용운은 소설을 쓰고, 찾아오는 사람을 만나고, 먼저 세상을 떠난 동지의 장례도 치렀습니다.",
   "먼저 처마 아래 심우장 현판을 보세요. 글씨를 쓴 사람은 서예가 오세창입니다. 한용운과 나란히 삼일운동 민족대표 33인에 이름을 올렸던 독립운동가죠. 집터와 건축비를 보탠 사람들에 이어 현판에도 오랜 동지의 손길이 남아 있어요. 심우는 한자로 소를 찾는다는 뜻입니다. 불교에서는 잃어버린 소를 찾는 일에 빗대어 본래의 마음과 깨달음을 구하는 과정을 설명합니다. 수행자인 한용운이 자기 집에 붙인 이름이에요.",
   "집은 정면 네 칸, 옆면 두 칸의 단층 한옥입니다. 가운데 대청을 두고 양옆으로 온돌방을 배치했어요. 방 가운데 하나는 서재로 쓰였습니다. 마당에서 기둥 사이의 간격과 대청, 방이 이어지는 모습을 살펴보면 집의 크기를 가늠할 수 있습니다. 넓은 저택은 아니지만 생활하는 방과 글 쓰는 자리를 마련한 구조예요. 지붕은 양쪽 끝이 비스듬하게 꺾여 내려오는 팔작지붕입니다.",
   "이 집은 남향 대신 동북쪽을 향해 앉아 있습니다. 남쪽의 조선총독부 청사를 마주 보고 살기 싫어 한용운이 방향을 바꾸게 했다는 이야기가 전해져요. 당시 총독부는 경복궁에 있었습니다. 집을 지을 무렵에는 삼일운동으로 옥고를 치른 지도 십여 년이 지났지만, 그는 계속 독립운동에 관여하고 있었습니다. 심우장에 살던 말년에도 창씨개명과 조선인 학생의 전쟁 동원에 반대했습니다.",
   "한용운의 문학으로는 시집 「님의 침묵」이 가장 익숙할 겁니다. 이 책은 심우장에 오기 전인 1926년에 출간됐어요. 여기서는 장편소설 「흑풍」을 쓰고 신문에 연재하는 등 새로운 작업을 이어 갔습니다. 독자들은 신문을 펼쳐 연재되는 소설을 읽었죠. 우리가 시인으로 먼저 떠올리는 한용운은 불교 개혁을 주장하는 책을 펴내고, 감옥에서 조선 독립의 정당성을 논하는 글을 쓰고, 신문에 소설도 발표한 사람이었습니다.",
   "1937년에는 심우장에서 독립운동가 김동삼의 장례가 열렸습니다. 만주에서 활동하던 김동삼은 체포된 뒤 감옥에서 세상을 떠났어요. 한용운은 그의 유해를 이 집으로 모셔 와 닷새 동안 장례를 치렀습니다. 옥중에서 숨진 동지를 집에 모시고 마지막 인사를 나눈 것입니다. 마당과 방을 둘러볼 때 이 장례를 기억해 두세요. 글을 쓰고 가족과 살던 집이 동지를 보내는 빈소가 되기도 했습니다.",
   "한용운도 광복을 보지 못했습니다. 1944년 6월 29일 이 집에서 세상을 떠났고, 유해는 망우리에 안장됐습니다. 심우장은 2019년 사적으로 지정되었어요. 공개된 전시구역에서는 그의 생애와 활동을 소개하는 자료를 볼 수 있습니다. 현판에 쓰인 집 이름, 가운데 놓인 대청, 서재로 쓰던 방을 차례로 살펴보세요. 이곳에서 보낸 열한 해 동안 한용운이 글을 쓰고 사람을 맞았던 집의 규모와 짜임은 지금도 남아 있습니다."
  ]},
  {no:64, region:"ne", type:"전시관", name:"문화공간 이육사", addr:"종암로21가길 36-1", audio:"audio/64_문화공간이육사.mp3", script:[
   "문화공간이육사의 층별 안내에는 시 제목이 붙어 있습니다. 1층은 청포도, 2층은 광야, 3층은 교목이에요. 전시를 보고 책을 읽는 장소에 이육사의 작품 이름을 붙였습니다. 이 건물 가까이에 그와 가족이 살던 종암동 62번지 집이 있었습니다. 1939년 이 동네로 이사한 이육사는 「청포도」와 「절정」을 발표했어요. 성북구는 그의 종암동 생활을 기념하기 위해 2019년 이곳을 열었습니다.",
   "이육사의 본명은 이원록입니다. 육사라는 이름의 출발은 감옥에서 받은 번호였어요. 1927년 장진홍의 조선은행 대구지점 폭파 사건에 연루됐다는 혐의로 붙잡혀 대구형무소에 갇혔습니다. 그때의 수인번호 264에서 필명이 비롯된 것으로 알려져 있습니다. 풀려난 뒤 신문기자로 일할 때에는 이활이라는 이름도 썼어요. 1930년 조선일보에 발표한 첫 시 「말」에도 이활이라는 이름이 실렸습니다.",
   "1932년에는 중국으로 건너가 의열단이 세운 조선혁명군사정치간부학교에 들어갔습니다. 이름이 길지만, 독립운동을 맡아 이끌 사람들에게 군사와 정치 교육을 하던 학교예요. 이육사는 그곳에서 훈련을 받고 국내로 돌아왔습니다. 신문에 글을 쓰고 시를 발표하는 동안에도 국내외를 오가며 독립운동을 계속했죠. 경찰의 감시와 거듭되는 체포 때문에 생활과 문학 활동은 자주 끊겨야 했습니다.",
   "종암동으로 온 해 여름, 잡지 「문장」에 「청포도」가 실렸습니다. 고향의 칠월, 익어 가는 포도, 먼 곳에서 찾아올 손님을 기다리는 장면이 이어지는 시예요. 손님을 맞을 은쟁반과 하얀 모시 수건까지 준비합니다. 막연히 누군가를 그리워하는 데서 그치지 않고, 도착하면 무엇으로 대접할지 구체적으로 그렸죠. 이육사가 그토록 기다린 것은 무엇이었을지 생각하며 시를 읽어보세요. 고향을 떠나 서울에 살던 그의 처지도 떠올려볼 수 있습니다.",
   "이듬해 발표한 「절정」은 분위기가 다릅니다. 매서운 계절에 쫓겨 와, 발을 내디딜 곳조차 찾지 못하는 사람을 그려요. 두 작품을 연이어 읽으면 같은 시인이 기다림과 위기를 얼마나 다른 풍경으로 표현했는지 느낄 수 있습니다. 종암동에서의 생활에는 가족의 기쁨도 있었습니다. 1941년 딸 이옥비가 태어났어요. 전시에서는 이육사의 활동 자료뿐 아니라 딸의 인터뷰 영상으로 가족이 기억하는 아버지의 모습도 소개해 왔습니다.",
   "1943년 다시 체포된 이육사는 베이징으로 압송됐고, 이듬해 1월 옥중에서 세상을 떠났습니다. 유해를 수습한 사람은 독립운동 동지이자 친척인 이병희였습니다. 그의 도움으로 유골은 동생 이원창에게 전해져 국내로 돌아왔어요. 남겨진 시를 모아 알리는 일은 또 다른 동생 이원조가 맡았습니다. 「광야」와 「꽃」은 광복 뒤 발표됐고, 1946년에는 「육사시집」이 나왔습니다.",
   "문화공간이육사의 개관일은 12월 17일입니다. 유고시 「광야」가 처음 발표된 날에 맞췄어요. 2층 광야 상설전시실에서는 생애 자료와 작품을 살펴볼 수 있고, 1층 청포도 라운지에는 책을 읽는 자리가 마련돼 있습니다. 이곳에 붙은 시 제목 가운데 한 편을 골라 읽어보면 좋겠습니다. 생전에 자신의 시집을 내지 못했던 이육사의 작품이 이제는 책과 전시, 종암동의 공간 이름으로 독자들을 만나고 있습니다."
  ]},
  {no:65, region:"ne", type:"기념물", name:"뚝섬 만세운동 기념비", addr:"성수동1가", audio:"audio/65_뚝섬만세운동기념비.mp3", script:[
   "뚝섬문화공원의 기념비는 만세를 부르는 두 팔에서 모양을 가져왔습니다. 서로 다른 돌이 맞물리며 위로 뻗은 모습을 보세요. 배수영이 디자인하고 조각가 김준만이 제작한 이 비는 2021년 3월 1일 세워졌습니다. 기념하는 사건은 102년 앞선 1919년, 뚝섬 마을에서 일어난 만세운동입니다. 비 앞에서 그날 시위에 나섰던 사람들의 이름과 직업을 살펴보겠습니다.",
   "당시 뚝섬은 경기도 고양군 뚝도면에 속했습니다. 한강 상류에서 내려온 뗏목이 닿고, 땔감과 짐을 서울로 실어 나르던 물류의 길목이었어요. 나루에서 화물을 내리는 사람, 지게로 짐을 지는 사람, 말과 소가 끄는 수레를 모는 사람들이 이곳에서 일했습니다. 밥집과 숙박업소도 생겼고, 면사무소와 헌병주재소 같은 관공서도 모여 있었습니다. 일을 구하고 물건을 나르러 온 사람들이 소식을 주고받던 마을이었죠.",
   "삼일운동이 시작된 뒤 3월 12일에는 뚝도간이농업학교와 뚝도공립보통학교 학생들을 중심으로 시위가 일어났습니다. 이어 23일부터 마을에 ‘주의서’라는 유인물이 돌았어요. 전국에서 독립을 외치는데 뚝도 청년들은 왜 가만히 있느냐며 참여를 촉구하는 글이었습니다. 우물 앞으로 모이자고 장소를 정하고, 저녁 일곱 시 반이라는 시간까지 알렸습니다. 동네 사람들이 아는 우물터가 약속 장소가 된 것입니다.",
   "3월 26일 저녁, 여러 곳에서 시작한 시위가 면사무소 쪽으로 모였습니다. 앞장선 사람들 가운데 마차꾼 김완수, 공장 노동자 신원룡과 최자근동이 있었어요. 짐차에 화물을 싣고 내리던 염명석도 참여했습니다. 학생들이 먼저 나섰던 시위에 노동자와 주민들의 큰 행렬이 이어졌습니다. 평소 수레를 몰고 짐을 옮기던 사람들이 그날에는 태극기를 들고 독립을 요구했습니다.",
   "시위대 일부는 면사무소와 면장의 집으로 몰려가 항의했고, 면서기를 때리는 충돌도 벌어졌습니다. 약 300명은 헌병주재소를 둘러싸고 태극기를 흔들며 만세를 불렀어요. 김완수 등이 헌병과 교섭해 시위대를 해산하려던 중 서울에서 증파된 병력이 도착했고, 발포가 이어졌습니다. 독립기념관의 기록에는 한 명이 숨지고 열두 명이 다쳤으며, 백여 명이 붙잡힌 것으로 나옵니다.",
   "염명석은 그날 다친 뒤 몸을 피했습니다. 다른 부상자와 서울의 세브란스병원을 찾아 치료를 받다가 결국 체포됐어요. 재판에서는 징역 6개월을 선고받았습니다. 판결문과 수감 기록에는 이렇게 시위 뒤 각자가 겪은 일도 남아 있습니다. 염명석은 광복 뒤까지 살았고, 1967년 세상을 떠났습니다. 그의 독립운동 공적에 대한 대통령표창은 사후인 2011년에 수여됐습니다.",
   "오래된 기록을 모아 동네 사람들에게 알리는 작업은 성동역사문화연구회가 이어 갔습니다. 주민과 후손의 이야기를 듣고, 판결문과 수감카드, 옛 지도를 대조했어요. 그렇게 모은 내용을 2016년 자료집 「뚝섬삼일운동」으로 펴냈습니다. 지금의 도로와 건물만 보고는 알기 어려운 우물터와 관공서의 위치, 시위를 이끈 주민들의 이름을 다시 찾는 작업이었습니다. 이 조사와 주민들의 노력이 기념비 건립으로 이어졌습니다.",
   "기념비는 그 역사를 사람들이 오가는 공원에서 읽을 수 있도록 세웠습니다. 들어 올린 두 팔의 형상 아래에는 독립을 위해 나섰던 이들의 용기와 희생을 기리는 글이 새겨져 있어요. 뚝섬의 만세운동을 기억할 때 김완수, 신원룡, 최자근동, 염명석이라는 이름도 같이 기억해 두면 좋겠습니다. 나루의 짐과 수레를 움직이던 사람들이 이 동네에서 독립운동을 이끌었습니다."
  ]},
  {no:66, region:"ne", type:"건축물", name:"봉황각", addr:"우이동 26", audio:"audio/66_봉황각.mp3", script:[
   "봉황각은 손병희가 1912년에 세운 천도교 수련원입니다. 한옥의 처마 아래에는 오세창이 쓴 현판이 걸려 있습니다. 오세창은 서예가이면서 훗날 손병희와 함께 3·1운동 민족대표로 참여한 인물이에요. 수련원을 세운 사람과 현판을 쓴 사람이 7년 뒤 독립선언에 함께 이름을 올렸습니다.",
   "현판의 ‘봉황각’ 세 글자에는 재미있는 특징이 있어요. ‘봉’은 안진경, ‘황’은 회소, ‘각’은 미불의 글씨를 본떴습니다. 중국의 명필 세 사람의 서체를 한 현판에 모은 것이죠. 글자마다 획의 굵기와 모양을 비교해보세요. 이름에 들어간 봉황은 동학을 창시한 최제우의 시문에서 가져왔습니다. 손병희는 동학을 천도교로 개편해 이끌던 세 번째 지도자였습니다.",
   "1910년 나라를 빼앗긴 이듬해, 손병희는 우이동의 밭과 임야를 사들였습니다. 여기에 수련원을 짓고 전국의 천도교 지도자들을 불러들였어요. 종교의 가르침을 익히는 일과 나라가 처한 형편을 아는 일을 중요하게 여겼습니다. 손병희 자신도 이곳에서 여러 해 생활하며 교단의 운영과 구국운동을 구상했습니다. 당시 봉황각에는 배우러 온 사람과 가르치는 사람의 생활이 모두 필요했던 거예요.",
   "수련은 1912년부터 1914년까지 일곱 차례 이루어졌고, 모두 483명이 참가했습니다. 한 차례에 49일이 걸렸으니 잠깐 강연을 듣고 돌아가는 교육은 아니었죠. 각 지역에서 온 교역자들은 오랫동안 한곳에 머물며 수련한 뒤 돌아갔습니다. 이들 가운데 많은 사람이 1919년 각지의 만세운동에서 중요한 역할을 했어요. 전국에 있던 천도교 조직과 그 조직을 움직일 사람들이 3·1운동을 널리 확산시키는 데 힘이 되었습니다.",
   "1919년 독립운동을 준비할 때 손병희는 권동진, 오세창, 최린과 운동의 원칙을 논의했습니다. 많은 사람이 참여하도록 하고, 여러 세력의 힘을 하나로 모으며, 비폭력으로 진행한다는 것이었어요. 천도교만 나서는 운동이 아니라 기독교와 불교 등 종교의 경계를 넘어 참여하는 운동을 추진했습니다. 민족대표 33명 가운데 천도교 인사가 15명이었다는 점에서도 교단이 맡았던 비중을 알 수 있죠. 봉황각의 수련을 거친 지도자들이 각 지역에서 활동한 것은 이런 준비에 큰 힘이 되었습니다.",
   "건물을 살펴보면 가운데 대청을 두고 양옆에 누마루와 방을 배치한 한옥입니다. 뒤쪽에도 방이 있어요. 방은 생활하고 머무는 데, 마루는 여러 사람이 모이는 데 알맞은 구성이죠. 목조 기둥과 기와지붕, 방과 마루의 배치를 보시면 수련원에서 사람들이 어떻게 지냈을지 가늠할 수 있습니다. 내부가 닫혀 있다면 경내에서 외관을 살펴봐 주세요.",
   "앞쪽의 붉은 벽돌 별관은 따로 살펴볼 만합니다. 원래 종로 경운동에 있던 천도교 중앙총부 건물을 1969년 이곳으로 옮겼어요. 한옥 봉황각과는 처음 세워진 장소도 용도도 달랐습니다. 중앙총부는 교단의 일을 처리하던 곳이고, 봉황각은 지도자를 교육하던 곳이었죠. 지금 한 경내에 있는 두 건물을 비교하면 천도교가 사무를 맡을 조직과 사람을 기를 시설을 각각 갖추고 있었음을 알 수 있습니다.",
   "손병희는 1919년 민족대표로 독립선언에 참여한 뒤 체포되어 옥고를 치렀습니다. 병으로 풀려났지만 건강을 되찾지 못하고 1922년 세상을 떠났어요. 가까운 언덕에 그의 묘소가 있습니다. 묘소까지 방문하신다면 봉황각에서 배우고 활동하던 시기와, 옥고를 치른 뒤의 짧은 여생을 차례로 짚어보세요. 손병희가 바라던 독립은 그가 세상을 떠난 뒤 23년이 지나서야 이루어졌습니다."
  ]},
  {no:67, region:"ne", type:"묘역/장소", name:"순국선열 묘역 순례길", addr:"수유동 산73-10", audio:"audio/67_순국선열묘역순례길.mp3", script:[
   "북한산둘레길 2구간, 순례길입니다. 솔밭근린공원 상단에서 이준 열사 묘역 입구까지 약 2.3킬로미터 이어져요. 숲길 옆 안내판에는 이준, 이시영, 김병로, 신익희 같은 이름이 나옵니다. 이 주변 묘역을 돌아보면 외교관과 법률가, 독립군을 키운 사람과 임시정부를 지킨 사람의 이야기를 차례로 만나게 됩니다.",
   "이준은 1907년 고종의 특사로 이상설, 이위종과 함께 네덜란드 헤이그에 갔습니다. 일본이 대한제국의 외교권을 빼앗은 을사늑약의 부당함을 만국평화회의에 알리려 했어요. 그러나 세 사람은 회의장에 들어가지 못했습니다. 이들은 각국 대표에게 호소문을 보내고 기자들을 만나 대한제국의 사정을 알렸죠. 특히 외국어에 능통한 이위종이 국제 언론을 상대로 한국의 입장을 전했습니다.",
   "이준은 임무를 마치고 돌아오지 못한 채 그해 7월 헤이그에서 세상을 떠났습니다. 그의 유해는 현지 공동묘지에 안장되었다가 1963년 고국으로 돌아와 수유리에 모셔졌어요. 떠날 때에는 대한제국의 특사였지만, 유해가 돌아왔을 때에는 광복 뒤 남북이 분단된 대한민국이었습니다. 묘비의 생몰년과 안내문에 적힌 봉환 연도를 보시면, 사망에서 귀환까지 56년이 걸렸다는 사실을 확인할 수 있습니다.",
   "초대 부통령 이시영에게는 여섯 형제가 재산을 정리하고 만주로 떠난 이야기가 있습니다. 이회영의 형제이기도 한 그는 1910년 국권을 빼앗긴 뒤 가족들과 서간도로 망명했습니다. 이들이 마련한 자금은 한인들이 자리 잡을 터전과 독립운동 교육기관을 세우는 데 쓰였어요. 신흥무관학교로 이어지는 학교를 통해 청년들을 길렀지만, 현지의 흉년과 계속되는 지출로 생활은 점점 어려워졌습니다. 묘비에 남은 ‘부통령’이라는 직함보다 훨씬 앞선 시기의 일입니다.",
   "초대 대법원장 김병로는 일제강점기에 독립운동가들의 변론을 맡았던 변호사였습니다. 독립을 위해 활동하다 법정에 선 사람들을 돕다가, 광복 뒤에는 새 나라의 사법부를 이끄는 책임을 맡았죠. 강북구는 김병로와 이시영, 신익희 등 초대 직위를 맡았던 인물들의 묘역을 잇는 탐방 코스를 ‘초대길’이라고 부릅니다. 길에서 만나는 이름 하나하나에 독립 전후의 활동이 이어져 있습니다.",
   "한국광복군 합동묘소 터에는 열일곱 분을 모셨던 내력이 남아 있습니다. 중국에서 순국한 열세 분과 광복 뒤 세상을 떠난 네 분을 위해 동료 광복군들이 1961년 합동묘소를 마련했어요. 해외에서 싸우다 숨진 동료의 유해를 모으고, 귀국한 뒤에도 그 묘소를 돌보는 일까지 남은 사람들이 맡았습니다. 2022년에는 열일곱 분의 유해를 국립대전현충원으로 옮겼습니다. 지금 이곳에서는 옛 묘소 터를 볼 수 있어요.",
   "이장 과정에서 새로 밝혀진 일도 있습니다. 한휘 지사의 독립운동 공적을 확인해 뒤늦게 훈장을 추서한 것이죠. 같은 합동묘소에 모셨던 사람 가운데에서도 활동 기록을 충분히 찾지 못해 포상을 받지 못한 분이 있었던 것입니다. 열일곱 분을 모신 터의 안내문을 읽어보시면, 유해를 돌본 동료들의 노력과 공적을 찾아낸 조사자의 일이 모두 필요했음을 알 수 있습니다.",
   "길 중간의 전망대에서는 국립4·19민주묘지를 내려다볼 수 있습니다. 1960년 부정선거에 항의한 학생과 시민들이 경찰의 발포로 희생되고, 그 저항이 이승만 대통령의 하야로 이어졌죠. 숲속의 독립운동가 묘소와 아래쪽의 정돈된 민주묘역을 차례로 보게 되는 구간입니다. 묘역으로 들어가는 샛길이 여러 곳 있으니, 한 분의 묘소에 들른 뒤에는 이정표에서 다음 행선지를 확인하며 천천히 걸어주세요."
  ]},
  {no:68, region:"ne", type:"전시관", name:"근현대사기념관", addr:"4.19로 114", audio:"audio/68_근현대사기념관.mp3", script:[
   "근현대사기념관은 1894년 동학농민운동에서 1960년 4·19혁명까지의 역사를 다룹니다. 북한산 자락에 이런 기념관이 있는 데에는 이유가 있어요. 가까이에 독립운동가들의 묘역과 국립4·19민주묘지가 있고, 우이동에는 손병희가 지도자들을 길러낸 봉황각이 있습니다. 2016년 문을 연 이 기념관에서는 그 장소들에 얽힌 사건을 사진과 문서로 먼저 살펴볼 수 있어요.",
   "전시실에서 처음 따라갈 이야기는 동학농민운동과 의병전쟁입니다. 동학농민군은 탐관오리의 수탈과 외세의 침략에 맞서 일어났습니다. 이어 일본이 국권을 빼앗는 과정에서 각지의 의병이 무기를 들었죠. 전시된 문서에서는 사람들이 무엇에 반대하고 무엇을 요구했는지 살펴보세요. 사건의 연도만으로는 알기 어려운 당시 사람들의 생각이 글 안에 담겨 있습니다.",
   "이곳에서 소개해온 자료 가운데에는 사발통문이 있습니다. 이름을 위아래로 줄 세우지 않고 원형으로 적은 모양이 눈에 띄어요. 동학농민운동을 계획한 사람들이 뜻을 모았던 문서입니다. 또 대한제국의 형편을 외국에 알린 자료로는 헤이그 특사들의 사진과 인터뷰가 실린 만국평화회의보를 들 수 있어요. 고종이 보낸 이상설, 이준, 이위종은 회의장에 들어가지 못하자 언론을 통해 일본의 침략을 알렸습니다. 당시 자료가 진열되어 있다면 사진 옆의 글과 발행 연도를 함께 보세요.",
   "1919년 3·1운동과 대한민국 임시정부 수립 이후에는 독립을 이루려는 방법도 더 다양해집니다. 선언서를 인쇄해 나누고, 학교에서 사람을 길러내고, 국외에서 군대를 조직하는 활동이 이어졌어요. 2020년에 시작한 특별전에서는 독립군의 훈련교본, 봉오동전투상보, 광복군이 남긴 수기 등을 소개하기도 했습니다. 전투를 치른 사람이 자기 경험을 글로 남겼기 때문에, 뒤의 사람들이 부대의 활동과 개인의 생활을 자세히 알 수 있게 된 거죠.",
   "상설전시의 영상은 소년 시절 광복을 맞은 주인공이 청년이 되어 4·19혁명을 겪는 내용으로 구성되어 있습니다. 아버지에게 보내는 편지 형식을 빌려, 한 사람이 살아가는 동안 나라에 어떤 변화가 있었는지 전해요. 1945년의 광복에서 1960년의 혁명까지는 15년입니다. 소년이 어른이 되는 그 시간에 분단과 전쟁이 있었고, 학생과 시민들은 부정선거에 항의하며 다시 거리로 나섰습니다.",
   "마지막 부분의 주제는 민주공화국입니다. 이곳이 소개하는 자료에는 제헌헌법을 실은 관보와 광복 뒤 출판된 독립운동 관련 책들도 있어요. 새 정부를 세운 뒤 어떤 원칙으로 나라를 운영할 것인지 문서로 정하고, 그동안의 독립운동을 책으로 정리한 것입니다. 헌법에 국민의 권리를 적어 놓는 일과 그 권리가 실제로 지켜지도록 하는 일 사이에는, 4·19혁명에 참여한 시민들의 행동이 있었습니다.",
   "기획전시실에서는 수유동과 인연이 있는 인물들을 더 깊게 다루어 왔습니다. 2022년에는 손병희 순국 100주기 특별전, 2023년에는 이준 유해 봉환 60주기 특별전이 열렸어요. 손병희는 3·1운동 뒤 옥고를 치르고 1922년 세상을 떠났고, 이준은 1907년 헤이그에서 순국한 뒤 1963년에야 고국으로 돌아왔습니다. 특별전에서 다룬 인물을 주변의 실제 묘역에서 다시 찾아볼 수 있다는 점이 이 기념관의 특징입니다.",
   "밖으로 나오시면 앞뜰의 독립민주기념비도 살펴보세요. 시민들의 성금으로 만들어 2016년 광복절에 세웠고, 뒷면에는 독립선언서 전문이 새겨져 있습니다. 김구의 흉상을 비롯한 야외 조형물도 볼 수 있어요. 전시실에서는 종이와 사진으로 보았던 인물의 이름을 밖에서는 흉상과 묘역 안내에서 다시 만나게 됩니다. 이어서 순례길을 걷는다면, 오늘 전시에서 눈에 들어온 인물의 묘소 한 곳을 먼저 찾아가셔도 좋겠습니다."
  ]},
  {no:69, region:"ne", type:"공원/기념물", name:"창동역사문화공원", addr:"도봉로 552", audio:"audio/69_창동역사문화공원.mp3", script:[
   "창동역사문화공원의 세 동상부터 살펴보겠습니다. 김병로, 송진우, 정인보입니다. 법률가와 언론인, 국학자로 활동한 이들을 이 동네에서는 ‘창동 3사자’라고 불러요. 세 사람 모두 일제강점기에 창동에 살았고, 일제의 협력 요구와 탄압 속에서 뜻을 지킨 인물로 기억되고 있습니다. 지금은 도로와 주택이 많은 곳이지만, 당시 창동은 경성 바깥의 농촌 마을이었어요.",
   "가인 김병로는 독립운동가들의 재판을 맡아 변론했던 변호사입니다. 독립을 위해 활동한 사람이 체포되면 수사와 재판을 거쳐 감옥에 가는 일이 이어졌죠. 그 과정에서 법률 지식으로 피고인을 돕는 사람이 필요했습니다. 김병로는 무료 변론에도 나서며 이 일을 맡았어요. 광복 뒤에는 대한민국 초대 대법원장이 되어 사법부를 이끌었습니다. 동상 옆 이름을 보실 때 ‘가인’이라는 호도 함께 기억해두세요. 강북구 순례길에서는 그의 묘소를 찾아볼 수 있습니다.",
   "고하 송진우는 동아일보를 이끌던 언론인입니다. 신문을 통해 사회의 일을 알리는 한편 물산장려운동과 민립대학 설립운동에도 참여했어요. 물산장려운동은 조선 사람이 만든 물건을 써서 경제적 힘을 기르자는 운동이었습니다. 민립대학은 민간의 힘으로 세우려 했던 대학을 말하고요. 학교에 갈 사람이 늘어도 고등교육의 기회가 충분하지 않았던 때, 사람을 가르칠 대학을 직접 마련하려 했습니다.",
   "위당 정인보는 우리 역사와 문화를 연구하고 가르친 학자였습니다. 그가 참여한 일 가운데 하나가 정약용의 글을 모은 ‘여유당전서’를 교열하는 작업이에요. 안재홍과 함께 원고를 검토했고, 책은 1934년부터 1938년까지 간행되었습니다. 전서는 정약용의 시와 편지뿐 아니라 정치, 경제, 지리, 의학에 관한 글까지 모은 방대한 책입니다. 흩어진 글을 정리해 읽을 수 있게 만드는 일은 뒤에 실학을 연구할 사람들에게 중요한 토대가 되었죠.",
   "세 동상의 인물들은 같은 일을 한 사람들이 아닙니다. 김병로는 법정에서 사람을 변호했고, 송진우는 신문과 사회운동으로 사람을 모았으며, 정인보는 글을 정리하고 학생들을 가르쳤습니다. 일제 말기 이들이 창동에서 지냈다는 인연 때문에 도봉구는 세 사람을 한곳에서 기리게 되었어요. 동상은 2017년 8월 15일에 세워졌습니다. 기념물에 새긴 이름과 건립 시기를 보시면, 당시의 거주지와 훗날 마련한 기념공원이 어떻게 연결되는지 알 수 있어요.",
   "공원에는 평화의 소녀상도 있습니다. 도봉구 청소년들이 건립을 이끌고 주민들이 힘을 보탠 조형물이에요. 일본군‘위안부’ 피해자를 기억하고 전쟁과 폭력이 반복되지 않기를 바라는 뜻을 담았습니다. 역사적 인물을 기리는 동상들 곁에 청소년들이 제안한 추모물이 자리한다는 점을 보아주세요. 이 공원의 기념물들은 지역 주민들이 무엇을 기릴지 고민하고 참여한 결과입니다.",
   "이곳에서 시작하는 창동역사문화길은 주변 인물들의 옛집터로 이어집니다. 창동리 석조이정표와 ‘임꺽정’을 쓴 홍명희의 옛집터, 창동 3사자의 옛집터를 거쳐 전태일 옛집터와 함석헌기념관까지 찾아가는 코스예요. 공원의 동상에서 인물을 먼저 알고 나서, 그 사람이 실제로 생활했던 동네를 걷게 됩니다. 옛집이 없어진 자리에는 표지와 안내가 남아 있으니, 길에서는 집의 형태보다 당시 그곳에 살았던 사람의 이름을 따라가 보세요."
  ]},
  {no:70, region:"ne", type:"기념물", name:"의병대장 유세열 기념비", addr:"덕릉로79길 35", audio:"audio/70_의병대장유세열기념비.mp3", script:[
   "당현천변의 이 비석은 의병대장 유세열을 기리는 기념비입니다. 유세열은 항일 의병활동을 했고, 지금의 노원구 상계동 일대인 상계리에서 살았던 인물이에요. 큰 기념관 대신 주민들이 오가는 하천 길에 이름이 남았습니다. 비석에서 먼저 ‘의병대장’이라는 호칭과 ‘유세열’이라는 이름을 읽어보세요. 그가 살았던 마을과, 나라를 지키려 했던 활동을 기리는 비입니다.",
   "의병이란 나라가 위기에 빠졌을 때 자발적으로 일어나 싸운 사람들을 말합니다. 대한제국 말기에는 일본의 침략에 맞서 곳곳에서 의병이 일어났어요. 1905년 을사늑약으로 외교권을 빼앗기자 저항은 더욱 거세졌고, 1907년에는 강제로 해산된 대한제국 군인들도 의병에 합류했습니다. 유생과 농민, 군인처럼 서로 다른 경험을 가진 사람들이 무기를 들고 모였습니다.",
   "노원문화원이 전하는 유세열의 이야기에는 최익현과 이강년의 이름이 나옵니다. 두 사람 모두 항일 의병을 이끈 지도자였습니다. 최익현은 을사늑약에 반대하며 의병을 일으켰고, 이강년은 여러 지역을 옮겨 다니며 일본군과 싸웠죠. 유세열 역시 이들과 항일 거사를 도모한 인물로 전해집니다. 당시 의병활동에서는 각지의 지도자가 서로 연락하고 뜻을 모으는 일이 중요했습니다.",
   "문화원의 기록은 유세열이 일본 관헌에게 붙잡혔을 때의 태도를 특히 전합니다. 그는 자신도 자기 나라를 위해 충성했을 뿐인데 무엇이 잘못이냐는 뜻으로 맞섰다고 해요. 일본은 의병을 잡아 처벌했지만, 유세열은 나라를 지키려 한 자기 행동이 정당하다고 주장한 것입니다. 이 일화에서 지역 사람들이 오래 기억한 것은 그가 붙잡힌 뒤에도 뜻을 굽히지 않았다는 점입니다.",
   "상계리로 돌아온 뒤 남겼다는 마지막 당부도 있습니다. 자신은 해야 할 일을 했을 뿐이니 공적을 내세우지 말고, 역사를 바르게 쓰라는 내용이에요. 또 큰 선행을 했다고 멈추지 말고 작은 잘못이라도 저지르지 말라고 당부했다고 전합니다. 노원문화원은 이 이야기를 정리해 주민과 어린이들이 읽을 수 있는 웹툰으로 만들었습니다. 기념비에 짧게 새겨진 이름을 지역의 인물 이야기로 다시 소개한 것이죠.",
   "기념비가 선 당현천 일대는 오늘날 산책하고 운동하는 생활공간입니다. 상계리라는 옛 지명은 지금의 상계동으로 이어집니다. 비석에 적힌 인물의 이름을 읽은 뒤 주변 지명을 보면, 의병의 활동 뒤에 그가 돌아와 살았던 마을이 있었음을 알 수 있어요. 유세열을 더 알아보고 싶으시다면 노원문화원의 인물 자료를 찾아보세요. 이곳에서는 항일 의병활동을 했던 한 사람이 노원의 주민으로도 기억되고 있습니다."
  ]},
  {no:71, region:"ne", type:"묘역/전시관", name:"망우역사문화공원", addr:"망우로91길 2 망우역사문화공원", audio:"audio/71_망우역사문화공원.mp3", script:[
   "망우역사문화공원은 1933년 경성부의 공동묘지로 문을 연 곳입니다. 1973년까지 매장이 계속되었고, 많은 서울 시민이 이 산자락에 가족을 모셨습니다. 산길을 따라가면 한용운, 방정환, 이중섭처럼 익숙한 이름과 이름을 처음 듣는 사람들의 묘소를 만나요. 처음부터 유명 인물만을 위해 만든 공원은 아니었습니다. 공동묘지에 안장된 사람들의 생애를 조사하고 알리면서 오늘의 역사문화공원으로 가꾸게 되었죠.",
   "입구의 중랑망우공간은 2022년에 문을 열었습니다. 전시와 교육을 통해 공원의 역사와 이곳에 묻힌 인물들을 소개하는 시설이에요. 여기에서 안내도를 보고 찾아갈 묘소를 골라두시면 좋습니다. 산책로에서 묘소까지는 따로 들어가는 길이 있기 때문이죠. 길가의 연보비에는 인물이 살았던 시기와 주요 활동이 적혀 있습니다. 이름 아래 적힌 연도를 읽고 실제 묘역으로 들어가면 한 사람의 생애를 좀 더 차분히 살펴볼 수 있어요.",
   "만해 한용운은 시집 ‘님의 침묵’으로 널리 알려져 있지만, 3·1운동 때에는 독립선언서를 나누는 일에도 직접 참여했습니다. 불교계를 맡아 약 3천 장을 인수해 배포했어요. 태화관의 독립선언식에 참석한 뒤 체포되었고, 감옥에서도 조선 독립에 관한 글을 썼습니다. 출옥 뒤에는 불교 개혁과 사회운동을 계속했죠. 1944년 성북동 심우장에서 세상을 떠나 이곳에 모셔졌습니다. 광복을 불과 1년여 앞두고 숨진 것입니다.",
   "소파 방정환의 묘소도 있습니다. 방정환은 1923년 잡지 ‘어린이’를 창간하고 색동회를 조직했습니다. 이원수와 윤석중 같은 아동문학가들이 이 잡지를 통해 이름을 알렸어요. 아이들에게 읽을거리를 만들어 주고, 아이가 한 사람으로 존중받아야 한다고 알리는 일이 그의 활동에서 중요했습니다. 1931년 세상을 떠난 뒤 처음에는 홍제동 납골당에 모셨다가 1936년 망우리로 옮겼습니다. 이곳의 묘역 가운데에는 이렇게 다른 곳에서 이장해온 무덤도 있습니다.",
   "화가 이중섭은 한국전쟁 때 아내와 두 아들과 함께 피란을 왔습니다. 서귀포와 부산, 통영 등지를 옮겨 다녔고, 생활이 어려워지자 아내와 아이들은 일본으로 갔어요. 가족과 헤어져 지내던 시기에도 소와 어린이, 가족을 그렸습니다. 재료가 부족할 때 담뱃갑 은박지에 선을 긁어 그린 은지화도 남겼죠. 1956년 서울적십자병원에서 세상을 떠나 이곳에 묻혔습니다. 그의 묘소에서는 유명한 소 그림과 함께, 가족을 그리워하며 작업하던 생활도 떠올려볼 수 있어요.",
   "안창호와 박찬익의 옛 묘역에는 또 다른 사연이 있습니다. 안창호의 유해는 1973년 강남의 도산공원으로, 임시정부에서 활동한 박찬익의 유해는 1993년 국립서울현충원으로 옮겨졌어요. 망우리에는 이들이 한때 안장되어 있던 자리가 남았습니다. 이장 연도를 따라가면 독립운동가를 추모하는 시설이 광복 뒤 언제, 어디에 마련되었는지도 알 수 있습니다.",
   "유관순을 기리는 표지비는 이태원묘지 무연분묘 합장묘역과 관련이 있습니다. 유관순은 1920년 서대문형무소에서 순국한 뒤 이태원 공동묘지에 묻혔어요. 일제가 이태원 일대를 개발하며 묘지를 없앴을 때, 연고자를 찾지 못한 무덤들의 유골을 화장해 망우리로 옮겨 합장했습니다. 유관순의 무덤도 그 과정에서 자취를 잃었습니다. 지금의 표지비는 유관순의 유해를 따로 확인한 개인 묘소가 아니라, 사라진 무덤을 기리는 추모물입니다.",
   "이 표지비와 실제 묘소, 이장 뒤 남은 터를 차례로 살펴보면 묘역마다 사정이 다르다는 것을 알 수 있습니다. 망우리에서 평생의 마지막 자리를 얻은 사람도 있고, 오랜 시간이 지난 뒤 다른 곳으로 옮겨 모신 사람도 있어요. 중랑망우공간의 전시와 산길의 연보비는 그런 사연을 찾아 설명하고 있습니다. 오늘 고른 묘소에서는 인물의 활동 연보와 함께, 언제 이 산에 모셔졌는지도 한 번 읽어보세요."
  ]},
  {no:72, region:"ne", type:"건축물", name:"건국대학교박물관(구 서북학회회관)", addr:"능동로 120 건국대학교 교내", audio:"audio/72_건국대학교박물관구서북학회회관.mp3", script:[
   "건국대학교 일감호 가까이에 있는 붉은 벽돌 건물이 대학박물관입니다. 정면을 보시면 중앙의 돔과 아치형 창이 눈에 들어올 거예요. 이 건물의 옛 이름은 서북학회 회관입니다. 원래 종로 낙원동에 있던 건물을 해체한 뒤, 주요 자재를 보관했다가 이 캠퍼스에 옮겨 복원했습니다. 안에 들어가기 전 건물 전체의 모양부터 살펴보세요. 학교와 학회가 사용하던 근대건축물 자체가 이 박물관의 중요한 관람 대상입니다.",
   "서북학회는 1908년 서우학회와 한북흥학회가 합쳐져 만들어진 단체입니다. 박은식과 안창호 등 계몽운동에 참여한 인물들이 교육으로 나라의 힘을 기르려 했어요. 당시에는 학교를 세우는 것만큼 가르칠 교사를 확보하는 일도 급했습니다. 학회는 교육을 장려하고 강연을 열었으며, 회관을 사람들에게 새로운 지식과 소식을 전하는 장소로 사용했습니다.",
   "학회가 발간한 ‘서북학회월보’도 그런 활동의 한 부분입니다. 1908년 2월부터 1910년 1월까지 발행하며 교육과 산업, 민권과 사회관습의 개혁 같은 주제를 다루었어요. 학교의 일을 알리는 데서 더 나아가 어떤 사회를 만들어야 하는지 설명한 잡지였습니다. 일본이 사립학교와 학회를 통제하자 그에 대응할 방법도 찾았습니다. 그러나 국권을 빼앗긴 1910년 학회는 강제로 해산되었습니다.",
   "학회가 사라진 뒤에도 건물은 학교로 쓰였습니다. 오성학교와 보성전문학교, 협성실업학교 등이 이곳을 거쳐 갔어요. 1941년에는 건국대학교 설립자인 상허 유석창이 인수했습니다. 광복 이듬해인 1946년, 이 건물에서 조선정치학관이 문을 열었죠. 오늘의 건국대학교로 이어지는 학교입니다. 서북학회가 교육으로 나라의 힘을 기르려 했던 회관에, 광복 후 새 사회를 이끌 사람들을 가르치는 학교가 들어선 것입니다.",
   "이 건물이 낙원동을 떠난 것은 서울의 도시계획 때문이었습니다. 1977년 해체가 결정되자 주요 자재를 대학 캠퍼스로 옮겨 보관했고, 1985년 다시 세웠습니다. 그때 기준으로 삼은 것은 해체 직전의 모습이에요. 붉은 벽돌 외벽과 창, 지붕을 살펴보실 때에는 옛 회관을 보존하기 위해 해체와 보관, 복원을 거쳤다는 사연도 떠올려보세요. 도심에서 없어진 건물이 학교 안에서 박물관으로 새 용도를 얻었습니다.",
   "박물관의 대표 소장품에는 국보 ‘동국정운’이 있습니다. 세종 때 우리나라 한자음을 바로잡아 정리한 책이에요. 또 하나는 보물 ‘이이 남매 화회문기’입니다. 율곡 이이의 형제자매가 아버지 사후에 유산을 나누고 합의한 내용을 기록한 문서죠. 유명한 학자가 남긴 철학책과는 성격이 다릅니다. 한 집안이 집과 토지, 노비 등의 재산을 어떻게 나눴는지 구체적으로 적었습니다.",
   "1566년에 작성한 이 문서에는 시집간 자매를 포함한 일곱 남매의 몫이 나옵니다. 조상 제사와 묘소 관리에 필요한 재산을 배정하고 자녀들이 받을 몫을 정했어요. 끝에는 분배 내용에 동의한다는 이름과 수결도 남겼습니다. 문서를 볼 기회가 있다면 본문의 긴 재산 목록과 마지막의 서명 부분을 비교해보세요. 대학의 설립사를 알리는 자료와 이런 옛 문서를 보존하는 일이, 한때 교실이었던 건물 안에서 계속되고 있습니다."
  ]},

  {no:73, region:"sw", type:"묘역", name:"국립현충원 독립유공자 묘역", addr:"동작동 222-17", audio:"audio/73_국립현충원독립유공자묘역.mp3", script:[
   "국립서울현충원의 독립유공자 묘역에서는 묘비에 적힌 이름부터 천천히 읽어보겠습니다. 의병을 이끈 사람, 임시정부에서 일한 사람, 해외에 일본의 만행을 알린 사람의 이름이 있습니다. 이곳은 1955년 국군묘지로 출발했고, 1965년 국립묘지가 되면서 안장 대상이 넓어졌습니다. 독립운동가를 모시는 묘역과 제단도 여러 시기에 마련되었어요.",
   "임시정부요인 묘역은 1993년 중국 상하이에 모셔져 있던 다섯 분의 유해를 봉환하면서 조성했습니다. 계단식으로 만든 묘역 위쪽에는 박은식, 이상룡, 홍진, 양기탁이, 아래쪽에는 노백린과 신규식, 지청천 등이 모셔져 있습니다. 모두 같은 때 돌아온 분들은 아니지만, 독립운동 시기 임시정부를 유지하고 이끌었던 분들입니다. 묘역의 높낮이를 따라가며 안내문에 적힌 직책도 살펴보세요.",
   "박은식은 임시정부 제2대 대통령을 지냈고, 우리 근대사의 기록을 남긴 역사가이기도 합니다. 1925년 상하이에서 세상을 떠났으니 고국으로 돌아오기까지 68년이 걸렸어요. 1945년 광복이 곧 모든 독립운동가의 귀환을 뜻하지는 않았습니다. 해외에 묻힌 유해를 찾고 모셔오는 일은 그 뒤에도 계속되었습니다. 이 묘역이 만들어진 1993년이라는 연도는 그런 봉환의 역사를 알려줍니다.",
   "독립유공자 묘역의 강우규 의사는 1919년 새 조선총독 사이토 마코토를 향해 폭탄을 던진 인물입니다. 당시 서울의 남대문역 앞에서 일어난 일이에요. 연해주에서 국내로 들어온 강우규는 총독의 동정을 살피며 거사를 준비했습니다. 사이토를 죽이려던 목표는 이루지 못했고, 체포된 뒤 1920년 서대문형무소에서 사형당했습니다. 3·1운동 이후에도 저항을 계속하려던 노년의 독립운동가였습니다.",
   "이곳에는 캐나다인 프랭크 윌리엄 스코필드의 묘소도 있습니다. 한국 이름은 석호필입니다. 세브란스의학전문학교에서 가르치던 그는 1919년 제암리 학살 소식을 듣고 직접 현장으로 갔어요. 기차와 자전거를 이용해 찾아가 사진을 찍고 주민들의 피해를 조사했습니다. 이 기록과 보고서를 해외에 전해 일본군이 저지른 일을 알렸죠. 독립운동을 지원한 방식이 서로 달랐다는 사실을 두 사람의 묘소에서 구체적으로 알 수 있습니다.",
   "무후선열제단에는 묘소가 없거나 후손이 끊어진 선열들의 위패를 모셨습니다. 유관순 열사의 위패도 여기에 있어요. 유관순은 서대문형무소에서 순국한 뒤 이태원 공동묘지에 안장되었지만, 일제강점기 묘지 이장 과정에서 유해의 행방을 잃었습니다. 후손이 제사를 이어가기 어려운 분들과 유해를 찾지 못한 분들을 국가가 제단에서 추모하는 것입니다. 봉분을 보다가 위패를 모신 제단을 만나면, 그 차이를 눈여겨봐 주세요.",
   "묘역의 추모시설 가운데 충열대에는 용을 새긴 화강석과 청동 향로가 있습니다. 독립유공자와 임시정부 요인, 무후선열을 두루 추모하는 제단이에요. 임시정부요인 묘역 위쪽에는 2002년 세운 대한독립군 무명용사 위령탑도 있습니다. 국내와 만주, 연해주 등에서 싸우다 이름을 남기지 못한 독립군을 기립니다. 묘비에 이름을 새겨 모신 분들 곁에서, 이름조차 충분히 밝혀지지 않은 사람들도 추모하고 있습니다.",
   "현충원을 둘러싼 논의에는 안장의 기준도 포함되어 왔습니다. 독립유공자를 기리는 국립묘지에 친일반민족행위 경력이 있는 인물을 계속 모시는 것이 옳은지, 광복 이후 공적을 어떻게 평가할지에 대한 논쟁입니다. 시민단체의 문제 제기와 국회의 법 개정 논의가 이어져 왔어요. 국가가 어떤 생애를 기릴 것인가는 묘역을 만든 뒤에도 계속 검토되어 온 문제입니다.",
   "참배 뒤에는 유품전시관의 ‘독립의 장’에서 의병과 독립운동가들이 남긴 유품을 살펴볼 수 있습니다. 특별전시실에서는 현충원의 묘역 이야기와 유해 발굴 활동도 소개합니다. 야외에서 읽었던 인물의 이름을 전시물의 설명에서 다시 찾아보세요. 묘비는 그 사람의 이름과 생애를 전하고, 유품은 그가 실제로 사용하고 남긴 물건을 통해 활동을 더 자세히 알려줍니다."
  ]},
  {no:74, region:"sw", type:"터/표지석", name:"영등포 대한독립 만세운동 시위터", addr:"양평동2길 10", audio:"audio/74_영등포대한독립만세운동시위터.mp3", script:[
   "영등포역 앞 광장에는 대한독립 만세운동 시위터를 알리는 표지석이 바닥에 놓여 있습니다. 건물처럼 멀리서 눈에 들어오는 시설은 아니어서, 광장의 바닥을 찬찬히 살펴보셔야 해요. 표지에 적힌 날짜는 1919년 3월 23일입니다. 이날 영등포리와 당산리, 양평리, 양화리에서 주민들이 독립만세를 불렀습니다. 지금도 익숙한 동네 이름들이 당시에는 각각의 마을 이름이었죠.",
   "그 무렵 영등포는 서울이 아닌 경기도 시흥군에 속해 있었습니다. 1899년 경인선이 개통되면서 역이 들어섰고, 이어 경부선 건설의 거점이 되었습니다. 철도 창고와 공장, 철도에서 일하는 사람들의 주거지가 생겼어요. 이들을 상대로 장사하는 상점과 여관도 늘면서 역 주변에 시가지가 만들어졌습니다. 만세운동이 벌어진 영등포는 이렇게 철도를 중심으로 주민과 노동자가 모여 살던 지역이었습니다.",
   "3월 23일 양평리 시위에서는 약 300명이 독립을 외쳤습니다. 이때 기록에 남은 인물이 탄원기입니다. 기독교 신자이자 노동자였던 그는 밤 9시 무렵 양평리에서 만세시위를 일으켰어요. 밝은 대낮에 광장을 가득 메운 장면만이 3·1운동의 모습은 아닙니다. 영등포에서는 밤이 된 뒤 주민들이 모여 만세를 외친 일이 재판기록으로 남았습니다.",
   "탄원기는 시위 뒤 체포되어 1919년 5월 경성지방법원에서 징역 6개월을 선고받았습니다. 항소했지만 6월 경성복심법원에서 기각되었어요. 적용된 죄명은 보안법 위반이었습니다. 독립을 요구하는 시위에 참여했다는 이유로 처벌받은 것입니다. 정부는 그의 공적을 인정해 2012년 대통령표창을 추서했습니다. 만세운동이 벌어진 해와 공적을 기린 해 사이에는 93년이 있습니다.",
   "영등포구가 역 광장에 표지석을 마련한 것은 2020년입니다. 2022년에는 양평동 롯데양평빌딩 앞 공개공지에도 또 하나를 세웠어요. 양평동의 돌에는 날짜와 함께 옛 지명 ‘영등포면 양평리’, 그리고 300여 명이 만세운동을 벌였다는 내용이 새겨져 있습니다. 역 광장은 바닥 표지, 양평동은 건물 앞에 세운 비석이어서 두 기념물의 모습도 다릅니다. 지역 곳곳에서 일어난 시위를 두 지점에서 나누어 알리고 있는 거예요.",
   "두 곳을 이어 방문하신다면 현재 지도에 남은 당산과 양평이라는 이름도 살펴보세요. 1919년의 마을은 큰 시가지가 되었고 당시의 건물과 길 모습은 많이 달라졌습니다. 표지석은 오늘의 거리에 옛 마을 이름과 시위 날짜를 남겨두었습니다. 여기에서 기억할 구체적인 장면은 노동자 탄원기와 주민들이 모여 독립만세를 외쳤던 3월 23일 밤입니다. 그날의 행동은 체포와 재판으로 이어졌지만, 기록은 남아 후대에 이 작은 표지를 세우는 근거가 되었습니다."
  ]},
  {no:75, region:"sw", type:"공원/기념물", name:"2·8독립선언 기념공원", addr:"가양동 422-13", audio:"audio/75_이팔독립선언기념공원.mp3", script:[
   "2·8공원은 강서구 출신 독립운동가 김도연을 기리는 곳입니다. 중앙의 흉상과 그가 남긴 글씨를 새긴 유묵비부터 살펴보세요. 공원 이름의 ‘2·8’은 1919년 2월 8일을 뜻합니다. 일본 도쿄에서 한국인 유학생들이 독립을 선언한 날이에요. 당시 결의문을 낭독했던 김도연의 고향이 지금의 강서구 염창동이어서, 이곳에 그를 기리는 공원을 마련했습니다.",
   "유학생들이 행동을 준비한 계기는 국제정세의 변화였습니다. 제1차 세계대전이 끝나고 민족자결주의가 알려지면서, 우리 민족의 장래도 스스로 결정해야 한다는 주장이 힘을 얻었어요. 일본에서 발행되는 신문에 해외 한인들의 독립 청원과 파리강화회의에 관한 소식이 실렸습니다. 학생들은 그 소식을 읽고 토론했으며, 1919년 1월에는 웅변대회를 열어 독립운동을 추진하기로 했습니다.",
   "이들은 조선청년독립단을 조직하고 선언서와 청원서를 준비했습니다. 선언식을 열기 전에는 그 문서들을 각국 외교공관과 일본 정부, 일본 국회 등에 보냈어요. 2월 8일 도쿄 조선기독교청년회관에 모인 자리에서는 백관수가 독립선언서를, 김도연이 결의문을 읽었습니다. 일본의 수도에서 일본의 식민 지배를 공개적으로 거부한 것입니다. 일본 경찰은 모임을 강제로 해산했고 김도연도 체포되어 옥고를 치렀습니다.",
   "선언을 준비하던 학생들은 국내와 중국에도 사람을 보내 소식을 전했습니다. 2·8독립선언은 이런 연락을 통해 국내에서 진행되던 독립운동 준비에 영향을 주었어요. 그 뒤 3월 1일 서울에서 독립선언과 만세시위가 시작되었고, 운동은 전국으로 확산했습니다. 서로 떨어진 도시의 청년들이 편지와 인편, 인쇄물을 통해 뜻을 주고받았던 것입니다. 공원에서 보는 날짜에는 그런 준비 과정도 담겨 있습니다.",
   "김도연은 이후에도 우리말을 지키는 활동과 인연을 맺었습니다. 일제 말기 조선어학회 사건으로 다시 옥고를 치렀고, 광복 뒤에는 대한민국 초대 재무부장관을 지냈어요. 유묵비에 새긴 글씨는 ‘사귀정직’입니다. 일을 대할 때 정직함을 가장 귀하게 여긴다는 뜻이에요. 이 글귀는 그가 재무행정을 맡았던 시기 남긴 휘호입니다. 흉상 곁 비석의 약력을 읽으면 도쿄의 학생에서 새 나라의 재정을 맡은 인물로 이어진 생애를 볼 수 있습니다.",
   "공원에는 다른 두 비석도 있습니다. ‘일문오열’비는 병자호란 때 강화도에서 싸우다 순국한 후포마을 황씨 집안 다섯 사람을 기립니다. ‘권농일기념비’는 이 일대가 농촌이던 시절의 행사와 관련이 있어요. 1965년 이곳에서 제17회 권농일 행사를 열었습니다. 농번기에 농사를 돕고 농업을 장려하던 행사였죠. 비석의 이름과 연도를 비교해보면 각각이 기리는 인물과 사건이 다르다는 것을 알 수 있습니다.",
   "지금 주변에는 마곡의 큰 건물과 서울식물원이 있지만, 얼마 전까지 이 일대에는 농경지가 넓게 펼쳐져 있었습니다. 김도연을 기리는 흉상, 병자호란의 희생자를 기리는 비, 농사와 관련된 기념비가 한 작은 공원에 모인 이유도 이 동네의 오랜 생활과 관계가 있어요. 세 종류의 기념물을 둘러보신 뒤에는 공원 이름을 다시 읽어보세요. 도쿄에서 결의문을 읽었던 한 청년의 활동을 그의 고향 주민들이 날짜로 기억하고 있습니다."
  ]},
  {no:76, region:"sw", type:"장소/전시관", name:"궁산땅굴역사전시관", addr:"양천로49길 106", audio:"audio/76_궁산땅굴역사전시관.mp3", script:[
   "궁산땅굴역사전시관에서는 입구 쪽에서 산 안으로 뚫린 굴을 볼 수 있습니다. 낙석 위험 때문에 굴 안으로 들어가지는 않고, 앞에서 내부를 바라보는 방식이에요. 이 굴은 일제강점기인 1940년대에 파기 시작했다가 일본의 패전으로 공사가 중단된 군사시설입니다. 가까운 양천향교나 겸재정선미술관을 찾았다가, 이 산에 이런 전쟁 유적이 있다는 사실을 처음 아는 분도 많습니다.",
   "굴을 만든 목적으로는 무기와 탄약 같은 군수물자 보관, 김포비행장 감시, 공습 때 부대 본부로 사용할 계획 등이 전해집니다. 태평양전쟁 말기 일본은 한반도의 여러 지역에 지하 군사시설을 만들었습니다. 공중에서 공격받을 때 사람과 물자를 보호하려는 것이었죠. 궁산도 그런 전쟁 준비에 이용되었습니다. 산에 굴을 내는 일부터 주변 주민의 생활에 직접 영향을 주었습니다.",
   "굴착에 동원된 사람들은 인근 주민들이었습니다. ‘보국대’라는 이름으로 끌려와 공사를 해야 했어요. 나라에 보답한다는 뜻의 이름을 붙였지만, 식민지 조선의 주민들에게 요구한 것은 일본의 전쟁을 위한 노동이었습니다. 군수물자를 둘 장소를 확보하려는 계획이 실제로 진행되려면, 누군가는 산속의 돌과 흙을 파내야 했던 것입니다.",
   "안내된 땅굴의 규모는 길이 약 68미터, 높이 2.7미터, 폭 2.2미터입니다. 굴은 안쪽에서 꺾이는 ‘ㄱ’자 형태로 알려져 있어요. 입구에서 보이는 공간과 전시의 구조 안내를 비교해보세요. 입구만 보고 느끼는 크기보다 안으로 이어진 길이가 깁니다. 사람 한 명이 잠시 숨을 구멍을 만드는 정도가 아니라, 물자를 보관하고 군사적으로 활용할 공간을 계획했던 것이죠.",
   "광복 뒤에도 굴의 존재를 알고 있던 주민들이 있었고, 여러 용도로 쓰인 시기가 있었습니다. 2008년 주민들의 제보를 계기로 조사와 전시관 조성이 추진됐어요. 처음에는 안으로 들어가 체험할 공간을 만들려 했지만 공사 중 낙석이 발생했습니다. 그래서 굴 내부의 출입을 막고, 입구에서 안을 볼 수 있도록 관람 방식을 바꾸었습니다. 지금의 역사전시관은 2018년에 문을 열었습니다.",
   "전시관에서는 땅굴뿐 아니라 궁산과 일제강점기, 태평양전쟁, 김포비행장에 관한 설명도 살펴볼 수 있습니다. 굴의 크기를 본 뒤 주변 지역의 설명을 읽어보시면, 김포비행장 같은 시설과 가까운 산이 왜 군사적으로 이용되었는지 이해하기 좋습니다. 2022년에는 궁산땅굴이 서울미래유산으로 선정됐습니다. 완공하지 못한 군사시설이라도 주민 강제동원과 식민지 말기의 전쟁 준비를 전할 자료로 남길 가치가 있다고 평가한 것입니다.",
   "궁산 위쪽에는 양천고성지와 소악루가 있고, 산 아래에는 양천향교와 겸재정선미술관이 있습니다. 정선은 양천현령으로 일하며 이 일대의 한강 풍경을 그림으로 남겼어요. 전시관을 나와 산책을 이어가신다면 소악루에서 한강과 주변 지형을 살펴보셔도 좋겠습니다. 땅굴에서 본 군사시설의 설명을 떠올리며 같은 산과 강을 바라보면, 이곳이 경치를 감상하는 장소이자 전쟁에 이용된 장소였다는 것을 구체적으로 알 수 있습니다."
  ]},

  {no:77, region:"se", type:"전시관", name:"매헌 윤봉길 의사 기념관", addr:"매헌로 26", audio:"audio/77_매헌윤봉길의사기념관.mp3", script:[
   "매헌윤봉길의사기념관에 들어서면 중앙홀의 동상과 커다란 기록화를 보게 됩니다. 기록화에는 두 시기의 윤봉길이 등장해요. 고향에서 농민들을 가르치던 때와 상하이에서 의거를 감행하던 때입니다. 이 기념관은 국민 성금을 모아 1988년 문을 열었습니다. 서울올림픽을 앞두고 조성된 시민의숲 안에 자리 잡았고, 지금은 공원 이름도 그의 호를 딴 매헌시민의숲입니다.",
   "전시에서 먼저 눈여겨볼 자료는 『농민독본』입니다. 윤봉길이 농민들을 가르치려고 직접 쓴 책이에요. 글을 모르는 사람에게 읽고 쓰는 법을 가르치는 데서 출발해, 농민이 왜 배워야 하는지, 힘을 모으면 생활을 어떻게 바꿀 수 있는지를 설명했습니다. 겉치레를 줄이고 검소하게 살며, 자신의 노동과 배움을 소중하게 여기자는 내용도 담았습니다. 책을 쓴 사람은 아직 스무 살 안팎의 청년이었습니다.",
   "충남 예산에서 윤봉길은 야학을 운영하고 독서회를 만들었습니다. 농민들이 물건을 공동으로 구입하도록 구매조합도 조직했어요. 부흥원과 월진회를 통한 농촌계몽운동에는 수업과 강연, 공동생활을 개선하려는 활동이 포함되어 있었습니다. 전시 자료 가운데 한시와 일기도 살펴보세요. 농촌의 문제를 고민하면서 꾸준히 읽고 글을 썼던 그의 생활을 알 수 있는 자료입니다.",
   "1930년 고향을 떠난 윤봉길은 중국을 거쳐 상하이에 도착했습니다. 그곳에서는 모자를 만드는 회사에서 일했고, 채소를 팔기도 했어요. 생계를 이어가며 독립운동에 참여할 길을 찾던 중 김구를 만났고, 한인애국단에 들어갔습니다. 고향의 야학과 상하이의 일터를 거친 뒤, 1932년 봄 일본군이 여는 기념행사를 공격하는 임무를 맡게 되었습니다.",
   "4월 29일 훙커우공원에서는 일왕의 생일과 상하이사변의 승리를 기념하는 행사가 열렸습니다. 행사에 오는 사람에게는 도시락과 물통을 지참하라는 안내가 나왔어요. 기념관에서 소개하는 수통형 폭탄 재현품은 그 상황과 연결됩니다. 윤봉길이 이날 단상을 향해 던진 것은 물통 모양의 수통형 폭탄이었습니다.",
   "의거 당일 아침의 일을 전하는 유품으로는 회중시계가 있습니다. 윤봉길은 김구와 아침을 먹은 뒤, 자신이 새로 산 시계를 김구의 낡은 시계와 바꾸었습니다. 준비 과정에서 쓰고 남은 돈도 돌려주었어요. 두 사람이 헤어지기 직전에 주고받은 물건과 행동이 이렇게 기록으로 남았습니다. 시계에 관한 설명에서는 누구의 시계를 누가 간직하게 되었는지 천천히 따라가 보세요.",
   "윤봉길의 공격으로 일본군 고위 지휘관들이 사망하거나 크게 다쳤습니다. 이 의거는 중국 측이 한국의 독립운동을 지원하는 중요한 계기가 되었어요. 윤봉길은 현장에서 체포되었고 일본 군법회의에서 사형을 선고받았습니다. 상하이에서 일본으로 옮겨진 뒤, 그해 12월 19일 가나자와에서 총살형으로 순국했습니다. 의거를 감행한 봄에서 여덟 달도 지나지 않은 때였습니다.",
   "기념관의 책과 일기, 시계는 윤봉길의 서로 다른 시기를 전합니다. 『농민독본』을 만들던 때에는 고향 사람들을 가르쳤고, 상하이에 와서는 일을 하며 의거를 준비했습니다. 전시를 둘러보실 때 의거 장면을 담은 사진에 앞서 그가 쓴 글도 시간을 들여 살펴보시면 좋겠습니다. 1932년 4월 29일 이전에 그가 무엇을 배우고 누구를 가르쳤는지, 청년 윤봉길의 생애를 구체적으로 만날 수 있습니다."
  ]},
  {no:78, region:"se", type:"전시관", name:"심산 김창숙 기념관", addr:"사평대로 55", audio:"audio/78_심산김창숙기념관.mp3", script:[
   "반포의 심산기념문화센터 안에는 독립운동가 김창숙을 기리는 전시실이 있습니다. 사진과 서신, 유품을 따라가며 그의 생애를 살펴볼 수 있어요. 문화센터 일부가 먼저 문을 연 뒤 전시를 갖추었고, 기념관 개관식은 2011년 3월에 열렸습니다. 이름 앞에 붙은 ‘심산’은 김창숙의 호입니다. 유학자로 출발해 독립운동에 참여하고, 광복 뒤에는 대학 설립과 반독재운동에 힘쓴 인물이죠.",
   "김창숙은 경북 성주에서 유학을 배웠습니다. 나라가 위기에 처하자 학교를 세워 새 학문을 가르치는 일에 나섰어요. 고향에 성명학교를 설립할 때에는 보수적인 유림들의 반대도 받았습니다. 자신이 배워온 학문을 지키면서도, 청년들이 앞으로 살아갈 세상에 필요한 교육을 마련하려 했던 것입니다. 이 교육 활동은 훗날 성균관대학을 세우는 일로 이어집니다.",

   "중국에서는 임시의정원 의원으로 활동하면서 독립운동 기지를 만들 계획을 추진했습니다. 이회영과 의논해 만주와 몽골 접경의 땅에 한인들을 모으고, 농사를 지으며 청년들을 훈련하려 했어요. 생활의 기반을 갖추고 독립군을 양성하겠다는 구상이었습니다. 김창숙은 개간과 운영에 쓸 돈을 마련하기 위해 국내에 몰래 들어와 유림과 재력가들을 찾아다녔습니다. 그러나 모금은 뜻대로 이루어지지 않았고 일제의 수사로 참여자들이 붙잡혔습니다.",
   "김창숙도 1927년 상하이에서 체포되어 국내로 압송되었습니다. 징역 14년을 선고받았고, 가혹한 고문과 옥고로 두 다리를 쓰지 못하게 되었어요. 이후에는 ‘벽옹’이라는 별호를 사용했습니다. 앉아서 지내는 늙은이라는 뜻으로, 자신의 몸에 남은 상처를 이름으로 삼은 것입니다. 기념관의 글에서 심산과 벽옹이라는 이름을 만나면 모두 김창숙을 가리킨다고 생각하시면 됩니다.",

   "정부가 수립된 뒤에도 김창숙은 권력에 대한 비판을 멈추지 않았습니다. 1952년 부산정치파동 때에는 이시영, 조병옥 등과 함께 이승만 정권의 독재를 비판하고 헌법을 지킬 것을 요구했어요. 이들은 정치폭력에까지 시달렸습니다. 식민지 시기의 청원서와 광복 뒤의 선언문을 읽으면, 그가 누구에게 어떤 행동을 요구했는지가 분명하게 드러납니다.",
   "전시의 사진을 볼 때에는 촬영 시기와 인물 설명도 살펴보세요. 중국에서 독립운동가들과 교류하던 시기, 대학을 이끌던 시기, 독재에 항의하던 시기의 활동을 차례로 짚을 수 있습니다. 생애를 직접 돌아본 글로는 『벽옹칠십삼년회상기』도 남겼습니다. 김창숙은 1962년 세상을 떠났고, 묘소는 강북구 수유동에 있습니다. 반포의 이 기념관은 그가 남긴 글과 자료를 모아 그 긴 활동을 전하고 있습니다."

  const v = document.getElementById('code').value.trim();
  if (v === ACCESS_CODE){ gate.style.display='none'; }
  else { document.getElementById('gateErr').textContent = '코드가 맞지 않습니다. 지도에 적힌 코드를 다시 확인해주세요.'; }
});

/* ── 상태 ─────────────────────────────────────────────── */
let region = 'all';
let query = '';
let current = null;           // 지금 재생 중인 place
const audio = document.getElementById('audio');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if(!isFinite(s)) return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const ICON_PLAY  = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

/* ── 권역 칩 ───────────────────────────────────────────── */
const regionsEl = document.getElementById('regions');
function renderChips(){
  const all = `<button class="chip" data-r="all" aria-pressed="${region==='all'}">전체</button>`;
  const rest = Object.entries(REGIONS).map(([k,r])=>
    `<button class="chip" data-r="${k}" aria-pressed="${region===k}"><span class="dot" style="background:${r.color}"></span>${r.label}</button>`).join('');
  regionsEl.innerHTML = all+rest;
}
regionsEl.addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  region = b.dataset.r; renderChips(); renderList();
});
document.getElementById('q').addEventListener('input', e=>{ query = e.target.value.trim(); renderList(); });

/* ── 목록 ─────────────────────────────────────────────── */
const listEl = document.getElementById('list');
function visible(){
  return PLACES.filter(p=>{
    if(region!=='all' && p.region!==region) return false;
    if(!query) return true;
    return String(p.no)===query || p.name.includes(query) || (p.addr||'').includes(query);
  });
}
function renderList(){
  const items = visible();
  document.getElementById('count').textContent = items.length + '곳';
  listEl.innerHTML = items.map(p=>{
    const c = REGIONS[p.region].color;
    const badge = p.audio ? `<span class="has-audio">오디오</span>` : `<span class="no-audio">준비 중</span>`;
    const playing = current && current.no===p.no;
    const scriptHtml = p.script && p.script.length
      ? p.script.map(t=>`<p>${esc(t)}</p>`).join('')
      : `<div class="empty">이 장소의 해설 원고는 준비 중입니다.</div>`;
    const qname = encodeURIComponent('서울 '+p.name);
    return `
    <article class="card${playing?' open':''}" id="card-${p.no}">
      <button class="card-head" data-no="${p.no}" aria-expanded="${playing}">
        <div class="num" style="background:${c}">${p.no}</div>
        <div class="card-title">
          <div class="name">${esc(p.name)}</div>
          <div class="meta"><b>${esc(p.type)}</b>${esc(p.addr||'')}</div>
        </div>
        ${badge}
      </button>
      <div class="card-body">
        ${p.audio ? `
        <div class="player" data-no="${p.no}">
          <div class="player-row">
            <button class="btn-skip" data-act="back" aria-label="15초 뒤로">-15</button>
            <button class="btn-play" data-act="toggle" aria-label="재생">${playing && !audio.paused ? ICON_PAUSE : ICON_PLAY}</button>
            <button class="btn-skip" data-act="fwd" aria-label="15초 앞으로">+15</button>
            <button class="btn-skip btn-speed" data-act="speed" aria-label="재생 속도">1x</button>
            <div class="prog">
              <input type="range" min="0" max="1000" value="0" data-act="seek" aria-label="재생 위치">
              <div class="times"><span class="cur">0:00</span><span class="dur">0:00</span></div>
            </div>
          </div>
        </div>` : ''}
        <div class="script">
          <div class="lbl">해설 원고</div>
          ${scriptHtml}
        </div>
        <div class="links">
          <a class="primary" href="https://map.kakao.com/link/search/${qname}" target="_blank" rel="noopener">카카오맵에서 열기</a>
          <a href="https://map.naver.com/p/search/${qname}" target="_blank" rel="noopener">네이버지도에서 열기</a>
        </div>
      </div>
    </article>`;
  }).join('');
  syncPlayerUI();
  if(typeof applySpeed==='function') applySpeed();
}

/* 카드 펼치기 */
listEl.addEventListener('click', e=>{
  const head = e.target.closest('.card-head');
  if(head){
    const card = head.parentElement;
    const open = card.classList.toggle('open');
    head.setAttribute('aria-expanded', open);
    return;
  }
  const act = e.target.closest('[data-act]'); if(!act) return;
  const no = Number(act.closest('.player').dataset.no);
  const p = PLACES.find(x=>x.no===no);
  if(act.dataset.act==='toggle') toggle(p);
  if(act.dataset.act==='back'){ if(current&&current.no===no) audio.currentTime=Math.max(0,audio.currentTime-15); }
  if(act.dataset.act==='fwd'){ if(current&&current.no===no) audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15); }
  if(act.dataset.act==='speed') cycleSpeed();
});
listEl.addEventListener('input', e=>{
  const r = e.target.closest('[data-act="seek"]'); if(!r) return;
  const no = Number(r.closest('.player').dataset.no);
  if(current && current.no===no && audio.duration) audio.currentTime = r.value/1000*audio.duration;
});

/* ── 재생 속도 ─────────────────────────────────────────── */
const SPEEDS=[1,1.2,1.5,2,0.8];
let speedIdx=0;
function cycleSpeed(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  applySpeed();
}
function applySpeed(){
  const sp=SPEEDS[speedIdx];
  audio.playbackRate=sp;
  const label=(sp+'x').replace('.0','');
  document.querySelectorAll('.btn-speed').forEach(b=>{ b.textContent=label; b.classList.toggle('on', sp!==1); });
}

/* ── 재생 ─────────────────────────────────────────────── */
function toggle(p){
  if(current && current.no===p.no){
    audio.paused ? audio.play() : audio.pause();
    return;
  }
  current = p;
  audio.src = p.audio;
  audio.playbackRate = SPEEDS[speedIdx];
  audio.play().catch(()=>{});
  document.getElementById('barNum').textContent = p.no;
  document.getElementById('barNum').style.background = REGIONS[p.region].color;
  document.getElementById('barName').textContent = p.name;
  document.getElementById('bar').classList.add('show');
  syncPlayerUI();
}
function syncPlayerUI(){
  document.querySelectorAll('.player').forEach(pl=>{
    const mine = current && Number(pl.dataset.no)===current.no;
    const btn = pl.querySelector('.btn-play');
    btn.innerHTML = (mine && !audio.paused) ? ICON_PAUSE : ICON_PLAY;
    btn.setAttribute('aria-label', (mine && !audio.paused) ? '일시정지' : '재생');
    if(!mine){ pl.querySelector('[data-act="seek"]').value=0; pl.querySelector('.cur').textContent='0:00'; pl.querySelector('.dur').textContent='0:00'; }
  });
  document.getElementById('barBtn').innerHTML = audio.paused ? ICON_PLAY : ICON_PAUSE;
}
audio.addEventListener('play', syncPlayerUI);
audio.addEventListener('pause', syncPlayerUI);
audio.addEventListener('ended', syncPlayerUI);
audio.addEventListener('timeupdate', ()=>{
  if(!current) return;
  const pl = document.querySelector(`.player[data-no="${current.no}"]`);
  const pct = audio.duration ? audio.currentTime/audio.duration : 0;
  if(pl){
    pl.querySelector('[data-act="seek"]').value = Math.round(pct*1000);
    pl.querySelector('.cur').textContent = fmt(audio.currentTime);
    pl.querySelector('.dur').textContent = fmt(audio.duration);
  }
  document.getElementById('barTime').textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  document.getElementById('barline').style.width = (pct*100)+'%';
});
document.getElementById('barBtn').addEventListener('click', ()=>{ if(current) toggle(current); });
document.getElementById('bar').addEventListener('click', e=>{
  if(e.target.closest('button') || !current) return;
  const card = document.getElementById('card-'+current.no);
  if(card){ card.classList.add('open'); card.scrollIntoView({behavior:'smooth',block:'start'}); }
});

audio.addEventListener('loadedmetadata', ()=>{ audio.playbackRate = SPEEDS[speedIdx]; });
renderChips();
renderList();
applySpeed();
</script>
</body>
</html>
