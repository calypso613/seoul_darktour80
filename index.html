<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다크투어 서울 80 · 오디오 도슨트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── 색상: 종이 지도와 같은 톤 ───────────────────────────── */
  :root{
    --kraft:#C9A56F;      /* 지도 바탕 크라프트지 */
    --kraft-deep:#A8834F;
    --paper:#F8F1E2;      /* 카드 종이색 */
    --ink:#3B2314;        /* 지도 제목 갈색 */
    --ink-soft:#6B4E36;
    --line:#E3D2B3;
    --r-center:#D94A62;   /* 도심권 */
    --r-nw:#7E5FB0;       /* 서북권 */
    --r-ne:#EA8A2B;       /* 동북권 */
    --r-sw:#2E6FB8;       /* 서남권 */
    --r-se:#2F8C58;       /* 동남권 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--kraft);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .serif{font-family:"Noto Serif KR","Nanum Myeongjo",serif}

  /* ── 입장 화면 ─────────────────────────────────────────── */
  #gate{
    position:fixed;inset:0;z-index:50;
    background:var(--kraft);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;max-width:380px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:34px 26px 28px;
    box-shadow:0 12px 30px rgba(59,35,20,.25);
    text-align:center;
  }
  .stamp{
    display:inline-block;
    font-size:12px;letter-spacing:.18em;font-weight:700;
    color:var(--paper);background:var(--ink);
    padding:5px 12px;border-radius:999px;
    margin-bottom:18px;
  }
  .gate-card h1{
    font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.01em;
  }
  .gate-card h1 small{display:block;font-size:14px;font-weight:600;letter-spacing:.2em;margin-bottom:8px;color:var(--ink-soft)}
  .taegeuk{width:52px;height:52px;margin:16px auto 8px;display:block}
  .gate-card p{font-size:14px;color:var(--ink-soft);margin:10px 0 22px}
  .code-row{display:flex;gap:8px}
  .code-row input{
    flex:1;min-width:0;
    font:inherit;font-size:18px;letter-spacing:.12em;text-align:center;
    padding:13px 12px;border-radius:10px;
    border:1.5px solid var(--kraft-deep);background:#fff;color:var(--ink);
  }
  .code-row input:focus{outline:3px solid rgba(217,74,98,.35);border-color:var(--r-center)}
  .code-row button{
    padding:0 18px;border-radius:10px;
    background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;
  }
  .gate-err{font-size:13px;color:var(--r-center);min-height:20px;margin-top:10px;font-weight:500}

  /* ── 상단 ─────────────────────────────────────────────── */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--kraft);
    padding:14px 16px 10px;
    border-bottom:2px solid var(--ink);
  }
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .brand h2 span{font-size:12px;letter-spacing:.16em;font-weight:600;color:var(--ink-soft);margin-right:8px}
  .brand .who{font-size:11px;color:var(--ink-soft);letter-spacing:.08em;white-space:nowrap}
  .search{
    margin-top:10px;display:flex;align-items:center;gap:8px;
    background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:9px 12px;
  }
  .search svg{flex:none;opacity:.7}
  .search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink)}
  .search input:focus{outline:none}
  .search input::placeholder{color:#9B8368}
  .regions{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .regions::-webkit-scrollbar{display:none}
  .chip{
    flex:none;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:999px;
    background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

  /* ── 목록 ─────────────────────────────────────────────── */
  main{padding:12px 12px 120px}
  .count{font-size:12px;color:var(--ink-soft);margin:2px 4px 8px;letter-spacing:.04em}
  .card{
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .card-head{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:12px 12px 12px 12px;text-align:left;
  }
  .num{
    flex:none;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
    border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);
  }
  .card-title{flex:1;min-width:0}
  .card-title .name{font-size:16px;font-weight:700;line-height:1.3}
  .card-title .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-title .meta b{font-weight:600;color:var(--ink);margin-right:6px}
  .has-audio{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--paper);letter-spacing:.04em}
  .no-audio{flex:none;font-size:11px;color:#9B8368;letter-spacing:.04em}
  .card-body{display:none;border-top:1.5px dashed var(--line);padding:14px 14px 16px}
  .card.open .card-body{display:block}

  /* 플레이어 */
  .player{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px}
  .player-row{display:flex;align-items:center;gap:12px}
  .btn-play{
    flex:none;width:52px;height:52px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .btn-play:active{transform:scale(.96)}
  .btn-skip{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-soft)}
  .prog{flex:1;min-width:0}
  .prog input[type=range]{width:100%;accent-color:var(--ink);height:24px}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .speed{margin-left:auto;font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink-soft)}
  .btn-speed.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .script{margin-top:14px}
  .script .lbl{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
  .script p{font-size:15px;line-height:1.75;margin-bottom:10px;word-break:keep-all}
  .script p:last-child{margin-bottom:0}
  .script .empty{font-size:13px;color:#9B8368;background:#fff;border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center}

  .links{display:flex;gap:8px;margin-top:14px}
  .links a{
    flex:1;text-align:center;text-decoration:none;
    font-size:13px;font-weight:700;padding:10px 8px;border-radius:8px;
    border:1.5px solid var(--ink);color:var(--ink);background:#fff;
  }
  .links a.primary{background:var(--ink);color:var(--paper)}

  /* ── 하단 재생바 ───────────────────────────────────────── */
  #bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--ink);color:var(--paper);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:none;align-items:center;gap:12px;
    box-shadow:0 -6px 20px rgba(59,35,20,.35);
  }
  #bar.show{display:flex}
  #bar .num{box-shadow:0 0 0 1.5px var(--paper);width:32px;height:32px;font-size:13px}
  #bar .t{flex:1;min-width:0}
  #bar .t .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .t .s{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
  #bar button{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center}
  #bar .barline{position:absolute;left:0;top:0;height:2px;background:var(--r-center);width:0}

  footer{padding:24px 16px 0;text-align:center;font-size:11px;color:var(--ink-soft);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const PLACES = [
  {no:1, region:"center", type:"건축물", name:"경복궁 건청궁", addr:"사직로 161 경복궁 내",
   audio:"audio/01_경복궁건청궁.mp3",
   script:[
   "경복궁 안쪽 깊숙한 곳, 건청궁입니다. 1873년 고종이 자신의 사재를 들여 지은 별궁이에요. 왜 왕이 궁궐 안에 또 다른 궁을 지었을까요? 당시 고종은 아버지 대원군의 그늘에서 벗어나 친정체제를 시작하려던 참이었습니다. 건청궁은 그저 전각이 아니라, 이제 내가 직접 나라를 이끌겠다는 정치적 독립 선언을 상징하는 건물이었던 거죠.",
   "건물 배치를 보면 흥미로운 점이 있습니다. 왕의 공간인 '장안당'과 왕비의 침전인 '곤녕합'이 이어져 있어요. 좀 더 인간적이고 일상적인 공간을 만들고 싶었던 거겠죠. 그리고 1887년, 장안당 북쪽에 우리나라 최초로 전등이 켜집니다. 궁궐에 전기가 들어온 첫 순간이었어요. 고종은 이곳에서 근대화를 꿈꿨습니다.",
   "하지만 건청궁은 희망의 공간에서 비극의 현장으로 바뀌고 맙니다. 1895년 10월 8일 새벽, 곤녕합 남쪽 옥호루에서 명성황후가 일본 자객들에게 시해당하는 을미사변이 일어났거든요. 한 나라의 국모가 궁궐 안에서 살해당한 겁니다. 이 충격적인 사건 이후 고종은 신변의 위협을 느끼고 러시아 공사관으로 피신했고요. 이것이 바로 아관파천입니다. 그리고 일본은 1909년, 이 건물들을 아예 철거해버렸습니다. 비극의 기억까지 지우려 했던 거죠.",
   "사라졌던 건청궁은 2007년에야 원래 자리에 복원되었습니다. 100년 만에 돌아온 셈이에요. 지금 우리가 보는 건물들은 복원된 것이지만, 이곳이 품고 있는 이야기는 여전히 생생합니다. 고종과 명성황후가 근대화를 꿈꾸며 머물던 공간이자, 조선 왕실의 자존이 무너진 현장. 건청궁은 희망과 비극, 자주와 침탈의 기억을 동시에 간직한 장소입니다."
  ]},
  {no:2, region:"center", type:"터/표지석", name:"조선어학회 회관 터", addr:"화동 129-1", audio:"audio/02_조선어학회회관터.mp3", script:[
   "북촌 화동 골목의 조선어학회 터입니다. 지금은 표석으로 옛자리를 찾아야 하지만, 이곳에는 우리말 사전을 만들던 작은 이층집이 있었어요. 정세권이 터를 마련하고 건물을 지어 내놓은 뒤, 조선어학회가 1935년 여름 입주했습니다. 한옥을 짓던 사업가와 우리말을 연구하던 학자들이 이 집에서 뜻을 모은 거죠.",
   "집 안의 쓰임도 특별했습니다. 아래층은 사전 편찬을 이끌던 이극로의 살림집이었고, 위층은 학회 사무실이자 편찬실이었어요. 일하는 곳과 사는 곳이 한 건물에 들어 있었던 겁니다. 정세권은 집만 제공한 게 아니라 표준어를 정하는 회의 비용까지 댔습니다. 사전 한 권 뒤에는 학자뿐 아니라 일을 계속할 여건을 만들어준 사람도 있었던 셈이에요.",
   "사전을 만들려면 먼저 같은 말을 어떻게 적을지, 어떤 낱말을 표준으로 삼을지 정해야 합니다. 학회는 이곳으로 옮기기 전인 1933년에 맞춤법 통일안을 발표했고, 입주 뒤에는 표준말을 정리해 1936년 세상에 내놓았죠. 우리가 글을 쓰면서 당연하게 여기는 약속들을, 나라를 빼앗긴 시기에 차근차근 마련하고 있었던 겁니다.",
   "그 작업은 1942년 조선어학회 사건으로 중단됩니다. 일제 경찰은 사전 편찬을 민족의식을 키우는 독립운동으로 보아 학자와 후원자들을 검거했어요. 홍원경찰서와 함흥형무소에 갇힌 이들은 가혹한 고문을 당했고, 이윤재와 한징은 끝내 감옥에서 세상을 떠났습니다. 회관을 내준 정세권도 탄압을 피하지 못했습니다.",
   "사람들만 사라진 것이 아니었습니다. 오랫동안 모은 사전 원고도 압수돼 행방을 알 수 없게 되었죠. 그런데 광복 뒤 서울역 창고에서 그 원고가 발견됩니다. 이를 바탕으로 1947년 첫 권이 나왔고, 전쟁을 거친 끝에 1957년 여섯 권의 『큰사전』이 완성됐습니다. 여기서 멈춰버린 일이 다른 사람들의 손을 거쳐 다시 이어진 거예요.",
   "옛 회관은 남아 있지 않지만, 그 안에서 다듬던 말들은 여전히 우리 일상에 있습니다. 표석을 읽고 나면 사전이라는 물건도 조금 달리 보이지 않나요? 낱말과 뜻풀이 사이에, 한 언어를 다음 세대에 건네기 위해 들인 시간과 잃어버린 삶이 함께 담겨 있습니다."
  ]},
  {no:3, region:"center", type:"터/건축물(복원)", name:"중앙고보 숙직실 터(삼일기념관)", addr:"창덕궁길 164 중앙고등학교 내", audio:"audio/03_중앙고보숙직실터.mp3", script:[
   "계동 언덕의 중앙고등학교 안에는 큰 교사와는 다른 작은 기념관이 있습니다. 밤에 학교를 지키는 사람이 머물던 숙직실을 되살린 삼일기념관이에요. 3·1운동을 준비한 장소라고 하면 웅장한 회의실을 떠올리기 쉽지만, 이곳에서 중요한 것은 방의 크기보다 그 안으로 들어온 소식이었습니다.",
   "1919년 1월, 일본에서 공부하던 송계백이 중앙학교를 찾아왔습니다. 도쿄 유학생들이 독립선언을 준비하고 있다는 소식과 함께, 뒤에 2·8독립선언서로 발표될 글의 초안을 가져왔죠. 이 소식을 받은 사람은 교사 현상윤과 교장 송진우였습니다. 아직 도쿄의 선언식이 열리기 전이었어요. 유학생들의 계획이 먼저 바다를 건너 국내에 전해진 겁니다.",
   "당시 해외에서는 제1차 세계대전이 끝난 뒤 새로운 국제질서를 논의하고 있었습니다. 식민지 조선의 사람들도 독립을 요구할 기회를 찾고 있었죠. 그렇다고 밖에서 좋은 소식이 오기만 기다릴 수는 없었습니다. 뜻을 같이할 사람을 만나고, 서로 다른 움직임을 연결하는 일이 필요했어요. 송계백의 방문은 그런 연락이 실제로 이루어진 한 장면입니다.",
   "이 방의 역할은 첫 만남으로 끝나지 않았습니다. 2월 초에는 최린, 최남선, 송진우, 현상윤 등이 이곳에 모여 독립운동의 실행을 의논했어요. 종교계와 교육계, 학생들의 준비가 여러 장소에서 이어지던 때였습니다. 중앙학교 숙직실도 그 연결망의 한 지점이었죠. 3·1운동은 어느 한 사람이 한 번의 회의로 만들어낸 사건이 아니었습니다.",
   "지금 보는 기념관은 당시 숙직실을 원형에 맞춰 복원한 건물입니다. 옛터를 알리는 기념비와 복원된 공간이 당시의 만남을 전해줍니다. 복원 건물이라고 해서 그 안에서 전하는 만남의 의미가 작아지는 것은 아닙니다. 우리가 잃어버린 공간을 어떤 모습으로 기억하려 했는지도 보여주니까요.",
   "학교는 보통 다음 세대에게 지식을 전하는 곳이지요. 그런데 이곳에서는 학생이 선생님에게 바깥세상의 움직임을 전했고, 그 소식이 새로운 행동을 의논하는 계기가 되었습니다. 작은 숙직실 앞에서 떠올릴 장면은 바로 그 순간입니다. 국경을 건너온 종이 몇 장이 사람과 사람을 만나면서, 교실 밖 역사를 움직이기 시작한 순간 말이에요."
  ]},
  {no:4, region:"center", type:"건축물", name:"창덕궁 흥복헌", addr:"율곡로 99 창덕궁 내", audio:"audio/04_창덕궁흥복헌.mp3", script:[
   "창덕궁 대조전 동쪽에 붙어 있는 흥복헌입니다. 왕과 왕비가 생활하던 궁궐 안쪽에 자리한 공간이에요. 정전처럼 큰 마당을 거느린 곳은 아니지만, 이곳을 지나칠 때는 1910년 8월 22일을 떠올려야 합니다. 대한제국의 마지막 어전회의가 여기서 열렸기 때문이죠.",
   "어전회의는 황제 앞에서 나라의 중요한 일을 논의하는 자리입니다. 그날 회의에서는 일본의 강제병합 문제가 다루어졌습니다. 궁궐에서 회의가 열린 그날, 남산의 통감관저에서는 이완용과 일본 통감 데라우치가 조약에 서명했습니다. 병합 사실이 공표된 것은 일주일 뒤인 8월 29일이었습니다. 우리가 경술국치로 기억하는 날입니다.",
   "주권이 사라지는 과정은 그날 갑자기 시작된 것이 아니었습니다. 1905년 을사늑약으로 외교권을 빼앗겼고, 고종의 강제퇴위와 군대해산을 거치며 일본의 지배는 깊어졌습니다. 마지막 황제 순종이 머무는 궁궐도 그 압력에서 벗어나지 못했죠. 흥복헌은 한 번의 회의만으로 나라를 잃었다는 이야기보다, 여러 해에 걸친 침탈이 어디까지 이르렀는지를 보여주는 곳입니다.",
   "여기서 한 가지 더 살펴볼 점이 있습니다. 지금의 흥복헌은 1910년 당시 건물이 그대로 남은 것이 아닙니다. 1917년 창덕궁 내전에서 큰불이 나 대조전과 흥복헌 등이 소실됐거든요. 이후 경복궁의 여러 전각을 헐어 옮기는 방식으로 재건이 이루어졌고, 1920년 대조전 일대가 다시 세워졌습니다. 한 궁궐의 빈자리를 채우는 동안 다른 궁궐에는 새로운 빈자리가 생긴 셈이죠.",
   "대조전 일대에는 황실의 마지막 시간도 겹쳐 있습니다. 순종은 1926년 대조전 흥복헌에서 세상을 떠났습니다. 나라를 잃은 뒤에도 궁궐에서 이어지던 황제의 삶이 이곳에서 끝난 것이죠. 그의 장례일에는 학생들이 거리에서 독립만세를 외쳤고, 그것이 6월 10일, 6·10 만세운동으로 이어졌습니다.",
   "흥복헌 앞에서는 건물의 이름과 날짜를 따로 외우기보다 여러 장면들을 떠올려보세요. 강제병합을 논의한 회의, 불타 사라진 전각, 다른 궁궐에서 옮겨온 건축 부재로 본 보습을 잃은 전각. 오늘 눈에 보이는 단정한 궁궐 풍경 안에는, 나라의 주권과 왕실의 생활이 함께 무너져가던 시간이 남아 있습니다. 아름다운 우리 궁궐의 모습만큼이나, 아픈 우리 역사가 일어난 현장임을 꼭 기억해야 하겠습니다."
  ]},
  {no:5, region:"center", type:"터/표지석", name:"송학선 의사 의거 터", addr:"와룡동 3-2 창덕궁 금호문 앞", audio:"audio/05_송학선의사의거터.mp3", script:[
   "창덕궁 서남쪽 담장을 따라가면 금호문을 만납니다. 궁궐의 정문인 돈화문보다 작아 그냥 지나치기 쉬운 문이죠. 하지만 1926년 봄에는 순종의 빈소를 찾는 사람들이 이 일대를 오갔습니다. 그 행렬 속에서 조선총독을 기다리던 청년이 있었습니다. 바로 송학선입니다.",
   "송학선은 큰 조직의 지령을 받고 온 인물이 아니었어요. 어려운 형편 때문에 학교를 그만두고, 일본인이 운영하던 농기구 회사에서 일하며 생계를 꾸렸습니다. 안중근의 의거를 알고 그를 존경했으며, 사이토 마코토 총독을 공격할 계획을 세웠죠. 그리고 순종이 세상을 떠나자 총독이 조문하러 창덕궁에 올 것이라고 생각했습니다.",
   "1926년 4월 28일, 송학선은 금호문을 나오는 자동차의 탑승자를 총독으로 오인하고 공격했습니다. 그러나 차에 타고 있던 사람들은 총독이 아니었습니다. 일본 인민회 이사 사토와 국수회 부회장 다카야마 등이었어요. 사건으로 사망자와 부상자가 발생했고, 송학선은 현장을 벗어나던 중 추격하는 경찰과 맞선 끝에 붙잡혔습니다. 총독을 겨냥한 행동은 그렇게 전혀 다른 결과를 남겼습니다.",
   "이 사건의 소식은 곧바로 자유롭게 보도되지 못했습니다. 신문 호외는 검열에 걸려 배포가 중지됐죠. 순종의 죽음으로 많은 사람이 모인 때라 식민 당국은 상황을 예민하게 주시하고 있었습니다. 얼마 뒤 순종의 장례일에는 학생들이 독립만세를 외칩니다. 송학선의 사건과 6·10 만세운동은 방식은 달랐지만, 같은 봄의 긴장 속에서 일어났어요.",
   "같은 해 7월, 결국 송학선에게 사형이 선고되었습니다. 송학선은 처음에는 항소할 뜻이 없었지만, 가족의 설득으로 재판을 이어갔습니다. 항소와 상고로도 판결은 바뀌지 않았고, 1927년 5월 19일 서대문형무소에서 형이 집행됐죠. 그를 살리려던 가족의 노력까지 함께 기억해야, 아까운 한 청년의 삶이 사라지지 않을 거예요.",
   "금호문 앞 표석에 남은 이름은 유명한 독립운동가의 이름만큼 익숙하지 않을 수 있습니다. 그래서 이곳에서는 성공과 실패만으로 이야기를 닫지 않았으면 해요. 식민지에서 살아가던 한 청년이 왜 이런 행동에 이르렀는지, 그 과정에서 어떤 생명이 희생됐는지 함께 생각해보는 겁니다. 궁궐 담장 밖의 작은 표석 하나가, 나라를 잃어버렸던 시대의 어두웠던 현실을 전하고 있습니다."
  ]},
  {no:6, region:"center", type:"건축물", name:"옛 경성제국대학 본관", addr:"동숭길 3 한국문화예술위원회", audio:"audio/06_옛경성제국대학본관.mp3", script:[
   "마로니에공원 옆 예술가의집입니다. 건물에 붙은 이름과 국가유산 안내판의 이름이 조금 다르죠. 안내판에는 ‘구 서울대학교 본관’이라고 되어 있어요. 1931년 경성제국대학 본관으로 지어졌고, 광복 뒤에는 서울대학교가 사용했습니다. 이 건물을 중심으로 바라보면, 지금 극장과 미술관이 들어선 대학로가 원래 어떤 동네였는지 짐작할 수 있습니다.",
   "먼저 외벽을 가까이서 보세요. 갈색 벽돌처럼 보이는 표면은 황갈색 타일로 마감한 것입니다. 자세히 보면 타일에 가느다란 줄무늬가 있어요. 이런 마감재를 스크래치 타일이라고 부릅니다. 건물의 뼈대는 철근콘크리트이고, 가로로 두른 띠와 난간에는 화강석을 썼습니다. 색과 재료를 달리해서 층의 경계를 드러낸 것이죠. 둥근 아치와 일정한 간격으로 놓인 창도 살펴보세요.",
   "현관의 위치에도 사연이 있습니다. 정면을 보면 입구가 건물의 한가운데서 비켜나 있어요. 당시 배치도를 살펴보면, 대학은 넓은 광장 주변에 학부 건물과 도서관, 대학본부를 두려 했습니다. 그런데 대강당을 새로 지을 자리를 확보하면서 본부의 위치가 옮겨졌고, 현관은 광장의 중심선에 맞춰 남았습니다. 정작 그 대강당은 지어지지 않았어요. 조금 어긋나 보이는 입구에, 실현되지 못한 캠퍼스 계획이 남은 겁니다.",
   "경성제국대학은 1924년 예과 학생을 뽑고, 1926년 법문학부와 의학부를 열었습니다. 이름의 ‘제국’은 일본의 제국대학 제도에 속했다는 뜻입니다. 비슷한 시기 조선인들은 돈을 모아 직접 대학을 세우려는 민립대학운동을 벌이고 있었어요. 더 높은 교육을 받고 싶다는 요구가 컸지만, 대학을 설립하고 운영할 권한은 식민 통치 아래 놓여 있었습니다. 조선인들이 원했던 대학은 자신들이 모은 돈으로, 자신들의 뜻에 따라 운영하는 학교였습니다.",
   "본관에서는 주로 대학 행정을 처리했습니다. 옛 도면에는 회계실과 학생을 관리하는 사무실, 총장실과 회의실이 표시되어 있어요. 강의실에서 수업하던 학생들 뒤로, 예산을 집행하고 학교의 운영 방침을 결정하던 사람들이 이 건물을 썼던 것이죠. 지금 내부는 새로운 용도에 맞게 고쳤지만, 도면에는 부서별 방 이름과 계단의 위치까지 자세하게 적혀 있습니다.",
   "광복 뒤에는 국립 서울대학교의 본부가 들어왔습니다. 서울대학교가 관악으로 옮겨가면서 동숭동 캠퍼스의 많은 건물이 사라졌지만, 이 본관은 남았어요. 이후 한국문화예술진흥원과 한국문화예술위원회의 사무공간으로 쓰였습니다. 학교가 떠난 자리에는 마로니에공원이 조성되고 공연장과 미술관이 들어섰습니다. ‘대학로’라는 거리 이름이 옛 학교를 떠올리게 하는 까닭입니다.",
   "2010년에는 건물을 고쳐 예술가의집으로 다시 문을 열었습니다. 예술가들이 모임과 강연을 열고 창작 활동을 나누는 곳으로 사용하고 있어요. 내부를 둘러보려면 공개된 공간과 행사 공간을 구별해 주세요. 밖에서는 외벽의 타일, 아치, 한쪽으로 치우친 현관을 차례로 보시면 좋겠습니다. 오래된 대학 사진을 가지고 왔다면, 사진 속 본관을 찾은 뒤 주변에서 없어진 건물들을 비교해 보세요. 지금 공원이 된 자리가 훨씬 구체적으로 보일 겁니다."
  ]},
  {no:7, region:"center", type:"건축물", name:"천도교 중앙대교당", addr:"삼일대로 457", audio:"audio/07_천도교중앙대교당.mp3", script:[
   "붉은 벽돌 벽에 밝은 돌로 테두리를 두른 건물이 천도교 중앙대교당입니다. 1921년에 완공됐어요. 지금도 천도교에서 종교의식을 치르는 교당이라, 안으로 들어갈 수 있는지는 현장 안내를 확인해야 합니다. 밖에서 보실 때는 가운데 출입구와 그 위로 높이 올라간 부분, 양옆으로 이어지는 벽면을 차례로 살펴보세요. 많은 사람을 한곳에 모으기 위해 세운 건물입니다.",
   "천도교는 동학에서 이어진 종교입니다. 동학의 세 번째 지도자였던 손병희는 전국 교인들의 힘을 모아 큰 교당을 지으려 했어요. 교인들이 보탠 건축 성금의 일부는 1919년 3·1운동을 준비하는 데 쓰였습니다. 각 지역의 교인들이 모은 돈을 서울로 보내고, 교단 지도부가 그 돈으로 운동을 뒷받침했습니다. 교당을 세울 자금과 전국적인 연락 조직을 갖추고 있었기에 가능한 일이었죠.",
   "1919년 3월 1일, 손병희를 비롯한 천도교 인사들은 민족대표로 독립선언에 참여했습니다. 천도교가 운영하던 인쇄소 보성사는 독립선언서 약 2만 장을 찍어냈어요. 선언서를 마련하는 것만으로는 운동을 시작할 수 없었습니다. 인쇄한 종이를 나누어 맡고, 사람을 통해 여러 지역으로 보내야 했죠. 전국에 퍼져 있던 종교 조직이 이런 연락과 배포에 중요한 역할을 했습니다. 보성사는 지금 우리가 보는 대교당 건물과는 다른 장소였습니다.",
   "3·1운동이 일어난 1919년에는 지금의 대교당이 아직 완성되지 않았습니다. 손병희를 비롯한 지도자들이 체포되면서 교당을 세우는 일도 어려워졌어요. 건물은 그 뒤 1921년에 완공됐습니다. 독립을 위한 활동은 계속됐고, 대교당에서는 민족운동 단체의 집회와 강연을 열었습니다. 종교 모임을 위해 마련한 큰 홀이 교단 바깥의 사람들에게도 필요한 장소가 된 것이죠.",
   "실내가 공개된 날이라면 넓은 집회실의 가운데를 살펴보세요. 시야를 가리는 기둥 없이 큰 공간을 마련했습니다. 앞에서 이야기하는 사람이나 공연하는 모습을 여러 사람이 볼 수 있도록 한 구조예요. 양옆에는 사무실을 두었습니다. 이곳에서는 종교의식 외에도 강연회와 예술공연, 각종 모임을 열었습니다. 많은 사람이 들어갈 수 있는 홀이 귀하던 시절, 교당은 여러 단체가 사람을 만나고 생각을 나누는 장소이기도 했습니다.",
   "방정환의 어린이운동도 이곳과 깊은 관련이 있습니다. 방정환과 김기전 등은 1921년 천도교소년회를 만들고, 어린이의 인격과 사회적 대우를 바꾸자는 운동을 펼쳤습니다. 이듬해에는 5월 1일을 어린이날로 정해 행사를 열었어요. 처음부터 지금처럼 5월 5일이었던 것은 아닙니다. 동화를 들려주고 노래와 연극을 함께 즐기는 활동은, 어린이에게도 그 나이에 맞는 문화와 생활이 필요하다는 생각을 알리는 방법이었습니다.",
   "1923년에는 다른 소년단체들과 연합해 조선소년운동협회를 조직하고, 본부를 천도교당 안에 두었습니다. 그해 어린이날에 어른들에게 전한 당부가 꽤 구체적이에요. 어린이에게 부드러운 존댓말을 쓰고, 가까이에서 자주 이야기를 나누고, 충분히 자고 운동하게 해달라는 내용이었습니다. 아이에게 어떤 말을 건네고 하루를 어떻게 보내게 할 것인지부터 바꾸자는 요구였죠.",
   "어린이날 행사 뒤에는 교당에 모여 음악과 연극, 무도 공연을 즐겼다는 기록도 남아 있습니다. 조금 전 살펴본 기둥 없는 넓은 홀이 그럴 때 쓰였던 거예요. 마당의 어린이운동 기념물과 교당을 번갈아 보세요. 기념비에 적힌 어린이운동은 아이들을 모아 가르치는 일뿐 아니라, 어른들이 아이를 대하는 말과 태도를 고치는 일이기도 했습니다."
  ]},
  {no:8, region:"center", type:"터/표지석", name:"이종일 집 터(독립선언서 배포지)", addr:"삼일대로 461", audio:"audio/08_이종일집터.mp3", script:[
   "천도교 중앙대교당 앞에서 ‘독립선언문 배부 터’ 표석을 찾아보세요. 이곳은 1919년 이종일이 살던 집이 있던 자리입니다. 집은 사라졌지만, 표석의 ‘배부’라는 말이 이곳에서 했던 일을 알려줍니다. 보성사에서 찍어낸 독립선언서를 여기로 옮겨 보관하고, 가져갈 사람들에게 나누어 주었어요. 인쇄소에서 선언서를 만들었다면, 이 집에서는 그것을 전국으로 보낼 준비를 한 것입니다.",
   "이종일은 보성사 사장이자 민족대표 33인 가운데 한 사람이었습니다. 선언서를 맡기 전부터 글을 널리 전하는 일을 해왔어요. 1898년에는 순한글 신문인 제국신문을 창간했습니다. 한문을 모르는 사람도 신문을 읽을 수 있도록 한 것이죠. 특히 한글을 읽는 여성과 일반 독자들에게 세상 소식을 전하는 데 힘을 쏟았습니다. 경영이 어려워도 신문을 만들었고, 다른 신문과 잡지의 발행에도 참여했습니다.",
   "3·1운동을 준비할 때 이종일은 독립선언서 인쇄를 맡았습니다. 최남선이 작성한 글은 인쇄 작업을 거쳐 수만 장의 종이가 되었어요. 그런데 종이를 많이 찍어놓는 것만으로는 사람들에게 전달할 수 없겠죠. 보성사에서 나온 선언서를 그의 집으로 가져오고, 지역과 단체별로 나누어 보낼 연락망을 마련해야 했습니다. 천도교와 기독교의 조직, 학생들의 연락망이 그 일을 나누어 맡았습니다.",
   "배포에는 가족도 참여했습니다. 손녀 이장옥의 회고에 따르면, 할아버지의 지시를 받고 선언서를 내주는 일을 했다고 해요. 찾아온 사람이 증표를 보여야 선언서를 건넸다는 대목이 나옵니다. 누구에게나 문을 열어 종이 묶음을 내줄 수는 없었던 것이죠. 공개적으로 독립을 선언할 날은 정해져 있었지만, 그날까지 준비하는 사람들과 인쇄물을 지키려면 이런 확인 절차가 필요했습니다.",
   "이종일은 3월 1일 태화관에서 열린 독립선언식에 참석했다가 체포됐습니다. 1920년에는 보안법과 출판법 위반으로 징역 3년을 선고받고 서대문형무소에 갇혔어요. 신문을 만들며 쌓은 경험을 독립선언에 보탰다가, 인쇄하고 알린 행위 때문에 처벌받은 것입니다. 그의 집에서 이미 다른 사람들의 손으로 넘어간 선언서는 서울과 여러 지역의 시위 현장에서 읽혔습니다.",
   "감옥을 나온 뒤에도 다시 독립선언운동을 준비했습니다. 보성사 직원들과 3·1운동을 기념하는 선언식을 열고자 새 선언문을 마련했지만, 일본 경찰에 계획이 알려져 인쇄물을 압수당했어요. 독립운동의 역사를 적는 한국독립비사의 집필도 이어갔습니다. 말년에는 생계가 몹시 어려웠고, 1925년 영양실조 끝에 세상을 떠났습니다. 해방을 맞기 스무 해 전이었습니다.",
   "지금 이 자리에서 볼 수 있는 것은 집터를 알리는 안내와 표석입니다. 가까운 수송공원에는 이종일의 동상이 있고, 충남 태안에는 그의 생가를 복원한 곳이 있어요. 각각 서울에서 살며 선언서를 배포한 자리, 그를 기리는 동상이 선 자리, 태어난 고향입니다. 이곳을 떠나 보성사 기념물을 보러 가신다면, 지도를 펴서 인쇄소와 집터 사이의 거리를 살펴보세요. 이종일과 동료들이 옮겼던 선언서가 서울 도심의 어느 길을 건너 사람들에게 전해졌는지 생각하며 걸을 수 있습니다."
  ]},
  {no:9, region:"center", type:"터/표지석", name:"보성사 터", addr:"우정국로 55 조계사 대웅전 앞마당", audio:"audio/09_보성사터.mp3", script:[
   "수송공원의 보성사 기념물 앞입니다. 이곳에서는 표석과 이종일 동상을 볼 수 있어요. 독립선언서를 찍었던 인쇄소 건물은 남아 있지 않습니다. 보훈부에 등록된 보성사 터의 위치는 가까운 조계사 극락전 앞이고, 우리가 보는 표석과 기념물은 수송공원에 마련됐습니다. 옛터와 지금의 기념물 위치를 지도에서 각각 짚어두면 주변을 답사하기 좋습니다.",
   "보성사는 학생들이 읽을 교재를 만드는 인쇄소로 출발했습니다. 이용익이 세운 보성학교에 딸린 시설이었고, 이후 천도교가 학교와 인쇄소의 운영을 맡았습니다. 3·1운동 무렵에는 이종일이 사장이었어요. 교과서와 종교계의 간행물을 만들 수 있는 시설, 활자를 다루고 인쇄기를 돌릴 줄 아는 직원들이 이곳에 있었습니다. 비밀리에 큰 규모의 인쇄 작업을 맡을 수 있었던 바탕입니다.",
   "1919년 2월 27일 밤, 보성사에서는 최남선이 기초한 독립선언서를 인쇄했습니다. 2만여 장으로 알려져 있어요. 글을 종이에 찍기 전에는 문장을 활자판으로 짜는 조판 작업을 해야 합니다. 선언서는 신문관에서 조판한 뒤 보성사에서 인쇄했습니다. 이종일과 총무 장효근, 공장 일을 맡은 김홍규 등 여러 사람이 작업을 나누었습니다. 선언서에 이름을 올린 대표들 외에도, 실제 인쇄를 담당한 직원들의 손이 필요했습니다.",
   "당시 찍어낸 선언서에는 작은 인쇄 실수도 남아 있습니다. 첫머리의 ‘조선’이라는 두 글자가 ‘선조’로 뒤바뀐 판본이 있어요. 글자 하나하나를 골라 활자판을 만들던 과정에서 생긴 오자입니다. 오늘 독립선언서의 원본 사진을 보신다면 첫 줄의 글자 순서를 살펴보세요. 우리가 기념식에서 듣는 문장과 실제 인쇄물 사이에 이런 차이가 있습니다. 서둘러 준비한 종이를 사람들이 그대로 받아 읽고 다른 곳으로 전달했던 것이죠.",
   "인쇄 도중 경찰이 들이닥쳐 작업이 발각될 뻔했다는 일화도 전합니다. 인쇄를 끝낸 뒤에는 종이 묶음을 안전하게 옮기는 일이 남아 있었어요. 선언서는 이종일의 집 같은 배포 거점으로 보내졌습니다. 그곳에서 종교계 인사와 학생들이 받아 각 지역으로 가져갔죠. 보성사의 작업과 배포, 탑골공원에서의 낭독과 행진은 서로 다른 장소에서 이루어졌지만, 하나로 이어져 거대한 삼일운동의 물결을 만들었습니다.",
   "보성사가 인쇄한 것은 독립선언서만이 아닙니다. 3월 1일에는 조선독립신문 첫 호도 찍었습니다. 독립을 선언한 소식과 운동의 움직임을 알리는 신문이었어요. 관계자들이 체포된 뒤에는 다른 사람들이 장소를 옮기고 등사 방식으로 신문 발행을 이어갔습니다. 등사는 원판에 글을 적고 잉크를 통과시켜 여러 장을 찍는 방식입니다. 대형 인쇄소를 쓰기 어려운 상황에서도 소식을 계속 전하려고 방법을 바꾼 것이죠.",
   "공원에서 이종일 동상과 보성사 표석을 차례로 살펴보세요. 한 사람의 얼굴과 인쇄소의 이름을 각각 기념하고 있습니다. 여기서 가까운 조계사 쪽으로 이동하면 옛 보성사 터가 등록된 구역을 살펴볼 수 있어요. 다만 지금은 법회와 기도가 이루어지는 사찰이니 공개된 구역에서 보시면 됩니다. 인쇄기는 없어졌지만, 그곳에서 찍은 선언서의 글자와 신문 지면은 자료로 남아 당시의 작업을 전해줍니다."
  ]},
  {no:10, region:"center", type:"건축물", name:"조선일보·조선중앙일보 옛 사옥", addr:"우정국로 38 NH농협은행 종로금융센터", audio:"audio/10_조선일보조선중앙일보옛사옥.mp3", script:[
   "우정국로의 이 건물은 두 신문사가 차례로 썼던 사옥입니다. 1926년 조선일보가 새 사옥을 지어 들어왔고, 1933년부터는 조선중앙일보가 사용했습니다. 지금은 농협 은행으로 쓰이고 있어요. 출입구 부근의 서울미래유산 표시와 건물 안내를 먼저 살펴보세요. 현재 간판 아래에 옛 신문사 사옥의 이력이 남아 있습니다. 은행 업무공간을 지나 들어가기보다는 거리에서 외관을 보며 이야기를 들어주세요.",
   "옛 사진에는 1925년 사옥 기공식에서 첫 삽을 뜨는 이상재의 모습이 나옵니다. 민족운동가 이상재는 당시 조선일보 사장이었어요. 신문사가 자기 건물을 마련한 것은 편집하고 인쇄하는 일터를 안정적으로 확보한다는 뜻이었습니다. 이후 이곳에서 신문을 만들던 사람들은 정치 소식을 전하는 일 외에도 민족운동과 교육 활동에 참여했습니다.",
   "1927년 결성된 신간회가 그중 하나입니다. 서로 생각이 달랐던 민족주의 계열과 사회주의 계열이 힘을 모은 단체였죠. 이상재가 초대 회장을 맡았고, 조선일보의 안재홍도 주요 간부로 활동했습니다. 조선일보는 신간회의 활동을 지면에 적극적으로 알렸습니다. 신문사에서 일하던 사람이 단체의 일을 맡고, 그 단체의 움직임이 다시 신문 기사로 나오는 관계였습니다.",
   "1929년에는 문자보급운동도 시작했습니다. 글을 배울 기회를 얻지 못한 사람들에게 한글을 가르치는 운동이었어요. 신문사는 교재를 만들어 배포했고, 학생들이 강습에 참여했습니다. 당시에는 학교 수가 부족해 취학할 나이가 되어도 공부하지 못하는 아이들이 많았습니다. 한글을 익히면 신문과 편지를 스스로 읽고 쓸 수 있죠. 읽을 사람을 늘리는 일까지 신문사가 나서서 했던 것입니다.",
   "1933년 조선일보가 연건동으로 옮기자 조선중앙일보가 들어왔습니다. 여운형이 사장을 맡아 신문 이름을 조선중앙일보로 바꾼 해였어요. 정치와 사회 기사뿐 아니라 체육과 문학도 지면을 채웠습니다. 한용운의 소설 후회가 연재된 신문이기도 해요. 날마다 독자들이 읽을 기사를 마련하던 이 신문사에 큰 사건이 닥친 것은 1936년 베를린 올림픽 때였습니다.",
   "마라톤에서 손기정이 우승하고 남승룡이 3위에 올랐습니다. 두 사람은 조선인이었지만 일본 대표로 출전해야 했어요. 조선중앙일보는 8월 13일 두 선수의 가슴에 붙은 일장기를 지운 사진을 실었습니다. 처음에는 사진이 흐릿해 검열에서 문제가 되지 않았습니다. 그런데 뒤이어 동아일보의 일장기 말소 사건이 알려지면서 조선중앙일보에도 경찰의 조사가 미쳤습니다.",
   "조선중앙일보는 그해 9월 휴간했고, 다시 신문을 내지 못한 채 이듬해 폐간됐습니다. 선수들의 얼굴과 기록을 전하던 사진에서 국기 한 부분을 지운 일이 신문사의 존립을 흔든 것이죠. 신문은 멈췄지만 건물은 남아 이후 여러 기관이 사용했고, 1970년부터는 농협이 쓰게 됐습니다. 거리에서 옛 사옥을 보신 뒤 당시 올림픽 기사를 찾아보셔도 좋겠습니다. 스포츠와 언론마저 식민 통치의 수단으로 쓰이던 시기, 각자의 방법으로 국가를 잃지 않으려 애썼던 이들의 마음이 느껴지는 건물입니다."
  ]},
  {no:11, region:"center", type:"터/표지석", name:"민영환 자결 터", addr:"인사동5길 41 하나빌딩", audio:"audio/11_민영환자결터.mp3", script:[
   "인사동5길 하나빌딩 앞에는 민영환을 기리는 조형물이 있습니다. 대나무를 본뜬 부분을 찾아보세요. 이곳은 1905년 11월 30일 민영환이 을사늑약에 항의하며 생을 마친 자리입니다. 당시에는 의관 이완식의 집이 있었어요. 가까운 조계사 부근에는 민영환이 살던 집터가 따로 있습니다. 지금 앞에 선 곳은 그가 마지막으로 머물렀던 장소를 기리는 곳입니다.",
   "민영환은 고종과 가까운 고위 관료였습니다. 왕실과 혼인 관계로 이어진 여흥 민씨 가문 출신으로, 군사와 외교 분야의 일을 맡았어요. 1896년에는 러시아 황제 니콜라이 2세의 대관식에 특사로 파견됐습니다. 일본을 거쳐 태평양을 건너고, 북미와 유럽을 지나 모스크바로 갔죠. 돌아올 때는 시베리아를 횡단했습니다. 거의 일곱 달이 걸린 여행이었고, 그 경험을 해천추범이라는 기록으로 남겼습니다.",
   "여행에서 돌아온 민영환은 군대를 정비하고 학교를 세우는 일에 힘썼습니다. 흥화학교를 설립해 교육에 참여했고, 독립협회의 활동도 후원했어요. 외국의 군대와 학교, 도시를 직접 보고 온 경험이 개혁 활동으로 이어진 것입니다. 그는 고종을 중심으로 나라를 바꾸려던 관료였고, 나라의 독립을 지키는 데 군사와 교육이 필요하다고 생각했습니다.",
   "1905년 11월, 일본은 대한제국의 외교권을 빼앗는 을사늑약을 강요했습니다. 외교권이 없어진다는 것은 다른 나라와 직접 교섭할 권한을 잃는다는 뜻입니다. 민영환은 조병세 등과 조약을 폐기하라고 요구했습니다. 조약에 찬성한 대신들의 처벌을 청하는 상소도 올렸죠. 그러나 요구는 받아들여지지 않았고, 항의하던 대신들은 뜻을 이루지 못했습니다.",
   "민영환은 동포들과 외국 공사들에게 전하는 글을 남긴 뒤 이완식의 집에서 세상을 떠났습니다. 그의 죽음은 당시 사회에 큰 충격을 주었어요. 동포들에게 보낸 유서에는 서로 힘을 합치고 학문에 힘써 자유와 독립을 회복해달라는 당부가 담겨 있습니다. 해외를 다니며 나라 사이의 힘의 차이를 보고, 학교를 세워 사람을 기르려 했던 그의 활동과도 이어지는 내용입니다.",
   "조형물의 대나무는 사후에 퍼진 ‘혈죽’ 이야기에서 가져왔습니다. 민영환의 유품을 보관한 방에서 대나무가 돋아났다는 이야기예요. 사람들은 이 대나무를 그의 뜻이 남은 증거처럼 받아들였습니다. 사진으로 찍고 신문에 소개했으며, 당시 역사 교과서에도 그림과 함께 실었습니다. 오늘 남아 있는 사진은 사람들이 이 이야기를 어떻게 기리고 전했는지 보여주는 자료입니다.",
   "현재의 조형물은 그 혈죽 이야기를 대나무 형태로 표현한 후대의 작품입니다. 옛집이 사라진 뒤 건물 앞에 마련한 추모 장소이지요. 조형물의 대나무 모양을 본 뒤 안내문에 적힌 날짜와 이름을 확인해 보세요. 인근의 민영환 집터까지 답사하신다면, 평소 살던 집과 마지막으로 머물렀던 이완식의 집을 따로 찾아가게 됩니다. 가까운 두 장소에 각각 표지가 있는 까닭입니다."
  ]},
  {no:12, region:"center", type:"터/표지석", name:"태화관 터(독립선언광장)", addr:"인사동5길 29 태화빌딩 앞", audio:"audio/12_태화관터.mp3", script:[
   "태화빌딩 앞의 3·1독립선언광장입니다. 여기서 1919년 3월 1일 민족대표들이 독립선언식을 열었습니다. 지금은 당시 건물은 남아 있지 않고, 기념비와 광장이 그 자리를 알려줍니다. 먼저 ‘태화관 터’라는 이름을 찾아보세요. 탑골공원에서 학생과 시민들이 만세를 외치던 날, 이곳의 요릿집에서는 대표자들의 모임이 열리고 있었습니다.",
   "태화관은 이름난 요릿집 명월관의 분점이었습니다. 여러 사람이 한방에 모여 식사하고 연회를 열 수 있는 곳이었죠. 그전에는 왕실과 고위 관료의 거처였고, 한때 이완용이 소유했던 집이기도 합니다. 강제병합에 앞장선 이완용의 옛집을 독립을 선언할 장소로 쓰게 된 것입니다. 선언식은 원래 탑골공원에서 열 계획이었습니다. 대표자들은 거사를 앞두고 모임 장소를 바꾸기로 했습니다.",
   "대표들은 많은 군중이 모이는 공원에서 선언식을 치르면 일본 경찰과 충돌해 사람들이 다칠 수 있다고 우려했습니다. 그래서 태화관으로 장소를 바꾸었어요. 선언서에 이름을 올린 사람은 33인이었고, 실제로 이곳에 참석한 사람은 29인이었습니다. 김병조와 길선주, 유여대, 정춘수는 참석하지 못했습니다. 천도교와 기독교, 불교의 대표들은 종교가 달라도 조선의 독립을 요구한다는 데 뜻을 모았습니다.",
   "태화관에서는 준비한 선언서를 바탕으로 독립 의지를 밝히고, 한용운의 연설에 이어 만세를 불렀습니다. 독립선언식을 열었다는 사실을 당국에도 알렸고, 출동한 경찰에 대표들이 연행됐어요. 한편 탑골공원에 모인 학생과 시민들은 오지 않는 대표자들을 기다리고 있었습니다. 같은 날 가까운 두 장소에서, 서로 다른 상황이 진행되고 있었던 것이죠.",
   "학생들 가운데는 대표들이 공원으로 와야 한다며 태화관을 찾아온 사람들도 있었습니다. 강기덕 등은 군중이 기다리는 곳에서 함께 행동하자고 요구했어요. 대표들과 학생들이 시위의 방법까지 모두 같은 생각을 했던 것은 아닙니다. 결국 탑골공원에서는 대표자 없이 독립선언서를 낭독했고, 사람들이 거리로 나섰습니다. 대표들은 체포됐지만 학생과 시민의 시위는 서울 시내 여러 방향으로 이어졌습니다.",
   "오늘의 광장은 3·1운동 100주년인 2019년에 조성했습니다. 바닥의 돌과 길게 이어진 수로를 살펴보세요. 백두산과 한라산을 표현한 우물과 수로를 만들고, 독립운동과 관련된 여러 지역에서 가져온 자연석을 놓았습니다. 이 시설들은 2019년 광장을 꾸미면서 마련했습니다. 기념비는 옛 장소를 가리키고, 광장은 그 앞에서 사람들이 잠시 머무를 자리를 만들어줍니다.",
   "태화관에서 독립선언식이 열린 지 두 해 뒤, 이곳에는 새로운 사람들이 찾아왔습니다. 1921년 태화여자관이 문을 열고 여성과 어린이를 위한 교육과 보건 사업을 시작했어요. 유치원을 운영하고, 여성들이 배우고 상담받을 수 있게 했습니다. 요릿집으로 쓰던 집이 사람들의 생활을 돌보는 사회사업 기관으로 바뀐 것입니다.",
   "독립선언식을 치렀던 방도 유치원 공간으로 사용했습니다. 대표자들이 앉았던 방에 아이들이 들어와 배운 것이죠. 태화여자관은 이후에도 여성 교육과 보건 활동을 이어갔습니다. 그래서 이곳의 역사를 1919년 하루만으로 끝낼 수는 없습니다. 이곳에 삼일운동 100주년 기념광장이 들어선 이유죠."
  ]},
  {no:13, region:"center", type:"건축물", name:"승동교회", addr:"인사동 137", audio:"audio/13_승동교회.mp3", script:[
   "인사동길에서 골목으로 들어오면 붉은 벽돌로 지은 승동교회가 나옵니다. 마당에는 3·1운동을 기념하는 표석이 있어요. 태화관에서는 민족대표들이 선언식을 열었고, 탑골공원에서는 군중이 만세를 외쳤다면, 이 교회에는 그 전날 학생 대표들이 모였습니다. 여러 학교의 학생들에게 시간과 장소를 알리고 독립선언서를 나눠줄 준비를 하던 곳입니다.",
   "1919년 2월, 김원벽과 강기덕 등 전문학교 학생 대표들은 이곳에서 독립운동을 의논했습니다. 학생들끼리 준비하던 움직임을 종교계가 추진하는 계획과 연결했어요. 어느 학교에서 누가 학생들을 모을지, 선언서는 누가 받아 어디서 배포할지 정해야 했습니다. 독립을 요구한다는 뜻이 같더라도 많은 사람이 같은 날 움직이려면 이런 연락과 분담이 필요했죠.",
   "거사 전날인 2월 28일 밤에도 학생들은 승동교회에 모였습니다. 학교별로 선언서를 나누고 다음 날의 행동을 확인했어요. 모임에 나오지 못한 학교에는 집까지 찾아가 시간과 장소를 전하고 선언서를 건넸다는 기록이 있습니다. 다음 날 탑골공원에 학생들이 모인 것은 이렇게 발로 뛰며 연락한 결과였습니다. 학생들은 3월 1일에 이어 3월 5일 시위에도 나섰고, 여러 주도자가 체포됐습니다.",
   "이 교회에는 3·1운동보다 앞선 또 한 사람의 이야기가 있습니다. 백정 출신의 박성춘입니다. 승동교회의 뿌리는 선교사 무어가 1893년 시작한 곤당골교회로 거슬러 올라가요. 박성춘은 병을 앓다가 무어가 데려온 의사 에비슨의 치료를 받았고, 이후 교회에 다니게 됐습니다. 그런데 일부 양반 교인들이 백정과는 한자리에서 예배할 수 없다고 반발했습니다.",
   "무어는 박성춘을 다른 곳으로 보내라는 요구를 거절했습니다. 그 일로 교인들이 따로 교회를 세워 나가기도 했어요. 나중에 두 공동체가 다시 합쳐지고, 1905년 지금의 인사동 자리로 옮겨왔습니다. 1911년에는 박성춘이 교회의 장로로 뽑혔습니다. 함께 예배하는 것조차 거부당했던 사람이 교회 일을 책임지는 직분을 맡게 된 것이죠.",
   "박성춘은 교회 안에서만 차별에 맞선 사람도 아니었습니다. 신분제가 폐지된 뒤에도 백정이 도포를 입고 갓을 쓰면 폭행을 당하는 일이 있었습니다. 그는 차별을 없애달라는 탄원서를 냈고, 1898년에는 관민공동회에서 시민 대표로 연설했습니다. 여러 장대가 힘을 합쳐 큰 차일을 받치듯 관료와 백성이 함께 나라를 지탱해야 한다는 내용이었어요. 태어난 신분 때문에 말할 자리를 얻기 어려웠던 사람이 종로의 공개 집회에서 자기 의견을 밝힌 것입니다.",
   "교회 건물을 볼 때는 붉은 벽돌과 창의 모양을 살펴보세요. 1910년대에 지은 예배당을 바탕으로 이후 증축과 수리를 거쳤습니다. 지금도 사람들이 예배하러 오는 교회이니, 내부는 허용된 때에만 들어갈 수 있어요. 외부의 3·1운동 표석은 학생들의 준비를 알려주고, 교회의 오래된 기록은 박성춘처럼 이곳을 드나들던 교인들의 삶을 전합니다.",
   "박성춘의 아들 박서양도 다른 길을 열었습니다. 의학을 공부해 세브란스의학교 첫 졸업생 가운데 한 사람이 됐고, 모교에서 가르치다가 만주로 건너가 병원을 열었어요. 신분에 따라 직업과 대우가 정해지던 사회에서, 마침내 백정의 아들은 의사가 되었습니다. 승동교회의 초기 역사는 이처럼 한 가족이 차별을 견디고 새로운 일을 시작한 과정과도 이어집니다."
  ]},
  {no:14, region:"center", type:"장소/건축물", name:"탑골공원", addr:"종로2가 38", audio:"audio/14_탑골공원.mp3", script:[
   "탑골공원에 들어오면 유리 보호각 안의 석탑과 팔각지붕의 정자가 눈에 들어옵니다. 두 시설은 세워진 시대와 쓰임이 다릅니다. 석탑은 조선시대 원각사에 있던 것이고, 팔각정은 이 자리를 공원으로 쓰면서 마련한 시설이에요. 1919년 3월 1일에는 이 팔각정에서 독립선언서를 낭독했습니다. 오래된 절터가 공원이 되고, 사람들이 모여 독립을 외치는 장소가 된 것이죠.",
   "공원 이름에 들어간 ‘탑’은 원각사지 십층석탑을 말합니다. 세조 때 세운 원각사에는 여러 건물이 있었지만, 연산군과 중종 때 절이 없어지면서 건물도 사라졌습니다. 탑과 원각사비는 그 자리에 남았어요. 십층석탑은 아래에서 위로 올라가며 층의 모양이 달라집니다. 지붕을 작게 새긴 부분과 탑의 몸돌에 촘촘하게 들어간 조각을 보호각 밖에서 살펴보세요.",
   "옛 절터에는 근대에 들어 공원이 조성됐습니다. 서울 최초의 근대식 공원으로 알려져 있고, 한동안 파고다공원이라고 불렀어요. 파고다는 탑을 뜻하는 말입니다. 팔각정에서는 군악대가 연주했습니다. 여덟 방향으로 열린 정자 주변에 사람들이 모여 음악을 들을 수 있었죠. 훗날 독립선언서를 읽는 자리로 사용하게 된 것도 이렇게 여러 사람이 모일 수 있는 시설이었기 때문입니다.",
   "1919년 3월 1일, 학생과 시민들은 공원에서 민족대표들을 기다렸습니다. 하지만 대표들은 태화관에서 독립선언식을 열고 있었습니다. 공원에 모인 사람들은 그들이 올 때까지 계속 기다리지는 않았어요. 한 사람이 팔각정에 올라 독립선언서를 낭독했습니다. 낭독자는 정재용으로 알려져 있습니다. 선언서를 들은 사람들은 독립만세를 외치고 공원 밖으로 행진하기 시작했습니다.",
   "행렬은 종로를 지나 서울 시내 여러 방향으로 나아갔습니다. 그중에는 고종의 빈전이 있던 덕수궁 대한문으로 간 사람들도 있었어요. 고종의 장례를 앞두고 서울에 올라온 사람들까지 시위에 참여했습니다. 일본 군대와 경찰이 길을 막고 시위대를 해산시키려 했지만, 사람들은 다른 길로 흩어져서도 만세를 이어갔습니다. 공원 안에서 시작한 집회가 도심의 거리 시위로 커진 것입니다.",
   "공원에 있는 독립만세 부조판도 보세요. 인물과 장면을 평평한 판에서 도드라지게 표현한 조각입니다. 탑골공원의 장면뿐 아니라 각지에서 벌어진 독립운동을 기념하고 있어요. 손병희 동상은 운동 준비에 참여한 지도자를 기립니다. 석탑과 비는 원각사의 유물이고, 팔각정은 공원의 시설이며, 동상과 부조판은 뒤에 세운 기념물입니다. 작은 공원 안에서도 각 물건이 전하는 시기는 이렇게 다릅니다.",
   "3월 1일에는 서울뿐 아니라 평양과 진남포 같은 도시에서도 만세시위가 일어났습니다. 선언서가 미리 전달됐고, 각 지역에서도 모일 사람과 장소를 준비해두었어요. 이후 장날과 학교, 교회와 마을을 따라 시위가 넓어졌습니다. 탑골공원의 군중이 거리로 나간 뒤에도 독립을 요구하는 움직임은 계속됐고, 그해 4월 상하이에서는 대한민국 임시정부가 수립됐습니다."
  ]},
  {no:15, region:"center", type:"터/표지석", name:"6·10 독립만세 선창 터(파자교 터)", addr:"돈화문로 26", audio:"audio/15_육십독립만세선창터.mp3", script:[
   "이곳은 돈화문로의 ‘6·10독립만세운동 선창 터’ 입니다. 종로3가의 옛 단성사 부근이지요. 이 일대에는 파자교라는 다리도 있었지만, 만세운동을 기리는 표석과 다리터 표석은 각각 이름이 다릅니다. 오늘 살펴볼 사건은 1926년 6월 10일, 순종의 장례 행렬을 지켜보던 학생들이 이 거리에서 독립만세를 외친 일입니다.",
   "순종이 세상을 떠나자 장례를 보기 위해 많은 사람이 서울로 모였습니다. 대한제국의 마지막 황제를 떠나보내는 날이었어요. 일본 당국은 7년 전 고종의 장례를 앞두고 3·1운동이 일어났던 일을 기억하고 있었습니다. 군대와 경찰을 배치해 경계했고, 장례 행렬을 맞이하려고 길가에 서 있는 학생들도 감시했습니다.",
   "그 무렵, 학생들은 이미 시위를 준비하고 있었습니다. 조선학생과학연구회를 중심으로 여러 학교 학생들이 모여 사람을 모을 방법과 돈을 마련할 방안을 의논했어요. 중앙고등보통학교 학생 이선호도 준비 책임자였습니다. 다른 학생들도 별도로 계획을 세우고 격문을 만들었습니다. 이들은 학교 친구들을 통해 서로 연락하며 장례 당일의 행동을 준비했습니다.",
   "사회주의자들과 천도교 인사들이 준비한 계획은 거사 전에 경찰에 알려졌습니다. 숨겨두었던 격문이 발견되고 관계자들이 체포됐어요. 학생들은 그 뒤에도 준비를 멈추지 않았습니다. 태극기를 만들고, 독립을 요구하는 격문을 인쇄해 학교별로 나누었습니다. 많은 사람이 몰린 길에서 서로의 목소리가 들리지 않을 때를 대비해, 호루라기 신호에 맞춰 움직이기로 정했습니다.",
   "6월 10일 오전, 장례 행렬이 단성사 앞을 지나갔습니다. 맞은편에 서 있던 이선호가 독립만세를 선창하자 중앙고보 학생들이 호응했습니다. 태극기와 격문이 배포됐고, 연희전문 학생들도 시위에 참여했어요. 표석 앞 보행로에서 도로를 바라보면, 사람들이 양쪽에 서서 행렬을 기다렸던 길목이라는 점을 짐작할 수 있습니다. 학생들은 장례를 지켜보러 모인 자리에서 준비해온 독립 요구를 공개적으로 외쳤습니다.",
   "시위는 관수교와 훈련원 부근, 동대문 일대로도 이어졌습니다. 행렬이 이동하는 경로 곳곳에 준비한 사람들이 있었던 것이죠. 경찰은 시위를 진압했고 많은 학생을 체포했습니다. 이선호는 학교에서 퇴학당하고 재판에 넘겨졌습니다. 1심에서는 집행유예를 받았지만, 항소심에서는 징역 1년의 실형을 선고받았습니다. 거리에서 보낸 하루 뒤로 감옥 생활과 학업 중단이 이어진 것입니다.",
   "이선호는 재판에서도 만세운동에 참여한 이유를 분명하게 밝혔습니다. 자유를 요구하면 자유를 얻을 수 있다는 신념으로 참여했다고 답했어요. 출옥한 뒤에도 일본과 국내에서 활동을 이어갔고 다시 여러 차례 투옥됐습니다. 6·10만세운동 이후 학생들은 독서회와 학교 조직을 통해 힘을 모았고, 1929년 광주에서 시작된 학생독립운동에도 전국의 학생들이 참여했습니다."
  ]},
  {no:16, region:"center", type:"터/표지석", name:"신간회 본부 터", addr:"종로 104", audio:"audio/16_신간회본부터.mp3", script:[
   "탑골공원 맞은편, 종로 104번지의 신간회 본부 터 표석입니다. 신간회가 1929년 무렵 사무실로 썼던 덕원빌딩이 이곳에 있었어요. 사무실은 건물 2층에 있었습니다. 지금 건물 안에서 당시 사무실을 볼 수는 없고, 길가의 표석이 위치를 알려줍니다. 신간회는 민족주의자와 사회주의자가 한 조직에서 항일운동을 하려고 만든 단체입니다.",
   "1920년대 독립운동 진영에서는 운동의 방법을 두고 의견이 나뉘었습니다. 민족주의자 가운데는 일본의 지배 아래에서 자치권을 얻자는 사람도 있었고, 그런 타협에 반대하는 사람도 있었어요. 사회주의자들은 노동자와 농민을 조직하는 일에 힘을 쏟았습니다. 서로 경쟁하고 비판하던 이들 가운데, 식민 지배에 맞서는 일부터 힘을 합치자는 움직임이 나타났습니다. 1926년 6·10만세운동의 협력 경험과 정우회 선언은 그 움직임을 구체화하는 계기가 됐습니다.",
   "1927년 2월 15일, 종로의 기독교청년회관에서 신간회 창립대회가 열렸습니다. 초대 회장은 이상재, 부회장은 권동진이었습니다. 조선일보에서 일하던 안재홍과 신석우, 불교계의 한용운, 천도교 인사들과 사회주의자들이 참여했어요. 창립 직후에는 관수동의 이갑수 집 사랑채를 빌려 사무를 보았습니다. 창립대회를 연 회관과 처음 본부를 둔 집, 지금 표석이 있는 후기 본부는 이렇게 서로 다른 장소입니다.",
   "신간회가 내건 강령은 세 가지였습니다. 정치와 경제의 현실을 제대로 깨닫자, 단결을 굳게 하자, 기회주의를 배격하자는 것이었어요. 여기서 기회주의를 배격한다는 말에는 식민 지배를 받아들이고 자치에 만족하는 노선과 타협하지 않겠다는 뜻이 담겼습니다. 독립 뒤 어떤 사회를 만들지에 대한 생각은 달라도, 우선 독립을 위해 함께 행동하자는 약속이었습니다.",
   "조직은 빠르게 커졌습니다. 전국과 해외에 약 140개의 지회가 생기고 수만 명의 회원이 참여했어요. 각 지역에서는 순회강연을 열고, 노동쟁의와 소작쟁의, 학생들의 동맹휴학 같은 문제에 관여했습니다. 1927년에는 여성운동가들도 근우회를 조직해 협력을 모색했습니다. 신간회의 활동은 중앙의 유명 인사들이 하는 연설뿐 아니라, 자기 지역에서 벌어진 차별과 생계 문제를 해결하려는 회원들의 일로 채워졌습니다.",
   "1929년 광주학생항일운동이 일어나자 본부는 현지에 조사단을 보냈습니다. 변호사 김병로 등이 광주에 가서 사건을 조사하고, 조선인 학생들이 부당한 처벌을 받고 있다고 항의했어요. 돌아온 뒤에는 그 내용을 서울 시민들에게 알리기로 했습니다. ‘광주실정보고 민중대회’라는 이름으로 12월 13일 대회를 준비했습니다. 광주의 일을 신문 기사로만 접하는 데서 그치지 않고, 본부가 사람을 보내 확인하고 공개적으로 대응하려 한 것입니다.",
   "하지만 대회가 열리기 전에 일본 경찰이 주요 간부와 관련 단체 인사들을 체포했습니다. 대회는 무산됐고 신간회도 큰 타격을 입었어요. 허헌이 중앙집행위원장을 맡고 있던 이 시기에 본부가 바로 이 덕원빌딩 2층에 있었습니다. 표석 앞에서 탑골공원과 종로의 큰길을 보시면, 전국 지회와 연락하던 사무실이 서울 도심의 어느 길목에 놓여 있었는지 알 수 있습니다.",
   "이후에는 활동 방향을 놓고 내부의 갈등도 커졌습니다. 합법적인 단체를 유지하며 운동을 계속하자는 쪽과, 기존 조직을 해소하고 다른 방식으로 노동자와 농민을 조직해야 한다는 쪽이 맞섰어요. 국제 사회주의운동의 노선 변화도 영향을 주었습니다. 결국 1931년 5월 신간회는 해소를 결의했습니다. 창립한 지 4년여 만이었습니다. 함께 만들었던 단체는 없어졌지만, 노동문제와 학생 탄압을 자기 일로 받아들여 움직인 전국 지회들의 활동은 각 지역의 독립운동 기록에 남았습니다."
  ]},
  {no:17, region:"center", type:"터/표지석", name:"종로경찰서 터(김상옥 의거지)", addr:"종로 65", audio:"audio/17_종로경찰서김상옥의거터.mp3", script:[
   "종각역 부근 보행로에 ‘김상옥 의거 터’ 표석이 있습니다. 옛 종로경찰서 건물은 사라졌고, 지금은 종로 65 앞의 표석으로 그 자리를 찾습니다. 1923년 1월 12일 밤, 종로경찰서에서 폭탄이 터졌습니다. 이 사건 이후 김상옥을 쫓는 수사가 이어졌고, 서울의 여러 동네에서 경찰과 김상옥 사이의 총격전이 벌어졌습니다.",
   "김상옥은 1889년 서울에서 태어났습니다. 집안 형편이 어려워 어릴 때부터 대장간에서 일했고, 밤에는 야학에 다니며 공부했어요. 직접 야학을 꾸리는 데 참여하기도 했습니다. 이후 형제들과 창신동에 영덕철물점을 열었습니다. 철물만 판 것은 아니었어요. 말총으로 모자를 만들고 양말과 장갑도 제조해 팔았습니다. 직원들을 두고 사업을 하던 서울의 상공인이었습니다.",
   "1919년 3·1운동이 일어나자 김상옥은 가게 문을 닫고 직원들과 시위에 참여했습니다. 곧 동료들과 혁신단을 조직하고 혁신공보라는 신문을 발행했어요. 독립운동 소식과 주장을 인쇄물로 전하는 활동이었습니다. 그러나 경찰에 발각되고 자금까지 부족해지면서 신문을 계속 내기 어려워졌습니다. 이후 김상옥은 식민 통치의 주요 인물을 겨냥하는 의열투쟁을 준비했습니다.",
   "1920년에는 미국 의원단의 방한에 맞춰 거사를 계획했지만, 실행 전에 경찰이 들이닥쳐 뜻을 이루지 못했습니다. 동료들이 체포되자 그는 피신 끝에 국외로 나갔어요. 상하이에서는 임시정부 인사들과 연락하고 의열단 활동에 참여했습니다. 다시 국내로 들어와 독립운동 자금을 모은 뒤 돌아가기도 했습니다. 1922년 말에는 새로운 거사를 준비하며 서울로 들어왔습니다.",
   "그 뒤 종로경찰서 폭탄 사건이 일어났습니다. 종로경찰서는 독립운동가들을 감시하고 체포하던 기관이었어요. 폭발은 경찰서를 겨냥했지만 근처를 지나던 행인들도 다쳤습니다. 경찰은 김상옥을 추적했고, 1월 17일 그가 숨어 있던 후암동의 집을 포위했습니다. 김상옥은 총격전 끝에 그곳을 빠져나와 남산을 지나 다시 몸을 숨겼습니다.",
   "추적은 계속됐습니다. 1월 22일에는 효제동의 은신처가 포위됐고, 김상옥은 경찰과 맞서다가 그곳에서 생을 마쳤습니다. 종로경찰서 폭탄 사건이 일어난 곳과 마지막으로 싸운 곳은 서로 다른 장소입니다. 지금 보고 있는 표석은 종로의 사건을 기리는 것이고, 효제동에는 마지막 항전과 관련된 장소가 따로 남아 있습니다.",
   "마지막 은신처였던 효제동 이태성의 집은 김상옥이 어릴 때 살던 집의 옆집이었습니다. 이태성의 딸 이혜수와 자매들도 그를 도왔어요. 김상옥은 낯선 서울에 숨어든 사람이 아니라, 오래 알고 지낸 이웃의 도움을 받아 몸을 숨기고 동료들과 연락하던 사람이었습니다. 경찰의 수사가 좁혀오면 그를 도운 가족과 이웃도 위험해졌습니다. 창신동에서 형제들과 물건을 만들어 팔던 청년의 삶은, 1923년 1월 어린 시절을 보낸 동네의 이웃집에서 끝났습니다."
  ]},
  {no:18, region:"center", type:"터/표지석", name:"보신각 앞 3·1운동 기념 터 및 한성정부 선포지", addr:"종로 54 보신각 앞", audio:"audio/18_보신각앞삼일운동기념터및한성정부선포지.mp3", script:[
   "보신각 앞의 3·1독립운동기념터 표석입니다. 보신각은 새해를 맞으며 종을 치는 장소로 익숙하지요. 1919년 봄에는 독립을 요구하는 사람들이 이 앞에 모였습니다. 3월의 만세시위에 이어 4월에는 한성정부 수립을 알리는 활동도 벌어졌어요. 시위대가 모여 연설하고, 상인들이 가게 문을 닫고, 새 정부의 선포문을 나누던 거리였습니다.",
   "3월 1일, 탑골공원을 나온 시위대가 종로로 나아갔습니다. 보신각 앞에 모인 사람들은 종을 울리며 독립만세를 외쳤어요. 조선시대 이 종은 도성의 문을 여닫는 때를 알리는 데 쓰였습니다. 많은 사람이 소리를 듣고 시간을 알던 종을, 이날에는 독립을 요구하는 군중이 울렸습니다. 보신각이 있는 종로 네거리는 여러 방향에서 온 사람들이 만나기 쉬운 길목이기도 했습니다.",
   "시위는 3월 1일로 끝나지 않았습니다. 3월 5일에는 남대문역 광장에서 출발한 학생 시위대가 여러 길로 움직인 뒤 정오 무렵 보신각 앞에 모여 독립연설회를 열었습니다. 3월 9일부터는 상인들의 동맹 철시가 시작됐어요. 가게 문을 닫아 항의한다는 뜻입니다. 거리에 나와 외치는 사람들뿐 아니라, 영업을 멈추는 상인들도 독립운동에 참여했습니다.",
   "그런데 일본의 지배를 거부하려면 독립을 요구하는 뜻을 대표할 정부도 필요했습니다. 국내의 독립운동가들은 정부를 구성하고 그 사실을 알리는 국민대회를 준비했어요. 4월 23일 보신각 앞에서 대회를 열려 했지만, 경찰의 경계 때문에 계획한 큰 집회는 이루어지지 못했습니다. 학생으로 보이는 몇 사람이 국민대회 취지서와 임시정부 선포문을 뿌리고 만세를 불렀습니다.",
   "이들이 든 깃발에는 ‘국민대회 공화만세’라는 말이 적혀 있었습니다. 왕이 다스리는 나라를 되살리는 대신 국민이 나라의 주인이 되는 공화정을 내세운 것이죠. 배포된 문건은 국내 13도 대표 25명의 이름으로 작성됐습니다. 이승만과 이동휘 등 국내외에서 활동하던 인사들을 정부의 주요 직책에 세웠습니다. 정부를 꾸릴 인물과 규칙을 정한 뒤 국내외에 알려 지지를 얻으려 했습니다.",
   "같은 무렵 상하이와 러시아 연해주에서도 임시정부를 세우는 움직임이 있었습니다. 각지에 생긴 조직을 하나로 합치는 과정에서 한성정부는 중요한 근거가 됐어요. 국내 13도 대표 명의로 수립을 알렸다는 점이 국민을 대표하는 정부라는 주장의 바탕이었습니다. 여러 차례 협의를 거쳐 정부의 활동 근거지는 상하이에 두고, 한성정부의 정통성을 인정하는 방향으로 통합이 이루어졌습니다.",
   "보신각의 종도 그 뒤 자리가 바뀌었습니다. 오랫동안 쓰던 옛 종은 보존을 위해 옮겼고, 지금은 용산 국립중앙박물관에서 볼 수 있어요. 현재 보신각에 걸린 종은 국민 성금으로 새로 만들어 1985년에 처음 울린 것입니다. 1919년의 군중이 울린 종과 오늘 시민들이 치는 종은 다르지만, 사람들이 모여 공동의 일을 알리는 장소로 보신각 앞을 찾는 일은 계속되고 있습니다."
  ]},
  {no:19, region:"center", type:"전시관", name:"대한민국역사박물관", addr:"세종대로 198", audio:"audio/19_대한민국역사박물관.mp3", script:[
   "광화문광장 옆 대한민국역사박물관은 2012년 문을 열었습니다. 문화체육관광부가 쓰던 청사를 박물관으로 고친 건물이에요. 옛 건물의 뼈대를 최대한 살리고, 전시에 맞게 내부를 바꿨습니다. 지하를 크게 파지 않은 데에는 땅속에 남아 있을 문화유산을 보호하려는 이유도 있었죠. 건물 안에는 국권을 잃었던 시기부터 광복과 전쟁, 산업화와 민주화를 거쳐 오늘에 이르는 자료가 모여 있습니다.",
   "5층 역사관은 1894년부터 이야기를 시작해요. 동학농민혁명이 일어났고, 갑오개혁으로 국가제도를 바꾸려 했던 해입니다. 박물관은 농민들이 요구한 변화와 정부가 추진한 개혁을 출발점으로 삼았습니다. 이후의 전시를 나누는 두 해는 1945년과 1987년이에요. 광복으로 새 나라를 세우는 일이 시작됐고, 6월 민주항쟁 뒤에는 정치와 사회 여러 분야에서 시민의 참여가 확대됐습니다.",
   "독립운동 관련 소장품 중에는 김붕준의 부인 노영재가 손으로 바느질한 태극기가 있습니다. 김붕준 일가가 간직해 온 것으로, 임시정부와 임시의정원에서 사용한 것으로 추정해요. 또 한 장의 의연금 영수증에는 기부자 이희철의 이름과 26달러라는 금액이 적혀 있습니다. 구미위원부에서 서재필 명의로 발급한 영수증이에요. 인쇄된 ‘공채’를 ‘의연’으로 고친 부분도 눈여겨볼 만합니다. 빌려준 돈을 표시하던 서식이 기부금을 받은 기록으로 쓰였던 거죠.",
   "전쟁 관련 자료에는 황인덕 씨가 기증한 구두닦이통이 있습니다. 초등학생이던 그는 한국전쟁 중 아버지가 행방불명되자 어머니와 네 동생의 생계를 도왔어요. 사과 궤짝을 얻어 직접 통을 만들고 구두를 닦았습니다. 미군 손님에게 받은 초콜릿도 먹지 않고 모았다가 팔았다고 해요. 구두를 닦는 도구를 담았던 이 나무 상자로 한 아이가 가족의 생활비를 벌었습니다.",
   "4·19혁명 전단에도 만든 사람의 사연이 남아 있어요. 당시 동성고등학교 3학년이던 이병태 씨가 학교 등사기로 찍은 전단입니다. 경찰에 연행된 같은 학교 학생들을 풀어 달라는 내용이었죠. 전시품 설명에서 기증자의 이름을 읽으면, 전단을 나눠주고 생활도구를 쓰던 사람이 누구였는지 알게 됩니다. 박물관은 이런 기증품과 당사자의 이야기를 모아 정치사뿐 아니라 일하고 공부하며 살아간 사람들의 일상을 전시에 담았습니다.",
   "산업화 이후의 전시에서는 경제성장과 노동, 민주화운동을 따라가게 됩니다. 1987년 이후를 다루는 부분은 인터넷의 보급과 대중문화의 변화, 한국에 정착한 이주민들의 생활까지 이어져요. 같은 시기를 살아도 직장과 가정에서 겪은 일은 서로 달랐겠지요. 구술영상에는 전쟁을 겪거나 외환위기를 통과한 사람들이 자신의 경험을 직접 들려줍니다. 사진 속 인물이나 생활용품의 사연이 궁금할 때 조금 더 머물러 볼 곳이에요.",
   "8층 옥상정원이 열려 있다면 밖으로 나가 광화문과 경복궁 쪽을 바라보셔도 좋습니다. 거리에서는 건물에 가려졌던 궁궐의 배치가 위에서는 넓게 보이죠. 전시실에서 보던 지도와 사진 속 장소를 실제 거리와 맞춰 볼 수 있는 자리입니다. 박물관을 나서면 바로 광화문 일대의 역사 현장으로 걸음을 이어갈 수 있어요."
  ]},
  {no:20, region:"center", type:"전시관", name:"서울역사박물관", addr:"새문안로 55", audio:"audio/20_서울역사박물관.mp3", script:[
   "서울역사박물관은 경희궁 옛터에 자리하고 있습니다. 2002년에 문을 연 뒤 조선의 수도 한양부터 근현대 서울까지 도시의 변화를 다뤄 왔어요. 실내에서는 궁궐과 관청뿐 아니라 집과 가게, 교통수단을 통해 서울 사람들이 어떻게 살았는지 살펴봅니다. 박물관 앞마당에도 전차와 건축 부재, 발굴된 주춧돌이 전시돼 있어요. 종로나 광화문에서 보았던 장소의 옛 모습을 설명해 주는 실물들입니다.",
   "실내의 도시모형영상관에는 서울을 1,500분의 1로 줄인 모형이 있습니다. 한강과 산, 그 사이에 들어선 시가지를 한자리에서 내려다볼 수 있어요. 앞마당으로 나오면 또 다른 지도가 기다립니다. 수선전도를 크게 옮겨 놓은 분수예요. 수선은 서울의 옛 별칭입니다. 19세기 지도에 그려진 도성과 궁궐, 길을 찾아보고 실내에서 본 서울 모형과 비교해 보세요. 도시가 넓어진 방향과 예전부터 이어진 길이 한결 눈에 들어옵니다.",
   "야외의 광화문 부재는 잘린 단면부터 살펴보면 좋습니다. 1968년에 콘크리트로 복원했던 광화문 문루의 일부예요. 당시에는 남아 있던 석축을 수리하고 그 위에 콘크리트 문루를 올렸습니다. 이 문은 2006년까지 경복궁의 정문으로 쓰였고, 그해 12월 해체됐어요. 박물관은 해체된 조각을 보존처리해 여기로 옮겼습니다. 멀리서 목조 건물처럼 보이던 문을 어떤 재료로 만들었는지, 부재를 가까이에서 보면 확실히 드러납니다.",
   "조선총독부 청사에서 나온 기둥과 계단 부재도 있습니다. 기둥의 몸통, 위쪽 머리 장식, 아래 받침을 따로 볼 수 있어요. 계단 부재는 청사 중앙 홀에 있던 것입니다. 조선총독부 청사는 경복궁 앞을 가로막고 있던 식민통치기관의 건물이었죠. 1996년 철거가 끝난 뒤 일부 부재가 독립기념관에 보관됐고, 그 가운데 이곳의 전시품은 2012년 서울역사박물관으로 옮겨 왔습니다.",
   "종루 주춧돌은 건물을 해체할 때 옮겨 온 돌들과 발견 경위가 달라요. 1972년 지하철 공사를 하다가 땅속에서 찾았습니다. 조선 전기 종로 네거리에 서 있던 종루의 기둥을 받치던 돌이에요. 종로 시전행랑 유구도 야외에 전시돼 있습니다. 2004년 종로1가에서 발견한 옛 상점 건물의 흔적이죠. 종소리가 울리던 관청 시설과 장사를 하던 점포가 종로의 큰길 주변에 어떻게 자리했는지 짚어 볼 자료입니다.",
   "운현궁에서 기증한 석물은 운현궁 일가의 묘소에 있던 것들입니다. 야외의 석물들을 보면 문관 모양으로 깎은 문인석과 불을 밝히는 장명등, 무덤 양옆을 표시하는 망주석처럼 쓰임에 따라 형태가 달라요. 흥선대원군의 조부 은신군과 아들 흥친왕의 신도비도 이 야외전시장에 있습니다. 비석에 새긴 이름과 설명을 읽으면 어느 인물의 묘소에서 온 물건인지 알 수 있죠. 각각의 돌이 처음 서 있던 장소는 안내판에서 찾아볼 수 있습니다.",
   "큰 전차는 381호입니다. 1930년대 일본에서 제작돼 1968년 11월까지 서울 시내를 달렸어요. 차를 직접 갖기 어려웠던 시절, 시민들은 이런 전차를 타고 시내를 오갔습니다. 운행이 끝난 뒤에는 어린이대공원에 보관됐고, 2007년 12월 이곳으로 옮겨 왔죠. 복원할 때는 제작도면과 과학적 분석을 바탕으로 원래 모습을 되찾았습니다. 서울에서 전차 운행은 끝났지만, 381호는 폐차되지 않고 남아 거리의 대중교통이던 때의 모습을 전하고 있습니다."
  ]},
  {no:21, region:"center", type:"건축물/전시관", name:"경교장", addr:"새문안로 29", audio:"audio/21_경교장.mp3", script:[
   "강북삼성병원 부지에 남아 있는 이 양옥이 경교장입니다. 1938년 금광업자 최창학이 지었을 때는 죽첨장이라고 불렀어요. 당시 이 일대의 일본식 동네 이름을 딴 것이었죠. 광복 뒤 집을 제공받은 김구는 근처 다리인 경교의 이름을 가져와 경교장으로 고쳤습니다. 1945년 11월 중국에서 돌아온 뒤부터 1949년 세상을 떠날 때까지 이 집에서 살며 일했습니다.",
   "김구와 임시정부 요인들은 독립운동을 마치고 귀국했지만, 곧바로 정부를 운영할 수는 없었어요. 미군정은 임시정부를 공식 정부로 인정하지 않았습니다. 경교장에서는 국무위원회가 열리고 국내외 인사들과의 만남이 이어졌죠. 임시정부 요인들이 머물며 신탁통치 반대운동을 추진하고, 남북에 따로 정부가 들어서는 것을 막기 위한 방안을 논의한 곳입니다.",
   "실내를 관람할 수 있는 때에는 1층 응접실과 귀빈식당을 구분해서 보시면 좋겠습니다. 응접실은 주요 회의와 접견에 쓰였고, 귀빈식당에서는 1945년 12월 2일 임시정부의 공식 만찬이 열렸어요. 이날 두 번째로 귀국한 임시정부 요인들이 서울에 도착했습니다. 지금은 당시 사진과 자료를 토대로 방 배치와 가구를 재현해 놓았습니다.",
   "지하 전시에서 소개하는 자료에는 속옷에 적은 밀서가 있어요. 1948년 북한의 정세를 전하면서 통일정부 수립을 위해 힘써 달라고 요청한 글입니다. 종이 대신 몸에 입는 옷에 글을 적어 소식을 보냈다는 점이 눈에 띄죠. 김구는 그해 남북협상에 참가했습니다. 신탁통치 반대 전단, 환국을 알린 신문 호외와 이런 밀서를 차례로 살펴보면, 귀국 이후 그가 어떤 요구를 받고 무엇을 추진했는지 구체적으로 따라갈 수 있어요.",
   "2층에는 김구가 일하고 방문객을 만나던 거실 겸 집무실이 재현되어 있습니다. 1949년 6월 26일, 육군 소위 안두희가 이곳에서 김구에게 총을 쐈어요. 김구가 서거한 뒤에는 아래층 귀빈식당에 빈소가 차려졌습니다. 귀국을 축하하는 공식 만찬을 열었던 방에서, 4년도 지나지 않아 조문객을 맞게 된 것이죠. 집무실과 식당의 용도를 먼저 알아두면 당시 사진에 등장하는 장소도 구별하기 쉽습니다.",
   "김구의 사후에도 건물은 계속 사용됐습니다. 중화민국 대사관저와 월남대사관 등을 거쳤고, 1967년부터는 병원시설로 쓰였어요. 그 과정에서 내부와 외부가 바뀌었습니다. 오늘날 병원 안에 집 한 채가 놓인 듯 보이는 풍경에는, 경교장 자체가 오랫동안 병원의 일부였던 사정이 있습니다.",
   "복원할 때는 1938년 건축 잡지인 『조선과 건축』에 실린 도면과 임시정부 요인들이 머물던 시기의 사진을 참고했습니다. 병원시설을 걷어내고 예전 방의 구성을 되살린 뒤, 2013년 3월 2일 다시 공개했어요. 지하에서 건축도면이나 옛 사진을 보게 되면 지상의 응접실, 식당, 집무실과 맞춰 보세요. 이 집에서 회의를 하고 손님을 만나고 생활했던 동선을 이해하는 데 도움이 됩니다."
  ]},
  {no:22, region:"center", type:"터/표지석", name:"어니스트 베델 집 터", addr:"홍파동 2-2 월암근린공원 내", audio:"audio/22_어니스트베델집터.mp3", script:[
   "월암근린공원 산책로에 있는 표석은 영국인 언론인 어니스트 베델의 옛 집터를 알리고 있습니다. 한국에서는 배설이라는 이름을 썼어요. 집은 사라져 지금은 표석만 남아 있습니다. 가까운 딜쿠샤에 살던 앨버트 테일러보다 앞서, 서울에서 신문을 만들며 일본의 침략을 비판했던 인물입니다.",
   "베델이 한국에 온 것은 러일전쟁이 시작된 1904년입니다. 영국 신문의 특별 통신원으로 전쟁을 취재하러 왔죠. 그해 7월 양기탁 등과 대한매일신보를 창간했습니다. 처음에는 한 호에 한국어와 영어 지면을 넣었고, 나중에는 따로 발행했어요. 이어 순한글판도 냈습니다. 한국인 독자들에게 소식을 전하고, 한국에서 벌어지는 일을 외국인에게 알리려면 각각 읽을 수 있는 신문이 필요했던 겁니다.",
   "당시 일본은 한국 신문을 검열하고 보도를 통제했습니다. 그런데 영국인 발행인에게는 치외법권이 적용됐어요. 일본 당국이 한국인 발행인과 같은 방식으로 체포하거나 처벌하기 어려웠죠. 대한매일신보는 이런 조건을 이용해 일본의 침략을 비판하고 의병 활동을 보도했습니다. 그렇다고 베델 혼자 신문을 만든 것은 아닙니다. 양기탁이 운영을 맡았고 박은식과 신채호 등이 글을 썼어요. 발행인의 국적과 한국인 필진의 활동이 신문을 지탱했습니다.",
   "신문사는 국채보상운동에도 참여했어요. 일본에 진 빚을 국민이 돈을 모아 갚자는 운동이었죠. 대한매일신보사는 의연금을 모으고 관리하는 일을 맡았습니다. 논설을 싣는 일에 더해 독자들이 낸 돈을 모으는 창구가 되었던 거예요. 이후 일본 당국은 이 의연금에 문제가 있다는 혐의를 제기하며 신문사 관계자들을 압박했습니다. 양기탁은 횡령 혐의로 재판에 넘겨졌지만 무죄로 풀려났습니다.",
   "일본은 베델을 직접 다루기 어려우니 영국 당국에 처벌과 추방을 요구했습니다. 영국은 당시 일본과 동맹을 맺고 있었어요. 베델은 영국의 법정에서 두 차례 재판을 받았고, 1908년에는 3주간의 금고형을 선고받아 상하이로 보내졌습니다. 영국인이라는 신분이 검열을 피하는 데 도움이 되었어도, 영국 정부가 끝까지 그의 신문 활동을 지켜준 것은 아니었습니다.",
   "형기를 마치고 서울에 돌아온 베델은 이듬해인 1909년 5월 세상을 떠났습니다. 양화진에 묻혔고, 추도회에는 양기탁과 안창호 등이 참석했어요. 그의 활동은 1910년 강제병합 이전, 대한제국이 외교권과 통치권을 차례로 빼앗기던 시기에 이루어졌습니다. 베델의 뒤를 이어 신문을 운영한 사람이 1910년 신문을 일제에 넘기면서, 대한매일신보는 제호에서 ‘대한’이 빠진 매일신보가 됩니다. 이후에는 조선총독부의 입장을 전하는 신문으로 바뀌었죠.",
   "베델이 죽은 뒤에는 그의 묘비에 새긴 글까지 수난을 겪었습니다. 양화진에 세운 추모비의 글을 일제가 지워버린 거예요. 광복 후인 1964년, 언론인들이 성금을 모아 새 비석을 세웠습니다. 신문을 발행하던 때에는 기사가, 세상을 떠난 뒤에는 그를 기리는 비문이 탄압의 대상이 되었습니다. 이 공원에는 집터 표석이, 양화진에는 다시 세운 묘비가 남아 베델이 서울에서 보낸 짧은 생애를 전하고 있어요."
  ]},
  {no:23, region:"center", type:"건축물/전시관", name:"이회영 기념관", addr:"사직로8길 15", audio:"audio/23_이회영기념관.mp3", script:[
   "이회영기념관이 자리한 이 건물은 사직동의 옛 선교사 주택입니다. ‘묵은집’이라고도 불러요. 이회영이 살던 집은 아니고, 남산예장자락에 있던 기념관이 2024년 이곳으로 옮겨왔습니다. 전시에서는 이회영과 다섯 형제, 그리고 가족과 동료들의 독립운동을 소개합니다. 여섯 형제가 재산을 팔아 만주로 떠났다는 이야기는 널리 알려져 있지만, 여기에서는 떠난 뒤에 그들이 무엇을 하며 살았는지도 살펴보겠습니다.",
   "이회영은 이항복의 후손으로, 여러 대에 걸쳐 높은 벼슬을 지낸 집안에서 태어났습니다. 하지만 집안의 종들을 풀어주고 다른 집의 종에게도 높임말을 썼다고 해요. 남편을 잃은 여동생이 다시 결혼할 수 있게 도운 일도 전해집니다. 당시 양반가에서는 쉽게 받아들이기 어려운 일이었죠. 훗날 자유와 평등을 중시한 그의 생각을, 젊은 시절 사람을 대하던 태도에서도 엿볼 수 있습니다.",
   "1910년 나라를 빼앗기자 여섯 형제는 가산을 정리하고 가족을 이끌어 만주로 떠났습니다. 특히 둘째 형 이석영이 물려받은 넓은 토지를 판 돈이 큰 밑천이 되었어요. 목적은 독립운동을 오래 이어갈 근거지를 만드는 것이었습니다. 돈으로 무기를 사는 데서 끝나지 않고, 사람들이 정착할 땅을 마련하고 농사를 지으며 군사교육을 받을 수 있는 마을을 만들려 했죠.",
   "이상룡과 이동녕 등도 힘을 보탰습니다. 이들이 만든 경학사라는 이름에는 농사짓고 공부한다는 뜻이 담겨 있어요. 그러나 현지에서는 토지를 구하기도 쉽지 않았습니다. 이회영은 중국의 유력 정치가 위안스카이를 찾아가 한인들의 토지 매입을 도와달라고 요청했습니다. 낯선 땅에서 학교를 세우려면, 우선 그곳에서 살고 농사지을 권리부터 확보해야 했던 겁니다.",
   "1911년 문을 연 신흥강습소는 뒤에 신흥무관학교로 발전했습니다. 학교의 출발부터 군인만 가르친 것은 아니었어요. 신흥학교 시기에는 중학과정을 배우는 본과와 군사학을 익히는 특과가 있었습니다. 본과는 4년, 군사교육은 몇 달씩 집중해서 받는 과정으로 운영됐죠. 이곳에서 배운 이들은 독립군 부대에 참여해 전투와 교육을 맡았습니다. 학생들의 농사 사진을 보면, 먹을 것을 마련하는 일과 훈련을 함께 해야 했던 학교의 형편도 짐작할 수 있어요.",
   "이회영은 만주를 떠난 뒤에도 독립운동 자금을 구하고 동료들을 연결했습니다. 베이징의 집에는 신채호와 유자명 같은 운동가들이 드나들었고, 소설 『상록수』를 쓴 심훈도 한동안 머물렀어요. 젊은이들과 교류하며 이회영은 아나키즘을 받아들였습니다. 국가나 소수 지도자에게 권력이 집중되는 것을 경계하고, 사람들이 자유롭게 협력하는 사회를 지향한 사상입니다. 그 자신도 독립운동 단체들이 지위를 다투기보다 서로 연합하기를 바랐습니다.",
   "생활은 점점 어려워졌습니다. 처음 마련한 재산으로 오랜 망명과 독립운동을 끝까지 감당할 수는 없었어요. 새로운 정착지와 학교를 만들려다가 자금을 구하지 못해 포기한 계획도 있었습니다. 그런 생활 속에서도 이회영은 젊은 동료들에게 단소와 양금을 가르쳤다고 합니다. 글씨와 그림, 음악에 능했던 사람이었죠. 전시에 소개되는 편지나 글씨를 보실 때는 학교 설립자와 독립운동가였던 그가 이런 재주도 지녔다는 점을 기억해 주세요.",
   "1932년에는 다시 만주로 향했습니다. 중국 군벌 장쉐량의 무기 지원을 받아 항일활동을 이어갈 계획이었어요. 이미 일본이 장악한 만주로 가는 길을 동료들이 만류했지만 출발했습니다. 그러나 다롄에서 일본 경찰에 체포되었고, 모진 고문 끝에 그해 11월 17일 숨졌습니다. 끝내 광복을 보지 못했습니다. 말년에 이르기까지 학교와 조직을 세우고 다음 활동지를 찾던 삶이, 체포와 함께 끊어진 것입니다.",
   "동생 이시영은 광복 뒤 돌아와 신흥무관학교의 뜻을 잇는 교육사업을 추진했습니다. 1947년 신흥전문학원을 세웠고, 이 학교는 신흥대학을 거쳐 오늘의 경희대학교로 이어졌습니다. 기념관이 사직동으로 이전할 때는 이회영의 육필 편지 13통도 처음 공개됐어요. 그때그때 전시되는 자료는 달라질 수 있지만, 편지에 적힌 수신인과 작성 시기를 함께 보시면 만주, 베이징, 상하이를 옮겨 다니며 누구와 일을 의논했는지 더 자세히 따라갈 수 있습니다.",
   "이곳은 작지만 이회영을 비롯한 여섯 형제의 발자취를 기억할 수 있는 소중한 장소입니다. 여섯 형제 중 단 한명, 이시영만이 살아남아 조국의 광복을 보았습니다. 실로 막대한 자금을 기꺼이 독립자금으로 내놓았던 둘째 이석영의 사인이 굶주림에 의한 아사였다는 점이 가슴을 먹먹하게 합니다. 한국판 노블리스 오블리주를 실천한 이 육형제의 이름, 이 장소에서 꼭 한번씩 눈과 마음에 담아가시길 권합니다."
  ]},
  {no:24, region:"center", type:"건축물/전시관", name:"딜쿠샤(앨버트 테일러 가옥)", addr:"사직로2길 17", audio:"audio/24_딜쿠샤.mp3", script:[
   "행촌동 언덕 위에 서 있는 붉은 벽돌집이 딜쿠샤입니다. 외벽의 정초석을 보면 집 이름과 1923이라는 숫자가 새겨져 있어요. 미국인 앨버트 테일러와 영국인 메리 테일러 부부가 그해 공사를 시작해 이듬해 완성한 집입니다. 1926년 불이 난 뒤 1930년에 다시 지었습니다. 아래쪽의 화강석 기단과 그 위에 쌓은 벽돌을 차례로 보시면 집의 구조가 눈에 들어옵니다.",
   "딜쿠샤는 페르시아어로 ‘기쁜 마음’이라는 뜻입니다. 메리가 인도 여행에서 보았던 건물의 이름을 가져왔어요. 배우였던 메리는 한국에서 생활하며 그림을 그리고 글을 썼습니다. 앨버트는 광산과 무역업을 하면서 AP통신의 통신원으로도 일했죠. 오늘날 이 집이 독립운동과 관련해 알려진 것은 그가 1919년 3·1운동과 제암리 학살 사건을 해외에 보도했기 때문입니다. 그때는 아직 딜쿠샤가 지어지기 전이었어요.",
   "독립선언서를 입수한 과정에는 아들의 출생이 얽혀 있습니다. 1919년 2월 28일 세브란스병원에서 브루스가 태어났어요. 가족이 남긴 기록에 따르면, 병원에 있던 메리의 침상에 독립선언서 사본이 숨겨져 있었고 앨버트가 이를 발견했다고 합니다. 갓 태어난 아이와 아내를 보러 간 병원에서 중요한 문서를 접한 것이죠. 앨버트는 독립선언과 만세운동을 기사로 작성해 외국에 알렸습니다.",
   "그해 봄에는 경기도 제암리로 가서 일본군이 주민들을 학살한 사건을 취재했습니다. 고종의 장례 행렬도 사진으로 남겼어요. 종로의 건물에서 장례를 지켜보는 군중의 사진처럼, 그의 기록에는 특정 사건과 그 자리에 있었던 사람들이 들어 있습니다. 전시에서 사진과 기사를 함께 보면, 테일러가 사업을 하며 살아가던 서울에서 어떤 일을 보고 통신원으로 전달했는지 살펴볼 수 있습니다.",
   "메리도 한국에서의 경험을 기록했습니다. 회고록의 제목은 『호박목걸이』예요. 앨버트에게 결혼선물로 받은 목걸이에서 제목을 가져왔습니다. 메리가 세상을 떠난 뒤 아들 브루스가 원고를 정리해 출간했죠. 이 책에는 한국 사람들의 생활과 풍습, 여행 이야기가 실려 있습니다. 언론 보도가 큰 사건을 전한다면, 메리의 기록에는 부부가 이웃과 사귀고 집을 꾸리며 살았던 날들이 나옵니다.",
   "태평양전쟁이 벌어진 뒤인 1942년, 테일러 부부는 일본에 의해 추방되어 한국을 떠났습니다. 딜쿠샤는 다른 사람의 소유를 거쳐 국가 소유가 되었고, 여러 사람이 살면서 원래 모습이 많이 바뀌었어요. 오랫동안 집의 내력이 제대로 알려지지 않았습니다. 그러다 아들 브루스가 어린 시절 살던 집을 찾고 싶다고 요청하면서 조사가 이루어졌고, 2006년에는 직접 이곳을 찾아왔습니다. 병원에서 독립선언서를 발견하던 날 태어난 아이가 노인이 되어 돌아온 것입니다.",
   "가족이 보관한 사진과 유품은 집을 복원하는 데 중요한 자료가 되었습니다. 지금 실내의 거실은 테일러 부부가 살던 모습을 재현한 것이고, 나머지 공간에서는 가족의 생활과 앨버트의 언론활동을 소개합니다. 2021년 3월 1일 전시관으로 문을 열었어요. 거실의 가구 배치를 본 뒤 옛 사진을 찾아 비교해 보셔도 좋겠습니다. 집을 떠난 가족이 사진과 글을 간직해 둔 덕분에, 서울에 남은 이 벽돌집도 다시 주인의 이름과 일상을 되찾을 수 있었습니다."
  ]},
  {no:25, region:"center", type:"전시관", name:"독립운동가 가족을 생각하는 작은 집", addr:"통일로 230", audio:"audio/25_독립운동가가족을생각하는작은집.mp3", script:[
   "독립문역 3번 출구 앞의 작은 한옥은 ‘독립운동가 가족을 생각하는 작은 집’입니다. 길 건너에는 서대문형무소역사관이 있어요. 이 전시관은 감옥에 갇힌 사람을 찾아와 면회하고 필요한 물품을 챙기던 가족들을 소개합니다. 독립운동가가 체포되면 남은 가족은 당장 생계를 꾸리는 일과 감옥에 있는 사람을 돌보는 일을 함께 감당해야 했습니다.",
   "그런 일을 옥바라지라고 불렀죠. 멀리 사는 가족이라면 서울까지 오는 여비와 머물 곳부터 마련해야 했을 거예요. 면회 한 번을 하기 위해서도 시간과 돈이 필요했습니다. 무악동의 옛 골목에는 감옥을 찾아온 사람들이 머물던 여관들이 있었습니다. 이 작은 집은 그 골목을 ‘옥바라지 골목’으로 기억하려는 노력에서 만들어졌습니다.",
   "전시실에서 눈여겨볼 것은 서대문형무소의 면회창을 재현한 부분입니다. 약 50센티미터 크기의 작은 창이에요. 이은숙이 아들 이규창을 면회했던 이야기도 소개합니다. 이은숙은 이회영의 아내로, 가족과 만주로 망명해 독립운동을 뒷바라지했던 사람이죠. 남편을 잃은 뒤에는 수감된 아들을 만나러 형무소에 와야 했습니다. 작은 면회창 앞에 서면, 어머니와 아들이 마주할 수 있었던 공간이 얼마나 제한적이었는지 알 수 있어요.",
   "가족이 주고받은 편지도 중요한 자료입니다. 안창호가 아들 필립에게 보낸 편지 등을 통해, 독립운동가가 집을 떠나 있는 동안 자녀에게 어떤 말을 전했는지 살펴볼 수 있습니다. 편지를 보실 때는 이름뿐 아니라 보내고 받은 사람의 관계도 읽어보세요. 독립운동가라는 호칭으로만 익숙했던 사람이 한 가족의 아버지이기도 했다는 사실을 구체적인 글로 만나게 됩니다.",
   "지금의 한옥은 당시 옥바라지를 하던 가족의 집을 그대로 남겨둔 건물은 아닙니다. 2016년 무악동 재개발 과정에서 옛 골목의 역사를 남겨야 한다는 의견이 제기되었어요. 공사를 둘러싼 갈등과 논의 끝에 서울시와 조합, 주민 등이 기념공간을 마련하는 데 합의했습니다. 그렇게 조성한 전시관이 2019년 문을 열었습니다. 약 78제곱미터의 작은 규모로, 전시실은 두 공간으로 나뉘어 있습니다.",
   "옛 동네의 사진과 영상도 시간을 두고 보시면 좋겠습니다. 지금의 아파트와 도로가 생기기 전, 형무소 맞은편에 어떤 골목과 집들이 있었는지 볼 수 있어요. 서대문형무소에서 수감자의 생활을 살폈다면 이곳에서는 가족의 면회와 편지를 이어서 보게 됩니다. 한쪽은 감옥에 갇혔고 다른 한쪽은 밖에서 생계를 이어갔지만, 서로 안부를 전하고 다시 만나기 위해 애쓰던 관계가 이 자료들에 남아 있습니다."
  ]},
  {no:26, region:"center", type:"건축물/공원", name:"정동공원(구 러시아 공사관)", addr:"정동길 21-18", audio:"audio/26_정동공원구러시아공사관터.mp3", script:[
   "정동공원 언덕에 남아 있는 흰 탑은 옛 러시아공사관 건물의 일부입니다. 지금은 탑이 가장 먼저 눈에 들어오지만, 원래는 본관과 여러 부속공간을 갖춘 큰 공관이었어요. 한국전쟁 때 대부분 파괴되었고 탑과 지하 부분 등이 남았습니다. 남아 있는 탑의 외관과 옛 공사관 사진을 비교해 보면, 사라진 건물이 차지하던 규모를 이해하기가 쉽습니다.",
   "이곳은 1896년 고종과 왕세자가 궁궐을 떠나 피신한 장소로 잘 알려져 있습니다. 그 전해인 1895년에는 일본인들이 경복궁에 침입해 명성황후를 살해했어요. 왕비가 살해된 뒤 고종은 궁궐 안에서도 안전을 보장받지 못했습니다. 고종을 궁 밖으로 옮기려던 앞선 시도도 실패했고, 왕에 대한 감시와 압박은 더 심해졌죠.",
   "1896년 2월 11일 새벽, 궁녀들이 타는 가마 두 채가 경복궁 영추문을 빠져나왔습니다. 가마 안에 탄 사람은 고종과 왕세자였어요. 두 사람은 정동의 러시아공사관에 도착했습니다. 이를 아관파천이라고 부릅니다. 당시 러시아를 가리키던 말에서 ‘아’를, 공사관에서 ‘관’을 가져왔고, 파천은 임금이 난리를 피해 거처를 옮긴다는 뜻입니다. 이범진 등이 일을 추진했고 러시아 공사도 계획에 참여했습니다.",
   "고종은 이곳에 도착한 뒤 친일 성향의 김홍집 내각을 해산했습니다. 김홍집은 목숨을 잃었고 새로운 내각이 들어섰어요. 국왕의 피신과 동시에 정부를 이끌던 인물들도 바뀐 것입니다. 대신들은 국정을 보고하기 위해 외국 공사관에 와야 했습니다. 정동에는 여러 나라 공관이 모여 있었지만, 러시아공사관은 조선 국왕이 머물며 정치를 하는 특별한 위치에 놓였습니다.",
   "러시아의 보호에는 대가가 따랐습니다. 조선에 대한 러시아의 영향력이 커졌고, 다른 열강도 철도와 광산 등의 이권을 얻기 위해 움직였어요. 일본의 위협을 피했다고 해서 외국의 간섭까지 사라진 것은 아니었습니다. 왕의 안전을 확보하는 일과 나라가 스스로 결정할 권한을 지키는 일이 동시에 걸려 있었습니다. 국내에서는 국왕이 궁궐로 돌아와야 한다는 요구도 나왔습니다.",
   "고종은 약 1년 뒤인 1897년 2월 20일 경운궁으로 돌아갔습니다. 지금의 덕수궁이에요. 정동에 있던 경운궁을 새 거처로 삼았고, 그해 대한제국을 선포하며 황제에 올랐습니다. 아관파천을 살펴볼 때 러시아공사관과 덕수궁을 함께 찾는 이유가 여기에 있습니다. 궁궐에서 외국 공관으로 피신했다가 돌아온 뒤, 국가의 체제를 대한제국으로 바꾼 순서입니다.",
   "공원에서는 탑의 외관을 둘러볼 수 있어요. 고종이 머물던 본관은 사라졌지만, 옛 사진으로 본관과 탑이 어떻게 이어졌는지 확인할 수 있습니다. 흰 탑만 보고는 알기 어려웠던 국왕의 임시 거처가 사진 속에서 드러납니다. 가까운 덕수궁으로 내려가면, 러시아공사관을 떠난 고종이 돌아가 생활하고 국정을 보던 다음 장소를 만나게 됩니다."
  ]},
  {no:27, region:"center", type:"건축물/전시관", name:"덕수궁 돈덕전", addr:"세종대로 99 덕수궁 내", audio:"audio/27_덕수궁돈덕전.mp3", script:[
   "석조전 뒤편의 붉은 벽돌 건물이 돈덕전입니다. 푸른빛 창틀과 아치형 창, 난간의 꽃무늬가 눈에 띄죠. 꽃무늬는 오얏꽃, 곧 자두꽃으로 대한제국 황실을 상징했습니다. 궁궐 안의 다른 전각과 재료와 색이 꽤 다릅니다. 외국 사절들을 맞이할 서양식 영빈관으로 지었기 때문이에요. 지금의 건물은 옛 돈덕전이 사라진 뒤 자료를 토대로 다시 지어 2023년에 공개한 것입니다.",
   "돈덕전은 고종 즉위 40주년을 기념하는 큰 행사를 준비하며 1902년부터 1903년에 걸쳐 세웠습니다. 대한제국은 여러 나라의 사절을 초대해 황제국의 위상을 알리려 했어요. 외국에서 온 손님을 접견하고 연회를 열 건물이 필요했죠. ‘돈덕’은 덕 있는 사람을 후하게 대한다는 뜻으로, 중국 고전인 『서경』에서 가져온 이름입니다.",
   "하지만 처음 계획했던 칭경예식은 열리지 못했습니다. 전염병 등의 사정으로 행사가 거듭 미뤄진 거예요. 많은 손님을 초대하려던 준비가 뜻대로 되지 않았지만, 완성된 건물은 이후 외국 귀빈을 맞거나 연회를 여는 데 사용했습니다. 대한제국의 궁궐에는 이런 접대를 위해 서양식 음식과 식기, 실내 가구가 들어왔습니다. 황제가 외국인 손님을 만나는 방식도 달라지고 있었던 것이죠.",
   "난간의 오얏꽃 장식은 당시 사진에서도 확인할 수 있습니다. 고종과 영친왕이 돈덕전 테라스에 서 있는 사진에 꽃무늬가 보이거든요. 황실에서 쓰던 식기와 문서에도 오얏꽃이 사용됐습니다. 서양식 건물에 대한제국 황실의 표식을 넣은 것이죠. 외관을 보실 때 창틀의 색과 함께 난간의 반복되는 꽃 모양도 찾아보세요.",
   "돈덕전에서 열린 중요한 의례 가운데 하나는 1907년 순종의 황제 즉위식입니다. 그해 고종은 이준, 이상설, 이위종을 헤이그 만국평화회의에 특사로 보냈어요. 1905년 을사늑약으로 빼앗긴 외교권을 되찾기 위해 국제사회에 호소하려던 일이었습니다. 일본은 이 특사 파견을 구실로 고종에게 퇴위를 강요했습니다. 외국 사절에게 황제국의 위상을 알리려고 세운 건물에서, 일본의 압박으로 황제가 바뀌는 의식이 열린 것입니다.",
   "일제강점기에 돈덕전은 철거되었고 오랫동안 건물이 없는 터로 남았습니다. 다시 지을 때는 발굴조사로 확인한 기초와 옛 사진, 문헌을 대조했습니다. 사진은 벽돌 장식과 창문의 모양, 건물의 높이를 되살리는 데 중요한 자료였어요. 현재 모습이 선명하고 새것처럼 보이는 것은 이런 재건 과정을 거쳤기 때문입니다.",
   "내부는 옛 연회장이나 침실을 그대로 재현하는 방식 대신, 대한제국의 외교를 소개하는 전시공간으로 마련했습니다. 실내가 개방되어 있을 때는 접견과 연회에 관한 기록, 당시 외교관들의 활동을 다룬 자료를 보실 수 있어요. 고종이 궁 안으로 초대한 외국 사절과, 대한제국이 외국에 보낸 사절의 행적을 함께 살펴보면 이 건물의 역할을 더 구체적으로 이해할 수 있습니다.",
   "가까운 중명전에서는 을사늑약과 헤이그 특사에 관한 전시를 볼 수 있습니다. 두 건물의 사건을 연결하면 1905년 외교권을 빼앗긴 일, 1907년 특사 파견, 고종의 강제 퇴위와 순종의 즉위가 이어집니다. 돈덕전 앞에서는 그 마지막 즉위식이 이 자리에서 열렸다는 점을 기억해 두시면 좋겠습니다."
  ]},
  {no:28, region:"center", type:"건축물/전시관", name:"덕수궁 중명전", addr:"정동길 41-11", audio:"audio/28_덕수궁중명전.mp3", script:[
   "정동길의 골목 안쪽에 있는 이 붉은 벽돌 건물이 중명전입니다. 지금은 덕수궁 담장 밖에 따로 떨어져 있지만, 고종 때에는 경운궁의 일부였어요. 정면의 회랑과 위아래로 놓인 창을 보시면 전통 궁궐 전각과 다른 건축방식을 알아볼 수 있습니다. 처음 이름은 수옥헌이었고, 황실의 책을 보관하는 도서관으로 사용했습니다.",
   "1901년 화재로 건물이 타면서 다시 지었고, 1904년에는 경운궁의 여러 전각에 큰불이 났습니다. 고종은 그때 이 건물로 거처를 옮겼어요. 이후 이곳에서 외국 사절을 만나고 국정을 처리했습니다. 중명전이라는 이름도 이 무렵부터 사용된 것으로 봅니다. 책을 보관하던 건물에 황제가 머물게 된 데에는 이처럼 궁궐의 화재라는 사정이 있었습니다.",
   "1905년 11월 17일, 일본은 대한제국의 외교권을 빼앗는 조약을 강요했습니다. 일본군이 궁궐 안팎을 장악한 가운데 이토 히로부미가 대신들을 압박했어요. 참정대신 한규설은 강하게 반대했지만 제압당했습니다. 결국 외부대신 박제순과 일본 공사 하야시 곤스케의 이름으로 조약이 작성됩니다. 우리가 을사늑약이라고 부르는 문서입니다. ‘늑약’은 강압으로 맺게 한 조약이라는 뜻이에요.",
   "1층 전시관에 있는 을사늑약 조약문에서 서명과 날인 부분을 잘 살펴보세요. 황제인 고종의 서명과 국새가 없습니다. 고종은 조약을 승인하지 않았어요. 일본은 그렇게 강요한 문서를 근거로 대한제국의 외교를 장악하고 통감부를 설치했습니다. 대한제국이 다른 나라와 직접 교섭할 길을 가로막은 것입니다. 이 사건을 단지 두 나라가 조약을 맺었다고만 설명할 수 없는 이유가 여기에 있습니다.",
   "고종은 외국에 늑약의 부당함을 알리려 했습니다. 1907년에는 네덜란드 헤이그에서 열리는 만국평화회의에 이준, 이상설, 이위종을 특사로 보냈어요. 세 사람은 대한제국이 조약에 동의한 적이 없다는 사실을 알리고 일본의 강압을 고발하려 했습니다. 그러나 회의에 정식 대표로 참석하지 못했고, 일본은 특사 파견을 문제 삼아 고종에게 퇴위를 강요했습니다. 중명전 전시에서 늑약 문서 다음으로 특사들의 자료를 보는 것은, 외교권을 빼앗긴 뒤에도 이를 되찾으려는 시도가 계속됐기 때문입니다.",
   "황제가 떠난 뒤 중명전의 용도는 크게 바뀌었습니다. 외국인들의 사교클럽으로 쓰였고, 1925년에는 또다시 불이 나 건물에 큰 피해를 입었어요. 복구된 뒤에도 다른 용도로 사용되다가 민간에 팔리기도 했습니다. 원래 궁궐에 속했던 건물이 훗날 일반 회사의 사무실로 쓰이던 시절도 있었죠. 옛 사진을 살펴보면 지금의 외관에 이르기까지 창과 회랑 등이 어떻게 달라졌는지 비교할 수 있습니다.",
   "중명전은 보수와 복원을 거쳐 2010년 전시관으로 공개됐습니다. 외관만 보면 작은 서양식 건물이지만, 안에 들어서면 1905년 대신들을 압박한 과정과 고종의 대응을 문서와 자료로 따라가게 됩니다. 한규설은 무엇을 거부했고, 박제순의 이름은 어떤 문서에 남았으며, 세 특사는 무엇을 알리려 했는지 차례로 보세요. 같은 사건에 등장해도 각 사람이 맡았던 역할과 선택은 달랐습니다."
  ]},
  {no:29, region:"center", type:"건축물/전시관", name:"이화박물관(심슨기념관)", addr:"정동길 26 이화여자고등학교 내", audio:"audio/29_이화박물관심슨기념관.mp3", script:[
   "이화여고 교정에 있는 붉은 벽돌 건물이 심슨기념관입니다. 지금은 이화박물관으로 사용하고 있어요. 1915년에 지었으니, 1886년 이화학당이 처음 문을 열었던 건물은 아닙니다. 학교를 다니는 여학생이 늘면서 교실이 부족해져 새로 지은 교사예요. 미국인 후원자 사라 심슨이 맡긴 기금으로 세웠고, 그 이름을 건물에 붙였습니다.",
   "이화학당을 시작한 사람은 미국인 선교사 메리 스크랜튼입니다. 1886년 정동에서 여학생을 가르치기 시작했고, 이듬해 고종이 이화라는 이름을 내렸어요. 여성들이 학교에 와서 여러 과목을 체계적으로 배우는 일은 당시로서는 새로운 일이었습니다. 학교가 자라면서 기존 건물을 늘리고 여성병원이던 보구여관까지 교실로 바꿨지만, 여전히 자리가 모자랐습니다. 이런 사정 끝에 마련한 건물이 지금 보고 계신 심슨기념관입니다.",
   "1915년의 건물은 1922년에 한 차례 더 커졌습니다. 당시에는 지하부터 지상 3층까지 여러 크기의 방 24개가 있었고, 교실과 사무실 등으로 사용했어요. 여러 교육과정의 학생들이 오가던 학교 건물인 것이죠. 박물관의 옛 사진에서는 학생들의 모습과 함께 건물의 형태도 보시면 좋겠습니다. 교실을 더 짓고 고쳐 쓰는 과정에서 학교의 규모가 어떻게 달라졌는지 알 수 있습니다.",
   "박물관에는 옛 교실 형태로 꾸민 유관순교실이 있습니다. 유관순은 이화학당에서 공부하다가 1919년 서울의 만세운동에 참여했어요. 일제가 학교에 휴교령을 내리자 고향인 천안으로 내려갔고, 4월 1일 아우내장터의 만세시위를 이끌었습니다. 유관순교실은 당시 교실의 모습을 재현한 곳으로, 학교의 역사를 소개하는 영상도 볼 수 있습니다.",
   "전시에서 소개하는 자료는 독립운동에 관한 것만이 아닙니다. 시대별 교복과 졸업반지, 1950년대의 학교 종, 학교가 받은 트로피 등도 있어요. 동문들이 간직했다가 기증한 물건을 통해 학교생활을 살펴봅니다. 교복은 사진 속 학생들이 무엇을 입었는지, 졸업반지는 어느 해에 학교를 마쳤는지 알려주죠. 전시 구성이 바뀔 수 있으니, 눈에 들어오는 물건의 연도와 기증자를 함께 읽어보셔도 좋겠습니다.",
   "건물은 한국전쟁 때 크게 무너졌습니다. 1961년에 복구했고, 2011년에는 옛 외관을 되살리는 공사를 마쳤어요. 전쟁 뒤 학교를 다시 사용할 수 있게 고친 일과, 나중에 역사적 모습을 복원한 일은 시기가 다릅니다. 사진을 대조하면 증축과 전쟁, 복원을 거친 학교 건물의 변화를 살펴볼 수 있어요.",
   "심슨기념관은 현재 이화여고에 남아 있는 가장 오래된 건물입니다. 주변에서는 지금도 학생들이 공부하고 있죠. 우리 땅에 처음, '여학생' 이라는 새로운 희망을 심은 이화의 역사는 창립자와 유명한 졸업생뿐 아니라 박물관과 학교라는 공간으로 계속 이어지고 있습니다."
  ]},
  {no:30, region:"center", type:"건축물", name:"정동제일교회", addr:"정동길 46", audio:"audio/30_정동제일교회.mp3", script:[
   "정동길의 붉은 벽돌 교회가 정동제일교회입니다. 오래된 예배당은 벧엘예배당이라고 불러요. 뾰족하게 올라간 창과 종탑에서 고딕풍 건축의 특징을 볼 수 있습니다. 이 건물에서는 예배뿐 아니라 배재학당과 이화학당의 행사, 연설회와 토론회, 결혼식과 장례식도 열렸습니다. 정동의 학생과 주민들이 여러 일로 드나들던 장소였어요.",
   "교회의 시작은 1885년 아펜젤러의 집에서 열린 성찬식으로 거슬러 올라갑니다. 처음에는 작은 집에서 모였고, 이후 한옥 예배처를 마련했습니다. 교인이 늘면서 새 건물을 짓게 되었죠. 1895년 공사를 시작해 1897년 12월 26일 지금의 자리에 벽돌 예배당을 봉헌했습니다. 오늘 볼 수 있는 건물은 이후 몇 차례 증축과 수리를 거친 모습입니다.",
   "초기 예배당 안에는 남녀를 구분하는 휘장이 쳐져 있었습니다. 배재학당 남학생과 이화학당 여학생, 남녀 교인들이 서로 다른 출입구로 들어와 따로 앉았다고 해요. 같은 예배에 참석하면서도 마주 보지 않도록 공간을 나눈 것입니다. 이 휘장은 1916년에 걷혔습니다. 옛 사진과 평면을 볼 때 출입구가 어디에 놓였는지 살펴보면 당시의 관습이 건물 사용에도 영향을 주었다는 사실을 이해할 수 있어요.",
   "1918년에는 파이프오르간이 설치됐습니다. 미주 지역 교포들의 모금이 힘을 보탰어요. 파이프오르간은 관에 공기를 보내 소리를 내는 악기입니다. 예배당은 성가와 서양음악을 접하는 장소가 되었고, 결혼식에도 사용됐습니다. 화가이자 작가인 나혜석과 김우영의 결혼식이 1920년 이곳에서 열렸어요. 당시 결혼사진 뒤쪽에 파이프오르간이 보입니다.",
   "같은 해 이 예배당에서는 유관순의 장례식도 치러졌습니다. 이화학당 학생이자 정동교회 교인이었던 유관순은 고향 천안에서 만세시위를 이끌었다가 수감되었고, 1920년 서대문형무소에서 숨졌어요. 10월 14일 교회에서 장례가 열렸습니다. 학교에 다니며 예배를 드리러 오던 학생이, 세상을 떠난 뒤 다시 이곳으로 돌아온 것입니다.",
   "교회 인물들도 3·1운동에 참여했습니다. 목사 이필주와 박동완이 민족대표 33인에 이름을 올렸고, 이필주의 사택에서는 기독교계 인사들이 모여 독립운동을 준비했어요. 교사와 학생, 교인들이 체포되면서 교회가 정상적으로 모이기 어려웠던 시기도 있었습니다. 가까운 배재학당과 이화학당, 교회의 사람들이 서로 알고 왕래하던 관계가 독립운동을 준비하고 참여하는 데에도 이어진 것이죠.",
   "한국전쟁 때는 예배당과 오르간이 큰 피해를 입었습니다. 이후 건물을 고쳐 사용했고, 오르간도 훗날 복원했습니다. 예배당 내부가 공개되는 때라면 오르간과 예배 공간을 살펴보시고, 입장이 어려우면 역사기념관의 사진과 자료로 옛 모습을 확인하실 수 있어요. 나혜석의 결혼사진과 유관순의 장례 기록은 같은 예배당을 전혀 다른 날에 찾았던 사람들의 사연을 구체적으로 전해줍니다."
  ]},
  {no:31, region:"center", type:"터/표지석", name:"석 동화약방 터(대한민국임시정부 서울연통부)", addr:"순화동 6-13", audio:"audio/31_동화약방터.mp3", script:[
   "이곳의 건물 이름은 ‘빌딩 1897’입니다. 건물에 붙은 숫자는 동화약방이 문을 연 해를 뜻해요. 국민 소화제 활명수로 유명한 동화약품의 출발지입니다. 이제 옛 약방 건물은 사라졌고, 2025년 같은 터에 동화약품의 새 사옥이 들어섰습니다.",
   "동화약방은 민강의 아버지 민병호가 만든 활명수를 바탕으로 시작됐습니다. 민강은 사업과 함께 교육에도 관심을 기울였어요. 1907년에는 서소문 밖에 소의학교를 세우고 교장을 맡았습니다. 이후 조선약학교 설립에도 참여했죠. 상동교회와 정동교회를 다니며 여러 인사와 관계를 맺었는데, 이런 만남은 독립운동을 위한 협력으로도 이어졌습니다.",
   "1919년 상하이에 대한민국임시정부가 수립되자 국내와 연락할 조직이 필요했습니다. 정부의 소식을 국내에 전하고, 국내 정보와 군자금을 상하이로 보내야 했으니까요. 그 일을 맡은 비밀 행정조직이 연통부입니다. 동화약방은 서울의 연락 거점이 되었고 민강이 이를 도왔습니다. 공개적으로 간판을 내걸 수 없는 조직이 일상적인 영업을 하는 약방을 통해 움직였던 것입니다.",
   "연락 거점이 마련되는 과정에는 교사와 학생도 등장합니다. 배재고등보통학교 교사 강매가 세브란스의학전문학교 학생 윤종석에게 동화약방을 소개했어요. 윤종석이 찾아와 제안하자 민강은 상하이에서 온 사람이 암호를 대면 윤종석과 만나게 해주겠다고 약속했습니다. 누가 와서 누구를 찾아야 하는지 정하고, 암호로 신원을 확인하는 구체적인 연락 절차가 있었던 거예요.",
   "문서를 받는 데에는 동화약방이 영업용 화물을 맡기던 공성운송점을 활용하기로 했습니다. 약방의 거래에 쓰이던 운송망으로 상하이에서 보내는 독립운동 문서를 받아 전달하려 했죠. 그러나 1919년 가을 만세운동을 준비하던 중 이 활동이 발각되었고, 민강은 체포됐습니다. 재판을 거쳐 수감생활을 했고, 건강이 나빠져 1922년 가출옥한 뒤 세브란스병원에 입원했습니다.",
   "민강 이후에도 이 회사의 경영에 참여한 사람들 가운데 독립운동가가 있었습니다. 윤창식은 조선산직장려계와 신간회 등에서 활동했고, 윤광열은 광복군에 참여했어요. 같은 회사의 역사에 등장하지만 활동한 조직과 시기는 서로 다릅니다. 서울연통부 기념비를 보게 되시면 이 가운데 민강의 역할을 먼저 확인해 보세요. 약방을 연락 장소로 내놓고, 사람과 문서가 오갈 방법을 마련했던 사람입니다.",
   "새 사옥에는 동화 1897라운지와 회사의 역사를 소개하는 공간이 마련됐습니다. 업무시설이므로 내부 관람은 안내를 확인한 뒤 이용하시면 됩니다. 오래된 약병이나 광고를 살펴볼 기회가 있다면 익숙한 제품의 출발과 민강의 활동을 연결해 보세요. 여기서 팔던 약을 다른 곳으로 보내던 거래망이, 독립운동가들의 만남과 문서 전달에 쓰일 수 있었던 구체적인 바탕이었습니다."
  ]},
  {no:32, region:"center", type:"건축물/전시관", name:"배재학당역사박물관(구 배재학당 동관)", addr:"서소문로11길 19", audio:"audio/32_배재학당역사박물관.mp3", script:[
   "붉은 벽돌과 돌로 장식한 출입구가 있는 이 건물은 배재학당의 옛 동관입니다. 머릿돌에는 1916이라는 연도가 남아 있어요. 학교는 1885년 아펜젤러가 세웠지만, 이 동관은 그가 세상을 떠난 뒤에 지은 건물입니다. 2008년 박물관으로 문을 열었고, 배재의 학교생활과 근대교육에 관한 자료를 소개하고 있습니다.",
   "미국 감리교 선교사 헨리 게르하트 아펜젤러는 조선에 들어온 뒤 학생들을 가르치기 시작했습니다. 배재라는 교명은 고종이 내린 이름으로, 쓸모 있는 인재를 기른다는 뜻을 담고 있어요. 박물관의 대표 유물 가운데 당시 현판이 있습니다. 현판의 글씨는 명필 정학교가 썼습니다. 새로운 학교가 왕실의 인정을 받았다는 사실을 이름과 현판으로 확인할 수 있습니다.",
   "학생들은 영어와 수학뿐 아니라 역사, 과학 등 여러 학문을 배웠습니다. 학교에서 사용한 책 가운데는 『중등 만국사』와 천문학, 광학, 식물학 교과서도 남아 있어요. 흥미로운 것은 이 책들을 배재학당 인쇄소에서 근로학생들이 직접 찍었다는 점입니다. 수업을 듣는 학생이 책을 만드는 일에도 참여했던 것이죠. 교과서 제목만 읽어보아도 당시 학교가 어떤 지식을 새로 가르치려 했는지 짐작할 수 있습니다.",
   "말하는 연습도 학교생활의 중요한 부분이었습니다. 1896년 학생들은 협성회를 조직하고 서재필의 지도 아래 토론을 했어요. 회의를 진행하는 규칙을 익히고, 정해진 주제에 찬성하거나 반대하는 근거를 제시했습니다. 다른 사람 앞에서 자신의 의견을 설명하는 훈련이었죠. 협성회는 나중에 일반인에게도 문을 열었고, 회원들은 거리에서 연설하기 위한 연단까지 마련했습니다. 학생들의 토론이 교실 밖으로 나온 것입니다.",
   "협성회보와 독립신문의 편집·교정에 참여한 주시경도 배재에서 공부했습니다. 졸업 후에는 교사로서 우리말을 연구하고 가르쳤어요. 박물관의 소장품에는 주시경의 친필 이력서가 있습니다. 교과서, 신문, 이력서를 함께 보면 그가 학교에서 배우고 일한 경험이 우리말 연구와 신문 제작으로 어떻게 이어졌는지 살펴볼 수 있습니다.",
   "시인 김소월도 배재에서 공부해 1923년에 졸업했습니다. 박물관에는 1925년에 나온 『진달래꽃』 초판본과 그가 재학 중 작품을 실었던 교지가 남아 있어요. 교지에는 시뿐 아니라 외국 문학을 번역한 글도 수록됐습니다. 독자에게는 완성된 시인의 이름으로 익숙한 김소월이, 이곳에서는 글을 쓰고 번역을 해보던 학생으로 등장합니다. 교과서로 공부하는 일과 자기 글을 발표하는 일이 같은 학교 안에서 이루어졌죠.",
   "아펜젤러의 친필 일기에도 학교의 구체적인 사정이 나옵니다. 학교 우물 사용을 두고 고종에게 올린 진정서, 수감 중인 이승만과 주고받은 편지 등이 포함되어 있어요. 학교를 세운 뒤에도 물을 쓰는 일부터 학생의 처지까지 챙겨야 했던 것입니다. 이 동관에서 보관하고 소개하는 현판과 책, 일기에는 새로운 교육제도를 마련하던 사람들의 실제 업무와 학교생활이 남아 있습니다."
  ]},
  {no:33, region:"center", type:"터/건축물", name:"옛 서울시립미술관(구 대법원·경성재판소)", addr:"덕수궁길 61", audio:"audio/33_서울시립미술관구대법원.mp3", script:[
   "서울시립미술관 서소문본관에 들어가기 전에 정면의 아치와 창을 잠시 살펴보세요. 이 앞부분은 미술관보다 먼저 있던 법원 청사의 모습을 남긴 것입니다. 지금의 전시실 대부분은 새로 지었고, 옛 건물의 정면부를 보존하거나 복원해 연결했습니다. 겉에서 보이는 법원 건축과 안쪽의 넓은 전시공간이 서로 다른 시기에 만들어진 것이죠.",
   "옛 청사는 1928년에 완공되었습니다. 조선고등법원, 경성복심법원, 경성지방법원이 이곳에 들어왔기 때문에 ‘경성 삼재판소’라고도 불렀어요. 한 건물에 서로 다른 심급의 법원이 모였던 것입니다. 당시 건물 안에는 검사장실과 검사실도 있었습니다. 식민지 조선의 재판과 기소를 담당하는 주요 기관이 이 자리를 사용했습니다.",
   "독립운동가도 이 사법체계의 법으로 처벌받았습니다. 예를 들어 안창호는 1932년 상하이에서 체포되어 국내로 압송된 뒤, 그해 경성지방법원에서 징역 4년을 선고받았습니다. 당시 경성지방법원이 이 청사를 쓰고 있었어요. 그의 수형 기록에는 죄목이 치안유지법 위반으로 적혀 있습니다. 나라의 독립을 위해 했던 활동이 식민지 법정에서는 처벌할 죄목이 된 것이죠.",
   "광복 뒤에는 대한민국 대법원 청사로 사용했습니다. 법원의 이름과 국가가 바뀌었어도 건물은 계속 쓰였죠. 청사에는 한 층을 더 올렸습니다. 1928년 사진에서는 3층이던 건물이 대법원 시절 사진에서는 4층으로 보이는 이유입니다. 여러 법원이 건물을 나누어 쓰면서 공간이 부족해졌고, 오래된 시설의 문제도 커졌습니다. 대법원은 1995년 서초동의 새 청사로 옮겨갔습니다.",
   "미술관을 만들 때는 옛 청사를 어떻게 남길지 결정해야 했습니다. 설계에서는 중앙 출입구와 중앙의 구조체를 보존하고, 양쪽 외벽은 해체한 뒤 다시 복원했습니다. 옛 돌을 다시 사용하고, 벽면의 색과 질감, 창 모양을 맞추었어요. 따라서 지금 정면의 모든 벽돌과 돌이 처음 자리 그대로 남은 것은 아닙니다. 남길 부분은 보존하고 다시 만들 부분은 실측과 자료를 바탕으로 복원한 건물입니다.",
   "안으로 들어가면 높은 중앙홀과 전시실로 이어지는 동선이 나옵니다. 법원 내부를 그대로 전시장으로 쓴 것이 아니라, 작품을 걸고 관람객이 이동할 수 있도록 새로 설계한 공간이에요. 중앙홀에는 위에서 자연광이 들어오게 했고, 전시실마다 크기와 높이, 조명 방식을 달리해 여러 종류의 작품을 전시할 수 있도록 구성했습니다. 앞에서 본 아치와 실내의 현대적인 공간이 다르게 느껴지는 데에는 이런 설계 과정이 있습니다.",
   "서울시립미술관은 2002년 이곳에 문을 열었고, 보존된 옛 법원 정면부는 2006년 등록문화유산이 되었습니다. 옛 청사 사진을 다시 보실 때는 중앙 출입구와 창의 줄, 층수를 차례로 비교해 보세요. 경성재판소에서 대법원으로 사용하면서 늘린 부분과, 미술관을 만들며 남긴 부분을 구별할 수 있습니다. 오늘 전시를 보러 지나온 입구가 어떤 건물의 일부였는지도 그 사진으로 확인하게 됩니다."
  ]},
  {no:34, region:"center", type:"터/표지석", name:"정미의병 발원 터", addr:"세종대로9길 42", audio:"audio/34_정미의병발원터.mp3", script:[
   "부영빌딩 앞 화단에 있는 표석은 ‘정미의병 발원 터’를 알리고 있습니다. 이곳에 옛 병영이 남아 있지는 않아요. 표석은 1907년 대한제국 군대가 해산될 때, 서울의 군인들이 일본군과 싸웠던 일대를 기억하기 위해 세운 것입니다. 정미는 1907년의 간지입니다. 그해 군대 해산에 저항한 군인들이 의병에 합류하면서 항쟁이 크게 확대되었습니다.",
   "군대 해산은 갑자기 벌어진 일이 아니었습니다. 1907년 여름 일본은 헤이그 특사 파견을 구실로 고종에게 퇴위를 강요했습니다. 이어 정미칠조약을 맺게 해 대한제국 정부의 인사와 행정을 통제했어요. 법령을 만들거나 고위 관리를 임명하는 일에도 일본 통감의 승인을 받도록 했죠. 여기에 딸린 각서에는 군대를 해산하는 방안이 들어 있었습니다.",
   "일본은 저항이 일어날 것에 대비해 병력을 더 보내도록 준비했습니다. 군대를 새롭게 정비한다는 명목을 내세웠지만, 실제로는 황실을 경호할 일부를 제외한 군대를 없애려는 조치였습니다. 8월 1일 서울 시위대의 해산이 진행됐어요. 시위대는 황실과 수도를 지키는 대한제국의 정규군이었습니다. 나라를 지키던 군인들에게 소속 부대와 무기를 내려놓으라는 명령이 내려진 것입니다.",
   "시위대 대대장 박승환은 군대 해산에 항의하며 스스로 목숨을 끊었습니다. 이를 전해 들은 병사들이 무기를 들고 일본군에 맞섰어요. 싸움은 서소문과 숭례문 일대의 거리로 이어졌습니다. 일본군의 공격을 끝내 막아내지는 못했지만, 해산에 저항한 군인들은 서울에서만 나온 것이 아니었습니다. 다음 날에는 원주의 군인들이 무기고를 장악했고, 강화의 군인들도 일본군과 싸웠습니다.",
   "부대를 떠난 군인들은 각지의 의병으로 들어갔습니다. 이미 의병항쟁을 벌이던 사람들에게 정규 군사훈련을 받은 병사들의 합류는 큰 도움이 됐어요. 무기를 다루고 부대를 움직여 싸운 경험을 가지고 있었기 때문입니다. 원주진위대 출신 민긍호 등이 의병부대를 이끌었고, 강화의 해산군인들도 경기도 의병의 주요 전력이 되었습니다.",
   "지역별로 싸우던 의병들은 서로 힘을 모으려 했습니다. 이인영과 허위 등을 중심으로 13도창의군이 조직되어 서울로 진격할 계획을 세웠죠. 1908년 초 허위가 이끈 선발대는 동대문 밖 30리 지점까지 접근했습니다. 그러나 후속부대가 모이기 전에 일본군의 공격을 받아 물러났고, 서울진공작전은 성공하지 못했습니다. 서울에서 밀려난 군인들이 의병의 일원이 되어 다시 수도로 들어오려 했던 것입니다.",
   "이후 일본군은 의병이 활동하는 마을을 불태우고 주민들까지 공격하는 방식으로 항쟁을 진압했습니다. 의병들은 지역에서 소규모로 싸우거나 국외로 옮겨 활동을 이어갔어요. 표석의 ‘발원’은 전국의 의병이 모두 이 한 장소에서 시작했다는 뜻으로 읽기보다, 군대 해산에 맞선 서울의 저항이 의병항쟁을 확대하는 중요한 계기였다는 뜻으로 이해하시면 좋겠습니다. 짧은 표석에 적힌 1907년의 사건 뒤로 원주와 강화, 서울진공작전의 이야기가 이어집니다."
  ]},
  {no:35, region:"center", type:"전시관", name:"손기정 기념관", addr:"손기정로 101-4", audio:"audio/35_손기정기념관.mp3", script:[
   "손기정기념관은 그가 다녔던 양정고등보통학교의 옛 건물을 활용해 만들었습니다. 2012년 문을 열었어요. 이 언덕에서 학교를 다니던 학생이 1936년 베를린 올림픽 마라톤 우승자가 되었습니다. 기념관은 어린 시절과 훈련, 올림픽 출전, 해방 뒤 지도자로 활동한 시기까지 소개합니다. 금메달뿐 아니라 사진과 신문, 우승 기념품마다 서로 다른 사연이 있습니다.",
   "1936년 베를린 올림픽에서 손기정은 마라톤 금메달을, 남승룡은 동메달을 땄습니다. 두 사람 모두 식민지 조선 출신이었지만 일본 대표로 출전했어요. 시상식 사진을 보면 유니폼의 가슴에 일장기가 붙어 있습니다. 경기에서 이겨도 자기 나라를 대표할 수 없는 상황이었죠. 사진 속 손기정이 들고 있는 작은 나무도 눈여겨보세요. 우승자에게 주어진 참나무 묘목입니다.",
   "그 사진이 신문에 실리면서 또 다른 사건이 벌어졌습니다. 동아일보와 조선중앙일보가 손기정의 가슴에 있는 일장기를 지운 사진을 보도한 것입니다. 일장기 말소사건이라고 부릅니다. 일본 당국은 관계자들을 조사하고 언론사를 탄압했어요. 우승 소식을 전하는 신문에서 선수의 국적 표시를 지웠다는 이유로 처벌이 이어졌습니다. 당시 신문 자료를 볼 때 선수의 얼굴뿐 아니라 가슴 부분을 확인해 보세요.",
   "우승자에게 주려던 기념품 중에는 고대 그리스의 청동 투구도 있었습니다. 그리스의 한 신문사가 마라톤 우승자에게 전달하려고 마련한 것이에요. 그러나 올림픽의 아마추어 규정 때문에 손기정에게 주지 못했고, 투구는 베를린의 박물관에 보관됐습니다. 그는 훗날 투구의 존재를 알게 된 뒤 돌려받기 위해 노력했습니다.",
   "투구가 손기정에게 돌아온 해는 1986년입니다. 우승하고 꼭 50년이 지난 뒤였어요. 손기정은 1994년 이를 국립중앙박물관에 기증했습니다. 이곳에서 투구의 사연을 접하더라도 원본을 소장한 곳은 용산의 국립중앙박물관이라는 점을 알아두시면 좋겠습니다. 당시 받은 금메달과 월계관, 뒤늦게 받은 청동 투구는 같은 우승과 관련된 물건이지만 그에게 전해진 시기는 달랐습니다.",
   "광복 뒤 손기정은 선수들을 지도했습니다. 1947년 보스턴 마라톤에서는 그가 훈련시킨 서윤복이 우승했어요. 베를린에서 함께 뛰었던 남승룡도 선수로 출전해 서윤복을 도왔습니다. 이번에는 손기정이 직접 결승선을 통과하는 대신 감독으로 제자의 경기를 지켜봤습니다. 일본 대표 유니폼을 입었던 두 선수가, 태극기를 달고 뛰는 후배를 키워 국제대회에 출전시킨 것입니다.",
   "기념관 밖 공원에는 손기정 월계관수가 자라고 있습니다. 이름에 월계관이 들어가지만 수종은 월계수가 아닌 대왕참나무예요. 베를린 시상식에서 우승 기념으로 받은 묘목을 모교에 가져와 심었습니다. 시상식 사진에서는 손으로 들 수 있던 작은 나무가 지금은 공원의 큰 나무가 되어 있는 것이죠. 사진의 묘목과 바깥 나무를 연결해 보시면, 손기정이 베를린에서 가져온 우승 기념품 하나를 바로 이 학교 터에서 만나게 됩니다."
  ]},
  {no:36, region:"center", type:"터/표지석", name:"3·1운동 만세시위 기념터(남대문역 전)", addr:"통일로 21 서울역 고객주차장 앞", audio:"audio/36_삼일운동만세시위기념터남대문역전.mp3", script:[
   "이 표석이 기념하는 날은 1919년 3월 5일입니다. 3·1운동이라고 하면 보통 3월 1일 탑골공원을 먼저 떠올리지만, 나흘 뒤에는 이곳 남대문역 앞에서 학생들이 큰 만세시위를 벌였어요. 지금의 서울역 일대입니다. 표석에 적힌 남대문역은 서울과 지방을 오가는 사람들이 모이는 곳이었죠. 이날 학생들은 역전에 집결한 뒤 주변 거리로 나아가 독립만세를 외쳤습니다.",
   "당시 서울의 전문학교 학생들은 이미 독자적인 독립운동을 준비하고 있었습니다. 연희전문학교와 보성법률상업학교, 경성의학전문학교 등의 학생들이 연락을 주고받았죠. 이후 종교계 인사들이 추진하던 독립선언에 합류하면서, 3월 1일에는 같은 날 행동하고 3월 5일에는 학생들이 다시 시위를 벌이기로 했습니다. 첫 시위에 참가했던 사람들이 붙잡혀 가는 상황에서도, 다음 행동을 준비한 겁니다.",
   "3월 4일에는 배재고등보통학교 기숙사에서 학생들이 만나 이튿날의 계획을 의논했습니다. 집결지는 남대문역 앞이었어요. 사흘 전인 3월 3일 고종의 국장이 치러졌고, 지방에서 올라왔다가 돌아가는 사람들이 역으로 모이고 있었습니다. 학생들은 학교 안을 벗어나 이 귀향객과 시민들을 만날 수 있었죠. 서울에서 벌어진 일을 각 지역의 사람들이 직접 보고 돌아갈 수 있는 장소이기도 했습니다.",
   "3월 5일 오전, 군중 앞에 인력거를 탄 두 학생이 나타납니다. 연희전문학교의 김원벽과 보성법률상업학교의 강기덕입니다. 두 사람은 ‘조선독립’이라고 쓴 깃발을 흔들며 사람들을 이끌었어요. 군중 속에서는 조선독립신문이 배포되었습니다. 사람들의 입으로 전하는 만세와 손에서 손으로 건네는 인쇄물이 같은 거리에서 퍼져 나갔습니다. 시위대는 역 앞에서 남대문 방향으로 움직였습니다.",
   "남대문 부근에서 경찰이 가로막았고, 김원벽과 강기덕도 체포되었습니다. 그러나 시위 참가자들은 곧바로 흩어져 집으로 돌아가지 않았어요. 경찰의 저지를 뚫은 대열은 남대문시장과 조선은행 앞을 지나 보신각 부근까지 나아갔습니다. 오늘의 지도로 옮겨 보면 서울역 주변에서 남대문시장, 한국은행 본관 부근을 거쳐 종로로 이어지는 길입니다. 역 앞의 시위가 도심 여러 거리로 번졌다는 것을 알 수 있죠.",
   "시위가 일어난 1919년에는 지금의 돔 지붕 건물보다 작은 남대문역사가 있었습니다. 철도 이용객이 늘면서 1925년에 새 경성역사가 들어섰고, 그 건물이 오늘의 문화역서울284로 남았어요. 역 이름과 건물은 바뀌었지만 철도를 이용하는 사람들이 모이는 장소라는 점은 이어졌습니다. 옛 역전 사진을 보면 오늘의 큰 역사와는 사뭇 다른 규모의 역 앞에 군중이 모였다는 것을 알 수 있습니다.",
   "통일로변에서 찾는 이 표석은 남대문역전 시위를, 길 건너 다른 표석은 세브란스병원과 3·1운동의 관계를 기념합니다. 이 일대의 학교와 병원, 역 주변에 독립운동에 참여한 사람들의 활동이 남아 있는 거예요. 3월 5일의 학생들은 종교계 지도자들의 독립선언에 참여하는 데서 더 나아가 직접 다음 시위를 조직했습니다. 붙잡혀 갈 위험을 알면서도 다시 모였고, 역을 이용하던 시민과 귀향객들이 그 대열에 참여했던거예요."
  ]},
  {no:37, region:"center", type:"터/건축물", name:"문화역서울284(구 경성역)", addr:"청파로 1", audio:"audio/37_문화역서울284구경성역.mp3", script:[
   "붉은 벽돌 벽면 위로 돔이 솟아 있는 이 건물은 1925년에 문을 연 경성역사입니다. 해방 뒤에는 서울역으로 쓰였고, 지금은 전시와 문화행사가 열리는 문화역서울284가 되었어요. 정면에서 중앙의 돔과 양옆으로 길게 뻗은 건물을 살펴보세요. 가운데 높은 부분을 중심으로 양쪽 날개가 펼쳐진 모양입니다. 수많은 승객을 맞아들였던 이 건물에는 등급별 대합실과 귀빈실, 식당까지 갖추어져 있었습니다.",
   "이 일대에 역이 처음 들어선 때는 1900년입니다. 당시 이름은 남대문역이었어요. 1919년 3월 5일 학생들이 만세시위를 벌이고, 그해 9월 강우규가 총독을 향해 폭탄을 던졌을 때는 작은 남대문역사가 있었습니다. 철도 노선과 이용객이 늘면서 더 큰 역사가 필요해졌고, 1925년에는 지금 보는 새 건물이 문을 열었죠. 광장 주변의 만세시위 표석과 강우규 동상은 새 역사가 들어서기 전의 사건을 기념합니다.",
   "경성역을 지나는 철도는 부산과 신의주를 잇고, 바다 건너 일본과 만주로 연결되는 교통망의 일부였습니다. 일반 승객과 생활 물자가 오갔지만, 일본의 식민 통치와 대륙 침략에 필요한 군인과 물자도 철도로 이동했죠. 역의 큰 규모는 이런 철도망이 확대되던 때에 만들어졌습니다. 건축을 볼 때는 서양식 외관을 감상하는 것과 더불어, 이 철도를 누가 운영했고 어떤 목적으로 사용했는지도 살펴볼 필요가 있습니다.",
   "실내가 공개되어 있다면 중앙홀에서 각 방으로 이어지는 길을 따라가 보세요. 1·2등 대합실과 3등 대합실, 부인대합실, 귀빈실이 따로 있었습니다. 승객이 가진 표의 등급이나 이용 대상에 따라 기다리는 장소가 달랐던 거예요. 오늘의 전시실 이름에도 옛 용도가 남아 있습니다. 열차 시간까지 기다리던 승객, 특별한 대우를 받던 귀빈, 역에서 식사하던 손님이 서로 다른 방을 사용했습니다.",
   "2층에서 특히 기억할 곳은 양식당 ‘그릴’입니다. 1925년 경성역이 문을 열 때 같이 개장했어요. 열차 이용객뿐 아니라 서양 음식을 즐기려는 사람들도 찾아왔습니다. 이곳 소장품으로 남은 1930년대 식기를 보면 손잡이에 남만주철도주식회사의 휘장이 새겨져 있어요. 나무 쟁반 바닥에도 회사 이름이 새겨져 있습니다. 식탁 위의 작은 물건에도 이 역과 철도회사의 관계가 남아 있는 겁니다.",
   "남만주철도주식회사는 1917년부터 1925년까지 조선의 국유철도 운영을 맡았던 회사입니다. 새 경성역 건설도 이 회사가 운영을 맡던 시기에 추진되었어요. 그릴은 총독부 관료와 새로운 유행을 즐기던 모던보이, 모던걸 등이 찾았습니다. 3등 대합실에서 기차를 기다리는 사람과 양식당에서 식사하는 사람은 같은 역을 전혀 다르게 이용했겠죠. 대합실과 식당을 나누어 둔 건물의 구성에서 그 차이를 살펴볼 수 있습니다.",
   "해방 이후 이 건물은 서울역으로 불렸습니다. 한국전쟁 때 훼손되었다가 복구되었고, 이후에는 고향을 떠나 일자리와 학교를 찾아 서울로 오는 사람들이 이용했어요. 2004년 새 역사가 문을 열면서 열차역으로서의 역할을 마쳤습니다. 2009년부터 복원공사를 거쳐 2011년에 문화역서울284로 다시 문을 열었죠. 이름의 284는 이 건물의 옛 사적 지정번호에서 가져왔습니다.",
   "지금은 중앙홀과 옛 대합실, 그릴에 미술작품이 놓이고 공연이 열립니다. 전시실로 만든 방을 차례로 지나면서 안내판의 옛 이름을 찾아보세요. 대합실에서 출발해 식당에 이르기까지, 큰 역 하나를 운영하는 데 얼마나 다양한 방이 필요했는지 보입니다. 전시 교체로 실내가 닫힌 날에는 공식 온라인 공간투어에서도 각 방의 모습을 살펴볼 수 있습니다."
  ]},
  {no:38, region:"center", type:"터/기념물", name:"강우규 의사 항일의거 터", addr:"통일로 1 문화역서울 앞 광장", audio:"audio/38_강우규의사항일의거터.mp3", script:[
   "서울역 광장에 서 있는 강우규 의사의 동상입니다. 한복을 입고 한쪽 팔을 들어 올린 모습을 보세요. 1919년 9월 2일, 신임 조선총독 사이토 마코토를 향해 폭탄을 던진 행동을 표현했습니다. 당시 강우규는 예순이 넘은 나이였어요. 의거가 일어난 역 이름은 남대문역이었습니다. 그때는 작은 남대문역사가 있었고, 뒤편의 돔 지붕 건물은 여섯 해 뒤인 1925년에 세워졌습니다.",
   "강우규는 평안도 덕천에서 태어나 한방 의술을 익혔습니다. 함경도 홍원에서는 한약방과 잡화점을 운영하며 재산을 모았고, 그 돈을 교육에 썼어요. 1908년에는 영명학교를 세웠습니다. 나라를 빼앗긴 뒤 만주로 망명해서도 동포들이 정착할 마을을 개척하고 광동학교를 열었죠. 학교를 세우고 아이들을 가르치는 일이 의거 이전 그의 중요한 활동이었습니다.",
   "1919년에는 대한국민노인동맹단에 참여했습니다. 청년들의 독립운동을 지원하기 위해 만주와 연해주의 나이 든 동포들이 조직한 단체였어요. 그해 3·1운동 뒤 일본은 조선총독을 바꾸고 이른바 문화통치를 내세웠습니다. 강우규는 새 총독이 온다는 소식을 듣고 그를 처단할 계획을 세웠죠. 서울에 들어온 뒤에는 신문에 실린 사이토의 사진을 가지고 다니며 얼굴을 익혔고, 역 근처로 숙소를 옮겨 주변을 살폈습니다.",
   "9월 2일 오후, 사이토를 태운 열차가 남대문역에 도착했습니다. 역에는 신임 총독을 맞으려는 사람들과 경비 인력이 모여 있었어요. 사이토가 환영 절차를 마치고 마차에 오를 무렵, 강우규가 폭탄을 던졌습니다. 폭탄은 총독을 죽이지 못했습니다. 그러나 주변에 있던 경찰과 신문기자, 철도 관계자들이 다쳤고, 부상자 가운데는 뒤에 숨진 사람도 있었습니다.",
   "강우규는 현장에서 곧바로 체포되지 않았습니다. 자리를 벗어난 뒤 서울의 여러 집을 옮겨 다니며 숨어 있었고, 이신애를 비롯한 동지들이 이를 도왔어요. 경찰에 붙잡힌 날은 9월 17일입니다. 체포 뒤에는 그를 숨겨 주거나 거사를 도운 사람들도 수사를 받고 처벌되었습니다. 동상에는 한 사람만 표현되어 있지만, 의거를 준비하고 이후 몸을 피하는 과정에는 여러 사람의 도움이 있었습니다.",
   "1920년 재판에서 사형이 선고되자 강우규는 항소했습니다. 항소한 데에도 사연이 있어요. 자신을 도운 최자남을 변호하려 했던 겁니다. 판결은 바뀌지 않았고, 11월 29일 서대문형무소에서 사형이 집행되었어요. 1919년 9월의 의거와 1920년 11월의 순국 사이에는 체포와 재판, 옥중에서 보낸 시간이 있었습니다. 기단의 연보에는 의거에서 순국까지의 경과가 정리되어 있습니다.",
   "동상 아래에는 강우규가 마지막으로 남긴 시도 새겨져 있습니다. 나라를 잃은 처지를 표현한 짧은 글입니다. 들어 올린 팔을 본 다음 기단의 글까지 읽으면, 이 기념물이 의거와 순국을 어떤 방식으로 기리는지 알 수 있어요. 교육에 재산을 쓰던 사람, 해외 동포사회를 꾸리던 사람, 서울로 돌아와 총독을 겨냥했던 사람이 모두 강우규입니다. 이곳에서는 그 생애의 마지막 부분인 남대문역 의거를 기념하고 있습니다."
  ]},
  {no:39, region:"center", type:"건축물/표지석", name:"경성부민관 폭탄 의거지", addr:"세종대로 125 서울시의회", audio:"audio/39_경성부민관폭탄의거지.mp3", script:[
   "서울특별시의회 본관의 탑을 올려다보면 시계가 보입니다. 건물은 1935년에 경성부민관으로 지어졌고, 당시에도 탑에 시계가 있었어요. 시계는 1970년대에 사라졌다가 옛 설계도와 자료를 확인해 2023년에 복원했습니다. 정문 부근의 ‘부민관 폭파 의거 터’ 표석도 찾아보세요. 오늘은 이 건물에서 광복 직전에 일어난 사건과 그 일을 준비한 세 청년을 살펴보겠습니다.",
   "부민관에는 크기가 다른 강당과 사교실 등이 있었습니다. 대강당은 약 2천 명을 수용했고 연극과 음악, 무용 공연이 열렸어요. 많은 사람을 모을 수 있는 이 시설은 전쟁 참여를 독려하는 집회에도 사용되었습니다. 공연장이던 곳에서 조선 청년들에게 일본의 전쟁에 나가라고 요구하는 연설이 이어진 겁니다. 1945년 여름에도 그런 행사가 준비되고 있었습니다.",
   "7월 24일 열린 집회의 이름은 ‘아시아민족분격대회’였습니다. 친일 인사 박춘금이 만든 대의당이 주도했어요. 일본의 패전이 가까워진 때에도 조선인을 전쟁에 동원하려는 집회였습니다. 이 행사를 저지하려 한 사람들이 유만수, 조문기, 강윤국입니다. 세 사람은 일본강관주식회사에서 일하며 인연을 맺었습니다. 노동 현장에서 알게 된 청년들이 귀국한 뒤 다시 만나 항일 활동을 시작한 것이죠.",
   "이들이 조직한 단체는 대한애국청년당입니다. 1945년 봄 결성되어 친일 인사와 식민 통치 책임자를 공격할 계획을 세웠고, 그중 박춘금을 주요 대상으로 삼았습니다. 광복회의 기록에 따르면 유만수는 폭약을 구하기 위해 발파작업장에 취직하기도 했어요. 장사동의 하숙방은 준비 거점으로 이용했습니다. 세 청년의 의거는 행사 소식을 듣고 즉석에서 벌인 일이 아니라, 필요한 물품과 장소를 마련해 실행한 계획이었습니다.",
   "의거 당일 세 사람은 부민관으로 들어가 폭탄을 설치했고, 폭발로 대회장이 큰 혼란에 빠졌습니다. 박춘금을 처단하려던 목적은 이루지 못했어요. 세 사람은 경찰을 피해 숨었고, 체포되지 않은 채 광복을 맞았습니다. 의거에서 광복까지는 22일이 남아 있었습니다. 지금은 그 짧은 간격을 알지만, 당시 준비하던 청년들은 언제 식민 지배가 끝날지 알지 못했습니다.",
   "해방 뒤에는 이 건물의 용도가 여러 차례 바뀌었습니다. 국립극장 등으로 사용되다가 1954년 국회의사당이 되었고, 1975년 국회가 여의도로 옮겨갈 때까지 국회의 회의가 열렸어요. 이후 세종문화회관 별관을 거쳐 1991년부터 서울시의회 본관으로 쓰이고 있습니다. 옛 사진에 ‘국회의사당’이라고 쓰인 건물이 지금의 시의회와 같은 건물인 이유입니다. 이름이 바뀔 때마다 큰 강당을 사용하는 사람과 회의의 내용도 달라졌죠.",
   "밖에서 관찰할 수 있는 탑과 표석은 서로 다른 사실을 알려줍니다. 탑은 1930년대 공공회관 건축의 모습을, 표석은 1945년 7월 24일 이 안에서 벌어진 일을 설명해 줍니다. 현재 본관은 업무와 회의가 열리는 청사라 개인 관광객이 자유롭게 실내를 둘러보는 시설은 아니에요. 공개 보도에서 표석의 날짜와 세 사람의 이름을 확인하고 건물 외관을 살펴보시면 됩니다."
  ]},
  {no:40, region:"center", type:"터/건축물", name:"황궁우(환구단 터)", addr:"소공로 112", audio:"audio/40_황궁우환구단터.mp3", script:[
   "웨스틴 조선 호텔 영역에 있는 이 팔각형 건물은 대한제국의 흔적입니다. 기와지붕이 세 겹으로 올라가 있는 건축으로, 황궁우라고 합니다. 하늘에 제사를 지내던 환구단의 부속 건물로, 제사에 모시는 신위판을 보관했어요. 제사는 별도로 마련된 둥근 본단인 환구단에서 올렸습니다. 그 제단은 사라졌고, 황궁우와 돌북, 문 등 일부 시설이 남아 있습니다.",
   "1897년 고종은 러시아공사관에서 경운궁, 지금의 덕수궁으로 돌아왔습니다. 같은 해 황제에 오르기 위해 궁궐 가까운 이곳에 환구단을 마련했어요. 이 터에는 중국 사신을 맞이하던 남별궁이 있었습니다. 중국과의 외교 의례에 쓰던 곳을 대한제국 황제의 제사 장소로 바꾼 겁니다. 새 제단에서 10월 12일 하늘에 고하는 의식과 황제 즉위식이 거행되었습니다.",
   "동아시아의 전통적인 예법에서는 황제가 하늘에 제사를 올렸습니다. 고종이 황제의 칭호를 쓰고 환구단을 갖춘 것은, 다른 나라의 간섭을 받지 않는 황제국임을 드러내려는 조치였죠. 제단은 돌을 쌓아 둥글게 만들었습니다. 하늘은 둥글고 땅은 네모지다고 보는 천원지방 사상에 따라 안쪽 담은 원형으로, 바깥 담은 사각형으로 둘렀어요. 지금 남은 건물만 보아서는 알기 어려운 모양이니 옛 사진에서 둥근 제단을 찾아보면 좋습니다.",
   "황궁우는 1899년에 세워졌습니다. 건물의 여덟 면과 위로 포개진 지붕, 아래의 돌 기단을 외부에서 살펴보세요. 제사를 올리는 제단과 신위를 모시는 건물을 따로 두어 각기 용도를 나눈 것입니다. 왕실 건축을 맡았던 도편수 심의석은 환구단 조성에 참여했습니다. 황제의 즉위 의식을 먼저 치른 뒤에도 건물과 제례 시설을 보완하며 국가 의례를 지속할 장소로 갖추어 갔습니다.",
   "주변에는 북 모양으로 다듬은 돌 세 개가 있습니다. ‘석고’라고 부르는 기념물로, 1902년 고종 즉위 40주년을 기념해 만들었어요. 조선의 왕으로 즉위한 때부터 세어 40년을 맞은 해였습니다. 둥근 북의 형태와 표면에 새겨진 용을 살펴보세요. 용은 황제의 권위를 나타내는 데 사용되었습니다. 돌북의 몸체에 용을 새겨 황제의 긴 재위를 기념했습니다.",
   "1910년 일본에 나라가 병합된 뒤 환구단도 훼손되었습니다. 1913년 중심 제단이 철거되었고, 이듬해 그 자리에 조선경성철도호텔이 들어섰어요. 옛 사진에서 황궁우와 제단이 나란히 있던 배치를 확인한 뒤 오늘의 호텔과 비교하면, 사라진 시설이 어느 정도였는지 이해할 수 있습니다.",
   "시청광장 쪽의 환구단 정문은 원래 자리가 아닌 곳에 있는데, 여기에는 우여곡절이 있습니다. 지금 환구단의 정문은 일제강점기 헐리고 팔려나가 서울 강북구 우이동의 옛 그린파크호텔의 문으로 쓰이고 있었어요. 시간이 흘러 문을 철거하기 위해 조사하는 과정에서 환구단의 옛 문임이 확인되었고, 2009년에 이곳으로 옮겨 복원하게 되었습니다. 원래 정문 자리에는 이미 호텔이 들어서 있었기 때문에 본래 자리에서 어긋난 곳에 놓아야만 했어요. 황궁우, 석고, 돌아온 정문을 차례로 살펴보며 옛 모습을 상상해보세요. 남아있는 것은 많지 않지만, 절박한 심정으로 대한제국을 선포했던 마지막 왕이자 첫 황제인 고종의 마음을 기억해봅니다."
  ]},
  {no:41, region:"center", type:"터/기념물", name:"나석주 의사 의거 터(동양척식주식회사 터)", addr:"을지로 66 하나은행 본점 앞", audio:"audio/41_나석주의사의거터동양척식주식회사.mp3", script:[
   "을지로입구역 5번 출구에서 120m, 하나금융그룹 명동사옥 앞에 나석주 의사의 동상과 의거터 표석이 있습니다. 이 자리에 동양척식주식회사, 줄여서 동척의 경성 본점이 있었고, 1917년 본점이 도쿄로 옮겨 간 뒤에는 1945년까지 경성지점이 있었습니다. 동상 앞에서 남대문로 건너편을 보면 롯데백화점 본점이 보입니다. 그곳이 1926년 나석주가 먼저 폭탄을 던진 조선식산은행 본점 터입니다. 두 건물은 큰길 하나를 사이에 두고 마주 보고 있었고, 조선은행(지금의 한국은행 화폐박물관)까지 모여 있던 이 거리는 식민지 조선의 금융 중심가였습니다. 100년이 지난 지금도 은행 본점들이 서 있는 이 리에 나석주가 고른 목표가 있었습니다.",
   "동척은 1908년 12월 28일 도쿄에서 창립총회를 열고 이듬해 1월 경성 본점에서 업무를 시작한 국책회사입니다. 일본과 대한제국 두 나라가 함께 세운 회사라는 틀을 갖췄지만 설립 과정의 결정은 모두 일본 쪽에서 내렸고, 대한제국 정부는 자본금 1,000만 원의 30%를 현금 대신 땅으로 냈습니다. 논 1만 2,500정보를 포함해 약 1만 7,700정보, 175㎢로 지금 서울시 면적의 29%에 해당하는 넓이입니다(1정보는 약 3,000평, 1ha). 회사는 1909년부터 땅을 더 사들여 1913년 말에 6만 4,800정보를 넘겼고, 논밭만 따져도 1921년에는 7만 3,000정보로 서울시 전체보다 넓었습니다. 이 땅을 부치는 소작농은 1918년 무렵 15만 명에 이르렀습니다.",
   "동척의 첫 사업 목표는 일본 농민을 조선으로 옮겨 오는 일이었습니다. 1911년부터 1927년까지 17차례 이주민을 모집해 동척 땅을 나눠 주었고, 그 땅을 갈던 조선 농민은 경작권을 잃었습니다. 300만 명을 옮기겠다던 계획은 약 4,000호, 1만 명에 그쳤지만, 1917년 금융회사로 성격을 바꾼 뒤에도 조선의 논밭에서 거두는 소작료는 회사 수익의 큰 몫을 차지했습니다.",
   "나석주는 1892년 황해도 재령군 북률면의 농가에서 태어났습니다. 나무리벌이라 불리는 재령평야의 이 땅은 조선시대 왕실 궁방의 소유였고, 농민들은 수확의 3분의 1 정도를 도조로 내며 대대로 농사를 지었습니다. 통감부 시기에 국유지로 편입된 이 땅은 1908년 동척이 설립될 때 대한제국 정부 출자분이라는 이름으로 1,235정보가 회사에 넘어가 북률 동척농장이 되었습니다. 소작료는 수확의 절반으로 오르고 소작 기간은 3년으로 묶였다고 농민들은 호소했습니다. 1924년 가을부터 이듬해 봄까지 북률 동척농장 소작농들은 소작료 인상에 맞서 쟁의를 벌였고, 그 무렵 농장은 2,300정보까지 넓어져 있었습니다. 나석주가 태어난 북률면이 바로 이 농장이 있던 곳입니다.",
   "그는 고향의 보명학교를 거쳐 김구가 가르치던 안악의 양산학교에 다녔고, 김구는 백범일지에서 그를 제자이자 동지로 적었습니다. 1919년 3·1운동 때 겸이포 만세시위에 참여한 뒤 황해도에서 결사대를 꾸려 임시정부에 보낼 자금을 모으고 밀정 3명을 처단하다가, 경찰의 추적이 좁혀오자 1920년 중국으로 망명했습니다. 상하이에서는 경무국장 김구 아래에서 임시정부를 지키는 경호원으로 일했고, 중국 군사학교를 거쳐 중국군에서 복무한 뒤 1924년 상하이로 돌아왔습니다. 의열단에 들어간 것도 이 무렵입니다. 백범일지에는 김구의 생일에 나석주가 자기 옷을 전당 잡혀 고기와 반찬거리를 사 왔고, 그가 순국한 뒤 김구는 다시는 생일을 지내지 않기로 했다는 이야기가 실려 있습니다.",
   "국내에서 폭탄을 터뜨리겠다는 계획은 1924년부터 그의 편지에 나타납니다. 김구와 동지 이승춘 등에게 보낸 편지 여러 통이 남아 있는데, 1925년 톈진에서 배를 사서 동지들과 함께 들어가려던 계획과 돈이 모자라 미뤄지던 사정이 적혀 있습니다. 고향 동지에게 보낸 편지에서는 고향을 떠난 지 6년이 넘도록 이룬 것 없이 지낸다며 스스로를 죄인이라 불렀습니다.",
   "계획이 실행 단계로 들어간 것은 1926년입니다. 1919년 파리장서운동을 이끈 유림 대표 김창숙은 1925년 국내에 몰래 들어와 독립운동 기지를 세울 자금을 모았지만 모금이 뜻대로 되지 않자, 그 돈으로 일제의 핵심 기관을 치기로 방향을 바꿨습니다. 상하이로 돌아온 김창숙이 김구와 상의하자 김구는 나석주와 이화익을 추천했고, 1926년 6월 김창숙은 김구의 소개 편지를 들고 톈진에서 나석주를 만났습니다. 김창숙이 모금한 돈으로 폭탄 두 개와 권총을 마련했고, 의열단과 임시정부 쪽 동지들이 준비를 도왔습니다. 임시정부의 김구, 유림의 김창숙, 의열단의 김원봉, 세 갈래의 독립운동이 한 사람의 의거로 모였습니다.",
   "목표는 처음부터 동척과 식산은행이었습니다. 의열단은 1919년 11월 지린에서 결성될 때 파괴할 곳 다섯을 정했는데 조선총독부, 동양척식주식회사, 매일신보사, 각 경찰서, 그 밖의 일제 중요기관이었습니다. 경제 기관으로는 동척 하나가 이름을 올렸습니다. 1918년 세워진 조선식산은행은 식민지 산업에 돈을 대는 특수은행이었고, 1926년 총독부가 산미증식계획을 다시 짜면서 토지개량 사업 자금은 동척과 식산은행이 절반씩 대도록 정해졌습니다. 나석주가 고른 두 곳은 그해 식민지 농업정책의 돈줄 두 곳이었습니다. 일제도 그를 경계하고 있었습니다. 의거 한 달여 전인 1926년 11월 7일 동아일보에는 나석주의 국내 잠입설이 헛소문으로 밝혀졌다는 기사가 실렸습니다. 그때 그는 산둥반도의 웨이하이에 머물고 있었습니다.",
   "12월 24일 나석주는 산둥 출신 중국인 마중덕이라는 이름으로 혼자 배에 올라 인천으로 들어왔고, 남대문 부근의 중국인 여관에 묵었습니다. 28일 오후 2시 무렵 그는 중국인 행세를 하며 남대문통의 조선식산은행에 들어가 대부계 철책 너머로 폭탄을 던졌습니다. 곧장 큰길을 건너 동척 경성지점으로 들어가 직원들에게 권총을 쏘고 두 번째 폭탄을 던졌습니다. 폭탄은 두 개 모두 불발이었습니다. 그는 바로 옆 조선철도회사까지 들어가 총을 쏜 뒤 황금정, 지금의 을지로로 나왔고 뒤쫓는 경찰과 총격전을 벌였습니다. 동척 직원, 조선철도회사 직원, 추격하던 경찰 간부 3명이 숨지고 4명이 다쳤습니다. 총소리에 몸을 숨기는 사람들을 향해 \"2천만 민중아, 분투하여 쉬지 말아라\"라고 외친 그는 권총으로 자기 가슴을 쏘았습니다. 병원으로 옮겨져 잠시 정신이 들었을 때 경찰 심문에 황해도 재령의 나석주이며 의열단원이라는 사실만 밝히고 네 시간 뒤 숨졌습니다. 만 서른네 살이었습니다.",
   "총독부는 보도를 막았습니다. 일본 신문들은 바로 크게 다뤘지만 조선 안의 신문에는 두 주일 동안 한 줄도 실리지 못했고, 해가 바뀐 1927년 1월 중순에야 동아일보가 호외를 내 사건을 알렸습니다. 그 호외도 배포가 금지되어 다시 찍어야 했습니다. 시신을 찾으러 서울에 온 장남은 오히려 여드레 동안 경찰에 붙잡혀 있었습니다. 1920년대에 의열단이 벌인 폭탄 투쟁은 이 의거가 마지막이었습니다.",
   "동척은 1945년 일본 패전 뒤 9월 30일 폐쇄기관으로 지정되어 해체되었습니다. 38선 이남의 동척 재산은 미군정이 세운 신한공사가 관리하다가 1948년 중앙토지행정처로 넘어가 그 땅을 부치던 농민에게 분배되었고, 나머지 농지는 1950년 농지개혁으로 정리되었습니다. 건물도 남지 않았습니다. 동척 경성지점 건물은 해방 뒤 내무부 청사로 쓰이다가 외환은행이 자리를 사들인 뒤 1970년대 초에 헐렸고(확인 필요), 1980년 그 자리에 외환은행 본점이 준공되었습니다. 2015년 외환은행이 하나은행과 합쳐지면서 지금은 하나금융그룹 명동사옥으로 불립니다. 전국에 있던 동척 지점 가운데 건물이 남은 곳은 부산, 목포, 대전 세 곳으로, 부산과 목포는 근대역사관, 대전은 전시와 공연 공간으로 쓰이고 있습니다. 서울의 동척 터에는 1999년 11월 17일 순국선열의 날에 김상옥·나석주의사기념사업회가 세운 높이 2.3m의 동상과 의거터 표석이 서 있습니다.",
   "의거일 12월 28일은 1908년 동척 창립총회가 열린 날과 같은 날로, 창립 18주년이 되는 날이었습니다. 일부러 맞춘 날짜인지는 알 수 없습니다. 나석주가 상하이에서 쓴 편지들은 국가등록문화유산으로 지정되어 2024년 국립중앙박물관에서 처음 전시되었습니다. 김구에게 보낸 편지에는 일제의 기관을 목표로 삼았으며 조국에서 제 몫을 하고 죽겠다는 뜻이 적혀 있습니다."
  ]},
  {no:42, region:"center", type:"터/표지석", name:"이재명 의사 의거 터", addr:"명동길 80 가톨릭회관 앞", audio:"audio/42_이재명의사의거터.mp3", script:[
   "명동성당 입구 부근 보도에 이재명 의사의 의거를 기념하는 표석이 있습니다. 표석에 적힌 날짜는 1909년 12월 22일이에요. 이날 스물두 살의 이재명은 성당에서 나오던 내각총리대신 이완용을 공격했습니다. 성당 쪽으로 오르는 길과 길가의 표석을 같이 살펴보세요. 그날의 사건도 예배당 안에서 시작된 행사와, 행사장을 떠나는 사람들의 이동이 만나는 이 거리에서 일어났습니다.",
   "당시 명동성당은 종현천주교당이라고 불렸습니다. 세상을 떠난 벨기에 국왕 레오폴드 2세의 추도식이 열렸고 이완용이 여기에 참석했어요. 이완용은 1905년 을사늑약 체결에 가담했고, 일본이 대한제국의 주권을 빼앗는 과정에 협력하던 최고위 관료였습니다. 아직 강제병합 전이었지만 외교권은 이미 빼앗긴 뒤였고, 고종의 강제 퇴위와 군대 해산까지 이어진 상황이었습니다.",
   "이재명은 평양에서 학교를 다니다가 노동이민 모집에 응해 1905년 하와이로 건너갔습니다. 농장에서 일한 뒤 이듬해 미국 본토로 옮겼고, 한인 단체인 공립협회에 가입했어요. 공립협회는 안창호 등이 조직해 신문을 발행하고 국권 회복 운동을 벌이던 단체입니다. 해외에 살던 청년은 그곳에서 국내 소식을 접하고 독립운동에 참여했습니다. 1907년 고종이 강제로 퇴위한 뒤에는 친일 인사를 처단하는 계획에 자원해 귀국했습니다.",
   "귀국한 이재명은 평양의 동지들과 실행 계획을 의논했습니다. 1909년 말에는 이완용과 일진회 회장 이용구를 공격할 계획을 세웠고, 사람마다 실행과 자금 마련 등의 일을 나누어 맡았어요. 이완용이 성당의 추도식에 온다는 소식을 입수하자 이재명은 성당 앞에서 귀로를 기다렸습니다. 군밤장수로 변장해 접근 기회를 기다렸다는 이야기도 전해집니다. 서울에 온 뒤 목표 인물의 움직임을 살피며 기회를 찾은 겁니다.",
   "추도식이 끝나고 이완용이 인력거로 이동하려 할 때 이재명이 단도로 공격했습니다. 이완용은 여러 곳을 다쳤지만 살아남았어요. 이재명도 호위 경찰에게 부상을 입고 현장에서 체포되었습니다. 이 과정에서 인력거꾼 박원문이 칼에 찔려 숨졌습니다. 박원문의 죽음은 이후 재판에서도 다루어졌고, 판결문에 그의 이름과 사건 경과가 남았습니다.",
   "이재명은 법정에서 자신의 행동이 국권을 회복하려는 목적이었다고 밝혔습니다. 동지들에게 책임이 돌아가지 않도록 그들의 무죄를 주장했어요. 1910년 5월 사형이 선고되었고, 이후 재판에서도 판결은 바뀌지 않았습니다. 8월에는 일본의 강제병합이 이루어졌고, 이재명은 그로부터 한 달 뒤인 9월 30일 형이 집행되어 순국했습니다. 그가 공격을 준비하던 대한제국은 재판을 받는 사이에 국권을 완전히 빼앗겼습니다.",
   "표석을 다시 보면 의거 날짜와 이재명의 이름이 짧게 정리되어 있습니다. 그 작은 기록 뒤에는 평양에서 하와이와 미국 본토로 건너갔다 돌아온 청년의 행적이 있어요. 국권을 빼앗는 과정에 협력한 대신을 겨냥했고, 뜻을 이루지 못한 채 체포되어 재판을 받았습니다."
  ]},
  {no:43, region:"center", type:"건축물", name:"신세계백화점 본점(구 미츠코시백화점 경성점)", addr:"소공로 63", audio:"audio/43_신세계백화점본점구미츠코시백화점경성점.mp3", script:[
   "신세계백화점 본점의 오래된 본관은 1930년에 미쓰코시백화점 경성점으로 문을 열었습니다. 지금은 ‘더 리저브’라는 이름으로 안내되는 건물이에요. 길 건너 안전한 보도에서 정면을 보면 석재로 마감한 벽과 일정한 간격으로 늘어선 창들이 보입니다. 높은 신관과 비교하면 옛 본관의 크기와 비례가 한눈에 들어와요. 이 일대에서 백화점이 영업한 역사는 지금 건물이 세워지기 전까지 올라갑니다.",
   "일본의 미쓰코시는 1906년 서울에 임시출장소를 냈습니다. 처음에는 포목과 잡화를 팔던 상점이었고, 점차 영업을 확대했어요. 1930년 새 건물은 경성부청이 이전하며 비운 터에 들어섰습니다. 당시 충무로와 명동 일대는 일본인 상인들이 많이 모여 있던 남촌 상권이었습니다. 부청이 떠난 도심의 큰 자리를 일본계 백화점이 차지하면서 주변은 쇼핑의 중심지로 성장했습니다.",
   "백화점은 물건을 파는 방식도 달랐습니다. 값을 흥정하는 대신 상품에 정해진 가격을 붙이는 정찰제를 시행했어요. 여러 종류의 상품을 한 건물에서 비교해 보고, 진열창을 통해 새로 나온 물건을 구경할 수 있었습니다. 큰 자본으로 상품을 한꺼번에 많이 사들여 판매하는 방식이었죠. 손님들은 물건을 사는 일뿐 아니라, 층별 매장을 돌아다니며 새로운 옷차림과 생활용품을 구경하는 일에도 익숙해졌습니다.",
   "안에는 엘리베이터와 식당, 커피를 마실 수 있는 곳이 있었고 옥상에는 정원을 마련했습니다. 쇼핑을 마친 뒤 먹고 쉬는 시간을 건물 안에서 보낼 수 있었던 거예요. 이상의 소설 ‘날개’에는 주인공이 거리를 헤매다 이 백화점 옥상에 올라가는 장면이 나옵니다. 옥상에서 지난 삶을 돌아보는 주인공의 모습은, 화려한 매장의 풍경과는 또 다른 분위기를 전합니다. 물건을 살 형편이 되는 사람과 구경하러 온 사람이 같은 건물에 모였습니다.",
